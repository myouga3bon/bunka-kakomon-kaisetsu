<script>
const D={"S5_math": [{"t": "問1 計算・方程式の小問", "items": [["(1)", "−2/81", "−2/9 ÷ (−3)² = −2/9 ÷ 9 = −2/9 × 1/9 = −2/81。わり算は逆数のかけ算にする。"], ["(2)", "−3/2", "(−13+7) = −6、(1/2)² = 1/4 なので −6 × 1/4 = −3/2。かっこの中を先に計算する。"], ["(3)", "a³/2", "a²b ÷ 2b² × ab = a²b × ab / (2b²) = a³b² / 2b² = a³/2。÷は分母に回して約分する。"], ["(4)", "36xy + 9y²", "展開して引く。(2x+5y)² = 4x²+20xy+25y²、(2x−4y)² = 4x²−16xy+16y²。差は 36xy + 9y²。（A²−B²=(A+B)(A−B) でも (4x+y)(9y)×… と同じ結果）"], ["(5)", "5√6 − 6", "√24=2√6、√18×√2=√36=6、√54=3√6。2√6 − 6 + 3√6 = 5√6 − 6。"], ["(6)", "x = 5", "両辺を10倍して 8x+30=14x → 30=6x → x=5。"], ["(7)", "x = 0, 9", "2x(x−9)=0 より x=0, 9。（解答用紙の「0.9」は「0, 9」の意味）"], ["(8)", "150", "x²+6xy+9y² = (x+3y)²。x+3y = 2√6+3√6 = 5√6 なので (5√6)² = 25×6 = 150。式を因数分解してから代入するとラク。"]]}, {"t": "問2 小問集合", "items": [["(1)", "ウ・オ", "96 = 2⁵×3。√(96/n) が整数になるには 96/n が平方数。n=6→16、n=24→4で整数。n=2→48、3→32、16→6 は平方数でない。"], ["(2)", "a = −4", "y=ax−3 の変化の割合は常に a。y=x² の −3→−1 の変化の割合は {(−1)²−(−3)²}÷{−1−(−3)} = (1−9)÷2 = −4。よって a=−4。"], ["(3)", "a = 13、中央値 12.5点", "平均12.8×10人=合計128。a以外の合計は115なので a=13。並べると 8,9,10,11,12,13,15,15,17,18。10個なので5番目と6番目の平均 (12+13)÷2=12.5。"], ["(4)", "イ", "円柱は半径4・高さ8。表面積=2π×16+8π×8=96π、球は4π×16=64π。96π÷64π=3/2。体積は円柱128π、球256π/3 で円柱は球の3/2倍（ウ・エは誤り）。"], ["(5)", "65度", "直径ABと下の弦は平行。25°の錯角から、弧は 50°（平行な弦にはさまれた弧は等しい）。下半円180°から 50°+50° を引くと弧は80°。xが対する弧は 50+80=130° なので円周角は 65°。"], ["(6)", "12倍", "点Dは中点なので △ABD=△ABC の1/2。Eは BD の中点。座標を B(0,0)、C(2,0)、A(0,2) と置くと D(1,1)、E(½,½)、直線AEとBCの交点Fは (2/3, 0)。△BEF=1/6、△ABC=2 なので 12倍。（メネラウスの定理でも BF:FC=1:2 が出る）"], ["(7)", "80cm³", "正四角錐A-BCDEの体積240。△BCE は底面の半分なので 三角錐A-BCE=120。AF:FB=1:2 より F-BCE は高さが 2/3 倍になるので 120×2/3=80。"]]}, {"t": "問3 連立方程式の利用（リサイクル）", "items": [["(1)", "エ", "空き缶は4%減なので今月は (1−0.04)y = 96/100 y。つまり「今月の空き缶の回収量」。"], ["(2)", "112/100 x", "ペットボトルは12%増なので 今月は (1+0.12)x = 112/100 x。"], ["(3)", "ペットボトル168kg、空き缶96kg", "x+y=250、1.12x+0.96y=264。上の式を0.96倍して 0.96x+0.96y=240 を引くと 0.16x=24 → x=150、y=100。今月は 150×1.12=168kg、100×0.96=96kg。※「先月の量」ではなく「今月」を聞かれている点に注意。"]]}, {"t": "問4 関数（反比例と y=ax²）", "items": [["(1)", "4", "円は x軸・y軸の両方に接するので中心は (r, r)。①y=16/x 上にあるので r×r=16、r>0 より r=4。半径は4。A(4,4)。"], ["(2)", "a = 1/4", "②は A(4,4) を通るので 4=a×16 より a=1/4。"], ["(3)", "5", "x=−2 のとき B(−2,−8)（①）、C(−2,1)（②）。BC=9 を底辺にすると高さはAのx座標との差 4−(−2)=6 で △ABC=27。△ACDは 13.5。D(d,0) として △ACD を座標で計算すると |3d+12|/2=13.5 → 3d+12=27 → d=5。"]]}, {"t": "問5 図形（回転移動と合同の証明）", "items": [["(1)ア〜エ", "ア：CGD　イ：GD　ウ：EDC　エ：EDC", "正方形ABCDを点Dのまわりに回転させたものが EFGD なので、A→E、C→G に移る。△AED と △CGD が合同。ED=GD（正方形の辺）、∠ADE=90°−∠EDC、∠CDG=90°−∠EDC。"], ["(1)オ", "2組の辺とその間の角", "AD=CD、ED=GD、∠ADE=∠CDG の3つが「2組の辺とその間の角がそれぞれ等しい」なので合同。"], ["(1)カ", "対応する辺の長さ", "合同な図形では対応する辺の長さは等しい。だから AE=CG。"], ["(2)", "54度", "ED=AD（同じ正方形の辺）なので △ADE は二等辺三角形。∠DAE=72° → ∠ADE=180−72×2=36°。∠EDC=90−36=54°。四角形DEHCの内角の和360°から ∠E=90°、∠C=90°、∠EDC=54° を引くと ∠EHC=126°。∠EHB=180−126=54°。"]]}, {"t": "問6 規則性（数の表）", "items": [["(1)", "a=25、b=88", "右へ1列で+2、下へ1行で+3。(7,4)：(3,4)=13 から下に4行 → 13+3×4=25。(30,1)：1列目は1,4,7,…で1+3×29=88。"], ["(2)", "ウ", "1列目の (m,1)=1+3(m−1)=3m−2。そこから右に(n−1)列で +2(n−1)。合計 3m−2+2n−2 = 3m+2n−4。例：(3,4)=9+8−4=13 で確認できる。"], ["(3)", "c：5m−4、d：5m、e：5m+2", "(m,m)=3m+2m−4=5m−4。5つの数は 5m−4, 5m−2, 5m, 5m+2, 5m+4 で和は 25m=5×5m。(m,m+2)=3m+2(m+2)−4=5m。よって5倍。"]]}], "S5_english": [{"t": "問1 対話文（適切な文を選ぶ）", "items": [["(1)", "ウ", "「このぼうしはいくらですか」→「3,000円です」。How much（値段）にはIt's 3,000 yen.で答える。"], ["(2)", "ウ", "「（　）」— 「いい考えだね。図書館でやろう」。直前に「放課後に勉強しませんか（Why don't we ～?）」と誘ったと考える。"], ["(3)", "エ", "電話の会話。This is Bob.（こちらはボブです）に対して Speaking.（私です）と答えている → May I speak to Meg, please?（メグさんをお願いします）が自然。"]]}, {"t": "問2 語を書く（頭文字つき）", "items": [["(1)", "world", "「ナイル川は世界で一番長い川です」。in the world＝世界で。"], ["(2)", "month", "「3月は1年の3番目の月です」。"], ["(3)", "present", "「お誕生日おめでとう。これはあなたへのプレゼントです」。a present for you。"], ["(4)", "noisy", "「聞こえません」→「このへんはうるさいです」。n＋4文字で noisy。"]]}, {"t": "問3 適語選択", "items": [["(1)", "エ", "have＋過去分詞（経験）。「一度～したことがある」→ have seen。"], ["(2)", "イ", "「郵便局はどこですか。本屋のとなりです」→ Where。"], ["(3)", "ウ", "How long（どのくらいの間）に「30分ぐらい」と答える → for ～（期間）。"], ["(4)", "ア", "a book written in English（英語で書かれた本）。過去分詞の後置修飾。"], ["(5)", "イ", "water は数えられない名詞。「ほとんど～ない」の little を選ぶ（many・a few は数えられる名詞用）。"]]}, {"t": "問4 同じ意味の書きかえ", "items": [["(1)", "There / are", "Japan has about 130 million people. ＝ There are about 130 million people in Japan."], ["(2)", "old / as", "「私の高校は姉の高校より古い」＝「姉の高校は私の高校ほど古くない」。not as old as ～。"], ["(3)", "at / swimming", "a good swimmer ＝ good at swimming（泳ぐのが得意）。at のあとは動名詞。"], ["(4)", "During / his", "While he was staying ＝ During his stay。while＋文、during＋名詞。"]]}, {"t": "問5 並べかえ（3番目と5番目）", "items": [["(1)", "3番目：カ　5番目：ウ", "What birds can we see in this forest? （キ・オ・カ・イ・ウ・ア・エ）"], ["(2)", "3番目：カ　5番目：オ", "The students singing on the stage are members of the chorus club. （エ・キ・カ・イ・オ・ウ・ア）singing 以下が students を後ろから説明する。"], ["(3)", "3番目：イ　5番目：オ", "What are those children looking at on the hill? （ウ・キ・イ・カ・オ・エ・ア）"], ["(4)", "3番目：カ　5番目：イ", "Shall I show you another color of that shirt? （キ・ウ・カ・ア・イ・オ・エ）"], ["(5)", "3番目：オ　5番目：ア", "My mother gets up early in the morning. （カ・ウ・オ・イ・ア・キ・エ）"], ["(6)", "3番目：イ　5番目：カ", "I will finish doing my math homework soon. （ウ・オ・イ・キ・カ・ア・エ）finish は「～し終える」で、あとに doing（動名詞）。"]]}, {"t": "問6 長文：オンラインショッピング（討論）", "items": [["(1)①", "ウ", "「日曜日はとても疲れているので、その日は（外出したくない）」。直前の so tired that ～ の結果を表す文。"], ["(1)②", "エ", "アンの発言。オンライン書店は欲しい本がほぼそろっており、書店を歩き回る必要がないので「時間を節約するのに役立つ（save our time）」。"], ["(2)", "どのようにインターネット（オンライン）を使うべきか考えること。", "森先生の最後の発言「今日からそれをどのように使うべきか考えるのがよい」から。（別解：使い方をよく考えて利用すること）"], ["(3)(a)", "ア", "セイオリは「オンラインの方が物が届くのに時間がかかる。だからお店で買うほうがむしろいい」と言っている → Kota は買い物に行けば「すぐ手に入れられる」。"], ["(3)(b)", "ウ", "コウタの意見に賛成（オンラインで買うのはよい）なのはアン（問題ない・時間の節約になる）。ユキ・セイオリ・ジャックは反対。ナオミは自分のルールを話し、森先生はナオミのやり方がよいと言っている。"], ["(4)", "イ", "ナオミは「オンラインで買うときは母に注文してもらう」。ア・ウ・エは本文と合わない。"], ["(5)", "ウ", "アンは「オンライン書店には欲しい本がほとんどある」ので、買い物に行くより欲しい物を探しやすいと考えている。"]]}, {"t": "問7 長文：メアリーとケンのハイキング計画（メール）", "items": [["(1)①", "ウ", "メアリーのメール。コースCは一番簡単だが「そのコースには見るものがない（the course doesn't have anything to see）」ので退屈かもしれない。"], ["(1)②", "エ", "ケンのメール。「コースがきつすぎて続けられないとわかったら、頂上に行くのをあきらめよう（give up going to the top）。そして途中で昼食にしよう」。"], ["(2)(a)", "イ", "メアリーの計画は9:30スタート、コースCは2時間 → 11:30ごろ頂上に着く → 正午前に着ける。"], ["(2)(b)", "ア", "ケンはコースBを選びたい理由として、写真で見た景色に感動し、自分の目で見たいと書いている。"], ["(3)", "メアリーの計画：エ（No.113）　ケンの計画：ア（No.107）", "メアリーは High West に9:15ごろ着く電車 → No.113（9:13着）。ケンは「メアリーの計画より1時間早く High West に着く必要がある」→ 8:15ごろ → No.107（8:08着、East Lake 7:27発）。No.109 は 8:36 着で遅い。※手書き解答はケンを「イ」としているが、「1時間早く」で計算すると No.107（ア）。"], ["(4)", "エ", "コースBの途中で海が見えるチャンスがある（ケンのメール・ロコミ）。アは計画が違う、イは「1時間」ではなく本文はコースAより短い、ウは傘は不向きと書いている。"]]}, {"t": "問8 自由英作文（10〜15語）", "items": [["Last weekend, I ～", "例：Last weekend, I played baseball with my friends in the park.", "12語。過去形（played）を使い、主語・動詞のある1文で書く。10〜15語に収める。つづりミス・時制ミスに注意。（例：Last weekend, I went to a bookstore and bought a new English dictionary.）"]]}], "S5_science": [{"t": "問1-I 岩石のつくり（火成岩）", "items": [["(1)あ・い・う", "あ：斑晶　い：石基　う：斑状組織", "Aは大きな鉱物（斑晶）のまわりを細かい粒やガラス質（石基）が囲む「斑状組織」。マグマが地表や地表付近で急に冷えた火山岩のつくり。"], ["(2)", "①イ　②エ", "Bは大きな鉱物がすき間なく組み合わさる「等粒状組織」。マグマが地下の深いところで、ゆっくり冷えてできる（深成岩）。"], ["(3)", "ウ", "Bは全体的に白っぽく等粒状組織 → 深成岩のうち白っぽい花こう岩。玄武岩・流紋岩は火山岩、はんれい岩は黒っぽい深成岩。"], ["(4)", "エ", "岩石の色から判断する。黒っぽい（A）→ねばりけが弱いマグマ、白っぽい（B）→ねばりけが強いマグマ。"]]}, {"t": "問1-II 天気図と気団", "items": [["(1)", "1024hPa", "等圧線は4hPaごとに引かれ、20hPaごとが太線。Aは1020の太線から1本分高い線上。"], ["(2)①", "温暖前線", "前線Xは半円（▲でなく●）の記号の前線。暖気が寒気の上にはい上がる。"], ["(2)②", "エ", "P−Qは寒冷前線をはさむ断面。寒気が暖気の下にもぐり込み、暖気が急に押し上げられる（傾きが急）。"], ["(3)", "ウ", "この天気図は西高東低の冬型 → 大陸にできるシベリア気団（冷たく乾燥）。"], ["(4)", "イ", "冬の季節風は北西から。"], ["(5)", "ア", "冬の太平洋側は、乾燥した晴れの日が続く（日本海側は雪）。"]]}, {"t": "問2-I 気体の区別", "items": [["(1)", "CO₂、NH₃（二酸化炭素・アンモニア）", "化合物は2種類以上の元素でできた物質。水素H₂・窒素N₂・塩素Cl₂は単体。"], ["(2)", "B：塩素　C：二酸化炭素", "刺激臭 → アンモニアか塩素（B・D）。水にとけてペットボトルがへこむ → 水にとけやすい気体。フェノールフタレインで赤に変化 → アルカリ性 → D＝アンモニア。Bは刺激臭で酸性（変化なし）の塩素。無臭で水に少しとけるCは二酸化炭素。Aは窒素、Eは水素（音を出して燃える）。"], ["(3)", "2H₂ + O₂ → 2H₂O", "水素が燃える（酸素と化合）と水ができる。"], ["(4)", "イ", "窒素Aと水素Eは、密度（軽さ）のちがいで区別できる。ポリエチレンの袋に入れて口を閉じて置くと、軽い水素は浮き上がる。石灰水・リトマス紙はどちらも変化なし。"]]}, {"t": "問2-II マグネシウムの加熱", "items": [["(1)", "発熱反応", "熱を周囲に出して温度が上がる反応は「発熱反応」（吸熱反応の反対）。"], ["(2)", "MgO", "2Mg + O₂ → 2MgO。酸化マグネシウム。"], ["(3)", "グラフ", "結びついた酸素＝酸化物−マグネシウム。(0.30,0.20)(0.45,0.30)(0.60,0.40)(0.75,0.50)(0.90,0.60) の5点を取り、原点を通る直線を引く。"], ["(4)", "3.50g", "Mg：酸化物＝3：5。2.10：x＝3：5 より x＝3.50。"], ["(5)", "0.48g", "加熱後の質量1.18g−もとの0.90g＝結びついた酸素0.28g。Mg：O＝3：2より反応したMg＝0.28×3/2＝0.42g。残り＝0.90−0.42＝0.48g。"]]}, {"t": "問3-I ヒトの消化と血液", "items": [["(1)", "イ", "白血球は病原体を分解する。アは赤血球（ヘモグロビンが酸素を運ぶ）、ウは血しょう、エは血小板の説明で、入れかわっている。"], ["(2)", "あ：ブドウ糖　い：アミノ酸　う：モノグリセリド", "デンプン→ブドウ糖、タンパク質→アミノ酸、脂肪→脂肪酸とモノグリセリド。"], ["(3)", "肝臓", "小腸で吸収されたブドウ糖の一部は肝臓でグリコーゲンに合成され、たくわえられる。"], ["(4)", "イ・ウ", "タンパク質を分解する消化酵素は、胃液（ペプシン）とすい液（トリプシンなど）。だ液はデンプン、胆汁は脂肪の消化を助ける（消化酵素ではない）。"], ["(5)", "X：酸素　Y：二酸化炭素　Z：水", "細胞での呼吸：栄養分＋酸素 → 二酸化炭素＋水＋エネルギー。"]]}, {"t": "問3-II 細胞分裂の観察", "items": [["(1)", "ウ", "根をおして広げ、細胞の重なりを少なくして観察しやすくする。"], ["(2)", "あ：少なく　い：暗く", "倍率を高くすると、見える範囲がせまくなり細胞の数は少なく、視野は暗くなる。"], ["(3)", "[1]：B　[2]：A", "根の先端（C付近）ほど細胞分裂がさかん。[3]はさかんに分裂中の細胞 → 先端のC。[1]は細胞が長く育っている部分で根もとに近いA、[2]はその中間のB。（解答例の記号に従う）"], ["(4)", "染色体", "分裂のときに見られるひも状のもの。染色液（酢酸オルセイン）で染まる。"], ["(5)", "a → c → d → b → e", "核の中に染色体が現れる（a）→ 染色体が中央に並ぶ（c）→ 両端に分かれていく（d）→ 細胞が2つに分かれはじめる（b）→ 2つの細胞（e）。"], ["(6)", "減数分裂", "生殖細胞をつくるときの分裂。染色体の数が半分になる。"]]}, {"t": "問4-I 台車の運動", "items": [["(1)", "図", "重力（真下の矢印）を対角線とする平行四辺形をかく。斜面に平行な分力（斜面下向き）と斜面に垂直な分力（斜面に垂直に押す向き）の2つ。"], ["(2)", "e", "テープの長さの増え方がeで小さくなり、f以降は一定。傾きがなくなり水平面に入ったと考えられる。"], ["(3)", "64cm/s", "5打点＝0.1秒。b・cの2区間は 4.8＋8.0＝12.8cm、0.2秒。12.8÷0.2＝64cm/s。"], ["(4)", "等速直線運動", "f〜iは長さが同じ → 一定の速さでまっすぐ進む。"], ["(5)", "ア", "斜面の傾きを大きくすると、斜面方向の分力が大きくなり加速が大きい。水平面に着くまでの時間は短く、着いたときの速さは速くなる。"]]}, {"t": "問4-II 電熱線の発熱", "items": [["(1)", "伝導（熱伝導）", "物体の高温部から低温部へ熱が伝わる現象。"], ["(2)", "あ：B　い：12", "6Vで消費電力が一番小さい（3W）Bが、電流が小さいので抵抗が最大。電流 3W÷6V＝0.5A、抵抗 6V÷0.5A＝12Ω。"], ["(3)", "3600J", "電熱線Dは12W。12W×(5×60秒)＝3600J。（発熱量＝電力×時間）"], ["(4)", "あ：比例　い：大きく", "電圧と電流が一定なら発熱量は時間に比例。電力が大きいほど発熱量も大きい。"], ["(5)", "オ（38℃）", "並列なので、A・Dそれぞれに6Vがかかり同じ発熱をする。グラフから5分でA＝3.0℃、D＝6.0℃上昇 → 5分で9.0℃、10分で18.0℃。20.0＋18.0＝38.0℃。"]]}], "S5_social": [{"t": "問1 世界地理", "items": [["(1)", "ウ", "緯線に沿って西へ動くので緯度は北緯35度のまま。経度は東経139度−160度＝−21度 → 西経21度。"], ["(2)①", "オセアニア州", "Xはオーストラリア。"], ["(2)②", "インド洋・太平洋", "オーストラリアは西でインド洋、東で太平洋に面する（大西洋には面さない）。"], ["(3)", "シドニーとロサンゼルス", "時差は経度差15度で1時間。標準時の目安は シドニー＋10時間、東京＋9、ローマ＋1、ブラジル−3、ロサンゼルス−8。最大はシドニーとロサンゼルスの18時間差。"], ["(4)①", "C", "雨温図は年平均気温27.8℃で1年中高温・多雨 → 赤道に近い東南アジア（マレーシア）。"], ["(4)②", "イ", "熱帯雨林気候。一年中、多様な植物が生いしげる森林。アは乾燥帯（ステップ）、ウはツンドラ、エは冷帯（タイガ）。"], ["(5)", "ウ", "地図の説明：このような世界地図は面積が正しく表されない。緯線と経線が直角に交わる地図は高緯度ほど実際の面積より大きく表される。XよりYが大きく見えるのはそのため。"], ["(6)", "ブラジル", "大豆・さとうきび・コーヒー豆の生産量がいずれも世界1位の国。"]]}, {"t": "問2 日本の諸地域", "items": [["(1)①", "8cm", "2km＝200,000cm。200,000÷25,000＝8cm。"], ["(1)②", "ウ", "寺院の記号（卍）は地形図の北側に多く見られる。ア・イは地図記号や川の流れる向きの読み取りが合わない。地図記号（寺院は卍、博物館・美術館は別の記号）を覚えておく。"], ["(1)③", "X：三角州　Y：イ（長州）", "河口付近に土砂がたまってできた地形は三角州。萩は長州藩（現在の山口県）の城下町。"], ["(2)①", "フォッサマグナ", "日本列島を東北日本と西南日本に分ける大地溝帯。"], ["(2)②", "高知市：イ　高松市：ウ　鳥取市：ア", "高知＝太平洋側で夏（6月）の雨が多い（イ360mm）。高松＝瀬戸内で1年を通して降水量が少ない（ウ）。鳥取＝日本海側で冬（12月）の雪・雨が多い（ア）。"], ["(2)③", "富山県：A　長崎県：C", "A…米の産出額が大きく、化学・鉄鋼もある → 富山県。B…果実が多い → 愛媛県。C…農業・工業とも小さい → 長崎県。D…製造品出荷額が最大 → 千葉県。E…農業産出額が最大 → 北海道。"], ["(2)④", "国内での雇用人数が減少していくと考えられる。", "海外生産台数が増え、国内生産台数が減っているので、国内の工場で働く人が減る（産業の空洞化）。"]]}, {"t": "問3 原始・古代", "items": [["(1)", "イ", "縄文時代は狩りや採集が中心で、豊かな実りを祈って土偶をつくった。埴輪は古墳時代。"], ["(2)①", "前方後円墳", "円形と方形を合わせた形の古墳。"], ["(2)②", "イ", "実際は大和政権は百済・加耶と結んで、高句麗や新羅と戦った。協力する相手が逆なので不適切。"], ["(3)①", "ア", "福岡県に置かれた九州の行政・防衛・外交の機関は大宰府。"], ["(3)②", "税負担が男子だけなので、うそをついて女子にしておくと税を負担しなくてもいいから。", "資料より、租は6歳以上の男女だが、調・庸・雑徭は男子だけが負担。女子として登録すれば負担を逃れられる。"], ["(4)①", "征夷大将軍", "坂上田村麻呂は東北地方の蝦夷を征討するため任命された。"], ["(4)②", "浄土信仰", "阿弥陀仏にすがり極楽浄土に生まれ変わることを願う信仰。平等院鳳凰堂などが建てられた。"], ["(5)", "ア → オ → エ", "古墳時代と奈良時代の間：聖徳太子の摂政（593）→ 大化の改新（645）→ 大宝律令（701）。ウ平将門の乱（939）とイ院政（1086）は平安時代。"]]}, {"t": "問4 近世", "items": [["(1)", "カ（X：ポルトガル、Y：種子島、Z：堺）", "1543年、ポルトガル人が種子島に鉄砲を伝えた。のち堺（大阪）や国友（滋賀）などで大量生産された。（解答用紙には「ポルトガル」と書かれている）"], ["(2)①", "イ", "1590年、豊臣秀吉が小田原攻めでほろぼしたのは関東の北条氏。"], ["(2)②", "ウ", "石見銀山は島根県（地図のウ）。2007年に世界文化遺産に登録。"], ["(3)", "幕藩体制", "将軍（幕府）と大名（藩）が土地と人々を支配する仕組み。"], ["(4)", "ア → エ → ウ → イ", "バテレン追放令（1587）→ 全国に禁教令（1612〜13）→ 日本人の海外渡航・帰国禁止（1635）→ オランダ商館を出島へ（1641）。"], ["(5)", "①エ　②ア　③ウ　④イ", "①株仲間の解散・農民を故郷へ帰す → 天保の改革（水野忠邦）。②上げ米（参勤交代の期間短縮の代わりに米を納めさせる）→ 享保の改革（吉宗）。③昌平坂学問所・朱子学 → 寛政の改革（松平定信）。④株仲間を奨励して営業税 → 田沼意次の政治。"], ["(6)", "ウ", "アメリカでは1861〜65年に南北戦争がおこり、日本との貿易が大きく減った。"], ["(7)", "戊辰戦争", "鳥羽・伏見の戦いから始まる、旧幕府軍と新政府軍の一連の戦い（1868〜69）。"]]}, {"t": "問5 公民（人権・政治・情報化）", "items": [["(1)①", "エ", "1919年のワイマール憲法が世界で初めて社会権（生存権）を規定した。"], ["(1)②", "ウ", "憲法第28条は労働三権（団結権・団体交渉権・団体行動権）。アは団結権、イは団体交渉権、エは団体行動権。ウの雇用保険の支給は社会保障（生存権）の話。"], ["(1)③", "最高法規", "憲法第98条：憲法は国の最高法規。"], ["(2)①", "エ", "直接民主制の例は、憲法改正の国民投票、最高裁判所裁判官の国民審査、地方自治の直接請求。参議院議員の通常選挙は間接民主制（代表者を選ぶ）。※解答用紙の手書きは「ウ」と読めるが、ウは直接請求（直接民主制）で適切なので、適切でないのはエ。"], ["(2)②", "C → D → B → A", "衆議院解散 → 総選挙 → 特別会 → 内閣総理大臣の指名 → 国務大臣の任命。"], ["(2)③", "a：控訴　b：上告", "第一審（地方裁判所）→ 控訴（高等裁判所）→ 上告（最高裁判所）。"], ["(2)④", "地方交付税交付金、東京都はY", "地方公共団体の財政格差をおさえるために国から配分されるのは地方交付税交付金。Xは地方交付税の割合が高い（財政の弱い鳥取県）、Yは地方税が多く交付税がほとんどない東京都。"], ["(3)", "イ・エ", "ア：80歳以上は令和元年の方が高いが他の層では異なる。ウ：のびが最大は80歳以上（約20→約58％）。オ：平成29年の6〜12歳は9割未満。イ（80歳以上が最も低い）、エ（令和3年は約99％と約28％で3倍以上）が正しい。"]]}], "S5_japanese": [{"t": "問一 漢字（読み・書き）", "items": [["(1)①", "ごい", "語彙（ごい）＝ある言語・分野で使われる言葉の全体。「彙」は「集める」の意味。"], ["(1)②", "がんこ", "頑固。「頑」は「かたくな」。"], ["(1)③", "すこ（やか）", "健やか。「健」の訓読み「すこ（やか）」。"], ["(1)④", "と（げる）", "成し遂げる。「成す」「遂げる」の送りがなにも注意。"], ["(1)⑤", "けんま", "研磨。「磨」は「みがく」。"], ["(2)①", "ウ", "作業の「効率」。ウ「薬の効果」が同じ「効」。アは成功、イは温厚、エは香水。"], ["(2)②", "イ", "昆虫「採集」。イ「人材を採用する」が同じ「採」。アは再会、ウは国際、エは災害。"], ["(2)③", "ア", "礼儀正しい「態度」。ア「生態系」が同じ「態」。イは退場、ウは包帯、エは隊列。"], ["(2)④", "エ", "君に全てを「委ねる」。エ「図書委員」が同じ「委」。アは周囲、イは移動、ウは衣服。"], ["(2)⑤", "イ", "「快い」風がふく。イ「軽快な音楽」が同じ「快」。アは改良、ウは分解、エは機械。"]]}, {"t": "問二 小説（沢木耕太郎『彼らの流儀』より）", "items": [["あらすじ", "—", "「彼」はバスで席を譲るかどうか悩むのがいやで、席にあえて座らない。老女が若い母親に大根の半分をあげようとするやりとりを聞き、一人暮らしの自分の母親を思い出し、母親の悩みに気づかないふりをしている自分を省みる。"], ["(1)", "d", "a「少し」・b「多少」・c「ほとんど」は副詞。d「素直に」は形容動詞「素直だ」の連用形で、品詞がちがう。"], ["(2)", "ウ", "席に座ると、「譲るべきか、譲らなくていいか」と悩まなくてはならない。それがいやで、あえて座らなかった。（本文の「譲るべきかどうか悩まなくてはならないこと」に対応）"], ["(3)", "半分に切られた太い大根", "老女は「これ、もらっていただけませんか」と、手に持っていた半分に切られた太い大根をあげようとしている（11字）。"], ["(4)", "たぶん、そ", "彼が老女のことを推測した形式段落は「たぶん、その老女は…」で始まる。初めの5字は句読点も1字に数える。"], ["(5)", "初め：母親がひと　終わり：理解できた", "「母親がひとりで暮らしているということの意味が理解できた」（27字）。老女の姿を通して、ひとり暮らしの母親の苦労を実感した。"], ["(6)", "イ", "老女の「一本では多すぎるが一本でなければ買えない」という悩みを聞き、半分の大根をもらってほしいと願う。それは老女を自分の母親と重ね合わせて見ているから。"], ["(7)", "ア", "「彼」だけでなく、周りの乗客も老女が大根をもらってもらえるよう助けてほしいと内心で思っていた。それがかなったので空気がやわらいだ。"], ["(8)", "例：母親にいくつもの小さな悩みを押しつけていることをわかっていて、気づかないふりをしていること。", "「彼」は買い物のたびに半分の大根のことで悩む母親のことをわかっていながら、あえて考えないようにしてきた。それは、席を譲るべき人が目の前にいるのに気づかないふり（狸寝入り）をする男と「ほとんど同じ」だと気づいた。"]]}, {"t": "問三 論説（榎本博明『「さみしさ」の力』より）", "items": [["要旨", "—", "スマホなどで外的刺激に反応し続けると、思考停止になる。あえて接続を切り、退屈な時間（一人の時間）をもつことで、自分の内側から考えが湧き、人間に深みが出る。"], ["(1)", "エ", "a：前の「外的刺激を利用するのも有効だ」の具体例（読書）を挙げているので「たとえば」。b：前の「つながりを求めてしまう」に対し、「受け身の生活から脱するにはあえて退屈な時間をもつことも必要」と反対の考えを述べるので逆接「だが」。"], ["(2)", "自分の中に沈潜する（または 自分の世界に沈潜する）", "「だれにも邪魔されない一人の時間」を、自らあれこれ思いをめぐらしたり考えを深めたりして「自分の中に沈潜する時」にするべきだと述べている。※解答用紙の「自分の世界に没頭する」は、本文では「できない」と否定の文脈で出てくる語。"], ["(3)", "読書は思考を活性化するのに対して、SNSなどは情報に反応するばかりで思考停止状態になってしまう。", "読書は本の言葉や視点に刺激を受け、さらに言葉が湧き出てくる（活性化）。SNSなどは飛び込んでくる情報に反応するだけで、思考停止状態になる。"], ["(4)i", "ウ", "「あえて刺激を絶ち」「退屈でしかたがない状況を自ら生み出す」とは、思い切って接続（インターネット）を遮断すること。※解答用紙は「イ」だが、本文の「接続を極力切断する」からウが正しい。"], ["(4)ii", "ア", "退屈の時間にこそ、内側から何かがこみ上げ、自分の心の声が聞こえてきて、考えを深められるから。"], ["(5)", "イ", "「一人でいられないことの弊害」＝ネットなど過剰な刺激に翻弄され、自分の考えを深められなくなること。"], ["(6)", "例：私は、一人の時間をもつことで人間は成長すると思う。例えば、休日をいつも友達と過ごすのではなく、一人で気になる展覧会に行くと、自分だけの感想や新しい価値観に気づける。こうした経験が考えを深めると思う。（約100字）", "条件：①身近な具体例を入れる、②80〜100字。「賛成か反対か」「具体例」「理由」の順に書くとまとめやすい。"]]}, {"t": "問四 古文（『枕草子』）", "items": [["大意", "—", "九月二十日すぎ、初瀬に参詣し粗末な家に泊まった。夜ふけに月の光が窓から差し込み、人々が横たわる衣の上に白く映っているのが、しみじみと心にしみた。そういうときに、人は歌をよむのだ。"], ["(1)", "さようなるおりぞ", "歴史的仮名遣い→現代仮名遣い：「やう」→「よう」、「をり」→「おり」、「さやうなる」→「さようなる」。"], ["(2)", "ウ", "「洩る」は「もれる」の意味。「月の窓より洩りたりしに」＝月の光が窓から（部屋に）もれてさしていたときに。"], ["(3)i", "そのようなとき", "「さやうなるをりぞ」＝「そのようなときこそ」の意味。"], ["(3)ii", "エ", "「いみじうあはれとおぼえしか」と強く心を動かされたときに、昔の人は歌をよんだ。"]]}], "S6_math": [{"t": "問1 計算・方程式の小問", "items": [["(1)", "−64", "−(4/3)² × (−6)² ＝ −16/9 × 36 ＝ −64。−(4/3)²は「−をつけた2乗」なので符号はマイナスのまま。"], ["(2)", "7", "20−5² ＝ 20−25 ＝ −5。−35 ÷ (−5) ＝ 7。"], ["(3)", "(8a+10b)/9", "通分して (9a+3b) − (a−7b) ＝ 8a+10b。→ (8a+10b)/9。かっこをつけて引くのでb の符号に注意。"], ["(4)", "a(3x−2)²", "共通因数 a をくくり出し、9x²−12x+4 ＝ (3x−2)²。"], ["(5)", "4√6", "−24/√6 ＝ −4√6。√32×(−2√3) ＝ −8√6。−4√6 −(−8√6) ＝ 4√6。"], ["(6)", "x = 10", "0.4x+2 ＝ 0.5x+1 → 1 ＝ 0.1x → x ＝ 10。"], ["(7)", "x = 1/3、y = 4/3", "上の式を6倍：2x−5y＝−6、下の式を8倍：4x+5y＝8。たすと 6x＝2 → x＝1/3。代入して y＝4/3。"], ["(8)", "イ", "S＝2πrh の両辺を 2πr でわると h＝S/(2πr)。"]]}, {"t": "問2 小問集合", "items": [["(1)", "−36−24√2", "a²−2ab−3b² ＝ (a−3b)(a+b) に因数分解。a+b＝6、a−3b＝3−√2−9−3√2＝−6−4√2。積は −36−24√2。"], ["(2)", "1/4", "大小2個のさいころで36通り。Pは右回りにa（大）、Qは左回りにb（小）進む。同じ頂点で出会うのは a+b が4の倍数のとき。和が4：3通り、8：5通り、12：1通りで計9通り。9/36 ＝ 1/4。"], ["(3)", "ア：②　イ：③　ウ：③　エ：①", "数学は Q1＝45・Q3＝85（四分位範囲40）、国語は Q1＝40・Q3＝75（35）。ア：国語のほうが大きいとはいえない（②）。イ：箱ひげ図では平均点はわからない（③）。ウ：85点の生徒がいるかは、最大値・四分位数の位置だけではわからない（③）。エ：第1四分位数が数学45点・国語40点なので、36人の1/4（9人）以上が45点以下（①）。"], ["(4)", "ウ", "立方体の面を、AからEFを通ってGまでの線が一直線になるよう展開する。展開図ウのように、辺EFをまたぐ2つの面が横にならんだ図で、A〜Gが直線になるものが最短の糸の通り道。"], ["(5)", "65度", "AB∥DO より ∠OAB＝∠AOD＝50°（錯角）。OA＝OB の二等辺三角形なので ∠AOB＝80°。∠BOD＝80°＋50°＝130°。円周角 ∠BCD＝130°÷2＝65°。"], ["(6)", "12cm", "水の量が1/8になると、水面の相似比は 1/2（体積比＝相似比の3乗）。深さは 24×1/2 ＝ 12cm。"], ["(7)", "1/24倍", "平行四辺形を、B(0,0)、C(3,0)、A(0,3)、D(3,3) の正方形に置いて考える（面積の比は変わらない）。O(1.5,1.5)、E(2,0)。直線DEとACの交点F(2.25,0.75)、OG∥BC なので G(2.5,1.5)。△OFG＝OG(1)×高さ(0.75)÷2＝0.375。0.375÷9＝1/24。"]]}, {"t": "問3 連立方程式（予防接種）", "items": [["(1)", "3000人", "12000人の75％＝9000人が1回または2回受けた。受けていない住民は 12000−9000＝3000人。"], ["(2)", "80/100 x + y", "8月1日に2回目を終えていた人＝2月1日にすでに2回目を終えていた人 y ＋ 1回目だけを終えていた人 x の80％。0.8x＋y＝8400。"], ["(3)", "1回目：3000人　2回目：6000人", "x＋y＝9000、0.8x＋y＝8400 を引くと 0.2x＝600 → x＝3000、y＝6000。"]]}, {"t": "問4 関数（放物線と直線）", "items": [["(1)", "a = 1/9", "点Aは直線 y＝x/3＋2 上で x＝−3 なので y＝1。y＝ax² が A(−3,1) を通るので 1＝9a → a＝1/9。"], ["(2)", "(3, 5)", "点B(6,4)。AOBCが平行四辺形なので、C＝A＋B−O ＝ (−3+6, 1+4) ＝ (3,5)。"], ["(3)", "27/2 cm²", "直線CAの傾きは 4/6＝2/3。A(−3,1)から x＝0 までで y＝1+2＝3 → D(0,3)。四角形DOBCの面積を座標から計算すると（D(0,3)・O(0,0)・B(6,4)・C(3,5)）、27÷2＝27/2。（△DOB＋△DBC などに分けても同じ）"]]}, {"t": "問5 図形（合同の証明と面積比）", "items": [["(1)ア", "FEB", "△AEC と △FEB の合同を示す。∠AEC＝∠FEB＝90°（仮定より）。"], ["(1)イ", "直角二等辺", "∠EBC＝45° かつ ∠BEC＝90° なので △EBC は直角二等辺三角形。"], ["(1)ウ", "EC", "直角二等辺三角形の2辺なので EC＝EB。"], ["(1)エ", "90", "∠ACE＝180°−∠AEC−∠EAC＝180°−90°−∠EAC＝90°−∠EAC。"], ["(1)オ", "1組の辺とその両端の角（がそれぞれ等しい）", "EC＝EB、∠AEC＝∠FEB＝90°、∠ACE＝∠FBE。"], ["(2)", "3：1", "EB＝4 なら EC＝4、AE＝6−4＝2。AE＝FE（合同）なので FE＝2、FC＝4−2＝2。△ABC＝6×4÷2＝12、△FBC＝FC×BE÷2＝2×4÷2＝4。12：4＝3：1。"]]}, {"t": "問6 数の性質（因数分解の利用）", "items": [["(1)", "m = 4、n = 2", "m²−n²＝(m+n)(m−n)＝12。m+n＞m−n で3通りの連立方程式（12×1、6×2、4×3）のうち、m、nが自然数になるのは m+n＝6、m−n＝2 → m＝4、n＝2。"], ["(2)", "2³×11×23", "2024÷2＝1012、÷2＝506、÷2＝253＝11×23。"], ["(3)", "4組", "2024＝(m+n)(m−n)で、m+n と m−n はともに偶数。2024＝2³×11×23 なので、2つの偶数の積に分けると (1012,2)、(506,4)、(92,22)、(46,44) の4通り（m+n＞m−n）。それぞれ m、n が自然数になる。"]]}], "S6_english": [{"t": "問1 対話文", "items": [["(1)", "イ", "「（　）I go to the festival tonight, mom?」「いいよ。でも8時までに帰ってきなさい」。許可を求める Can I ～?（～してもいい？）。"], ["(2)", "エ", "電話の定番表現。May I speak to Judy? に Speaking.（私です）と答える。"], ["(3)", "エ", "「水族館までの道を教えてください」→「いいですよ。あの青いバスに乗ってください（Take that blue bus.）」。"]]}, {"t": "問2 語を書く", "items": [["(1)", "between", "the day between Tuesday and Thursday（火曜と木曜の間の日）。"], ["(2)", "key", "箱を開けるために探すのは「かぎ（key）」。"], ["(3)", "long", "How long do you usually sleep?（どのくらいの間）—「約7時間」。"], ["(4)", "weather", "How's the weather there?（そちらの天気は？）—「くもりです」。"]]}, {"t": "問3 適語選択", "items": [["(1)", "ウ", "last night（昨夜）なので過去形。an apple は単数 → was。"], ["(2)", "ア", "「このノートはだれの？」→「私のです（mine）」。It's のあとに名詞がないので「～のもの」を表す mine。"], ["(3)", "エ", "値段をたずねる How much。「3,000円です」と答えている。"], ["(4)", "イ", "乗り物の手段は by ＋乗り物（by bus）。"], ["(5)", "ウ", "「英語で書かれた手紙」→ written in English（言語は in）。"]]}, {"t": "問4 同じ意味の書きかえ", "items": [["(1)", "that / time", "then（そのとき）＝ at that time。"], ["(2)", "Dancing / is", "It is ～ for me to dance. ＝ Dancing is ～ for me。動名詞を主語にする。"], ["(3)", "taken / him", "The photos he took ＝ The photos taken by him（過去分詞の後置修飾）。"], ["(4)", "where / to", "where I should put ～ ＝ where to put ～（疑問詞＋to不定詞）。"]]}, {"t": "問5 並べかえ（3番目と5番目）", "items": [["(1)", "3番目：ウ　5番目：イ", "This shirt looks nicest of the three.（キ・カ・ウ・イ・エ・オ・ア）"], ["(2)", "3番目：エ　5番目：カ", "I was taking a bath when you called me.（キ・オ・エ・ア・カ・イ・ウ）when のあとに「あなたが電話した」。"], ["(3)", "3番目：キ　5番目：ア", "You don't have to come with me.（エ・イ・キ・ウ・ア・カ・オ）「～する必要はない」＝ don't have to。"], ["(4)", "3番目：エ　5番目：カ", "I was very surprised to see the scenery.（ウ・キ・エ・イ・カ・オ・ア）「～して驚いた」＝ surprised to ～。"], ["(5)", "3番目：ウ　5番目：ア", "My brother is good at playing basketball.（キ・イ・ウ・オ・ア・カ・エ）be good at ～ing＝～が得意。"], ["(6)", "3番目：オ　5番目：ア", "Is this town visited by many foreign tourists?（エ・イ・オ・キ・ア・カ・ウ）受け身の疑問文。"]]}, {"t": "問6 長文：日本での生活と言葉の問題", "items": [["(1)①", "ウ", "「一部の日本人、特に高齢者が私と話そうとせず、目をそらす。たぶん（私は彼らに好かれていない）」。I'm not liked by them。マコトが「誤解している」と返すので、ジュディの思い込みを表す。"], ["(1)④", "エ", "ユキの発言。もう1つ言語を学ぶのは「私には無理（it's impossible for me）」。英語でさえ簡単ではないと続く。"], ["(2)", "ウ", "language problem＝言葉の問題。日本の店員さんたちが外国人観光客の言葉を話せず、意思疎通がうまくできないこと。"], ["(3)", "Ⓐ：オ　Ⓑ：ア", "1位は日本に近い国（South Korea）、15位は France。会話中の「No.1は日本に最も近い国のひとつ」がヒント。アメリカが多い、ヨーロッパの国は2つだけ、がチャートの読み取り。"], ["(4)", "ウ", "「ジュディは日本に来て10週間」なので日本生まれではない。ア・イ・エは本文に合う。"], ["(5)", "イ", "マコト「アメリカには日本のファンがたくさんいる」。ウは「アメリカでは英語を話さない人が増えている」であり、日本ではない。"]]}, {"t": "問7 長文：北海道旅行のメール", "items": [["(1)①", "エ", "ケンのメールの First のあと「新幹線か飛行機か（2つの選択肢）」。→ how should we go to Hokkaido?（どうやって行くか）。"], ["(1)②", "ウ", "アンディ「5時のバスに乗らなければならない。（そんなに早く起きられる？）」。"], ["(2)(a)", "ウ", "新幹線は25,000円、飛行機は約20,000円。アンディが見つけた切符は8,000円。ケンの考えた飛行機（20,000円）より 12,000円安い。"], ["(2)(b)", "ア", "バスは朝5時発、空港に7時までに着く。選択肢の中で「2時間以内」に当たるのは約100分（手書き解答はア）。"], ["(3)", "イ", "行き方：飛行機（by air）。ケンは古い建物、アンディは美術館へ（別行動）。いっしょに行くのは野球場（baseball stadium）と夜景。表のイが合う。"], ["(4)", "エ・カ", "エ：ケンが見たい夜景は日本で最も美しい夜景のひとつとして有名。カ：アンディは「できれば新幹線で行きたい」＝1人なら飛行機に乗らない。アは「すでに買った」が不一致、イは時間の差が逆、ウは理由が違う、オは「新幹線が飛行機より速い」が逆。"]]}, {"t": "問8 英作文（5〜7語）", "items": [["彼女は私が理科を勉強するのを手伝ってくれました。", "She helped me study science.", "help A (to) 動詞の原形＝Aが～するのを手伝う。過去形 helped。5語。to を入れた She helped me to study science. でも正解（6語）。"]]}], "S6_science": [{"t": "問1-I 日本の天気", "items": [["(1)あ", "シベリア", "冬は大陸にできる冷たく乾燥したシベリア気団が発達する。"], ["(1)い", "西高東低", "西に高気圧、東に低気圧が並ぶ冬型の気圧配置。"], ["(1)う", "高気圧", "春・秋は、移動性高気圧と低気圧が交互に日本付近を通る。天気が周期的に変わる。"], ["(1)え", "小笠原", "夏は太平洋上の小笠原気団が強く、南高北低の気圧配置になる。"], ["(2)", "冬：イ（北西）　夏：ウ（南東）", "冬は大陸から海へ（北西の季節風）、夏は海から大陸へ（南東の季節風）。"], ["(3)", "偏西風", "中緯度の上空を西から東へ吹く風。天気が西から東へ移り変わる原因。"], ["(4)", "ア", "冬の北西季節風が、あたたかい日本海の上で水蒸気を含み、日本列島の山脈にぶつかって上昇気流となり、日本海側に雪を降らせる。"]]}, {"t": "問1-II 地震", "items": [["(1)あ・い", "あ：震度　い：マグニチュード", "揺れの強さは震度（10階級）、地震の規模はマグニチュード（M）。"], ["(2)", "P波：6km/s　S波：3km/s", "B→Cの30kmで、P波の到着は5秒差 → 30÷5＝6km/s。S波は10秒差 → 30÷10＝3km/s。"], ["(3)", "ウ（8時59分45秒）", "地点A（60km）にP波は10秒で届く（60÷6）。初期微動の開始は8時59分55秒なので、発生は 8時59分45秒。"], ["(4)か", "7", "地点D（12km）にP波が届くのは 12÷6＝2秒後。そこから5秒後に発信なので、地震発生の7秒後。"], ["(4)き", "15", "45kmの地点にS波が届くのは 45÷3＝15秒後。"], ["(4)く", "8", "緊急地震速報を受信するのは発生の7秒後、主要動は15秒後。差は 15−7＝8秒。"]]}, {"t": "問2-I 溶解度", "items": [["(1)あ・い", "あ：溶質　い：飽和水溶液", "溶けている物質＝溶質。限度まで溶けた水溶液＝飽和水溶液。"], ["(2)", "ウ（157g）", "60℃のミョウバンは水100gに約57g溶ける。水溶液の質量は 100＋57＝157g。（溶けた質量ではなく「水溶液の質量」を聞かれている点に注意）"], ["(3)", "エ（52％）", "60℃の硝酸カリウムは約110g溶ける。濃度＝110÷(100＋110)×100＝約52％。"], ["(4)か", "硝酸カリウム", "溶解度が温度で大きく変わる物質ほど、冷やすと多くの結晶が出る。"], ["(4)き", "ウ（78）", "20℃の溶解度は約32g。110−32＝78g。"]]}, {"t": "問2-II 中和", "items": [["(1)", "中和", "酸の水素イオンとアルカリの水酸化物イオンが結びついて水ができ、たがいの性質を打ち消し合う反応。"], ["(2)", "NaCl", "水酸化ナトリウム＋塩酸 → 塩化ナトリウム（塩）＋水。"], ["(3)", "エ", "20.0cm³のとき液は黄色＝酸性。青色リトマス紙が赤色になる。ア（石灰水は二酸化炭素に反応）・イ（フェノールフタレインは酸性で無色）・ウ（NaClが残る）は誤り。"], ["(4)", "図", "水酸化物イオンは、0cm³のとき 3x 個で、塩酸を加えるごとに直線的に減り、15cm³（中性）で 0 になる。その後は 0 のまま。（塩化物イオンは加えた体積に比例して増える）"], ["(5)", "36cm³", "実験で、水酸化ナトリウム水溶液20.0cm³を中和するのに塩酸15cm³必要。48.0cm³なら 20：15＝48：x → x＝36cm³。"]]}, {"t": "問3-I だ液のはたらき", "items": [["(1)", "あ：A　い：C　う：B　え：D", "ヨウ素液でデンプンの有無を、ベネジクト液（加熱）で糖の有無を調べる。A（水・ヨウ素）は青紫でデンプンあり、C（だ液・ヨウ素）は変化なし → C（だ液）ではデンプンがなくなった。B（水・ベネジクト）は反応なし、D（だ液・ベネジクト）は赤褐色 → D（だ液）で糖ができた。"], ["(2)", "エ（アミラーゼ）", "だ液中のデンプンを分解する消化酵素。ペプシンは胃液でタンパク質、トリプシンはすい液でタンパク質、リパーゼは脂肪。"], ["(3)", "柔毛", "小腸の内側のひだにある突起。表面積を大きくして養分を効率よく吸収する。"], ["(4)", "ウ", "0℃（E・F）でも75℃（G・H）でも、ヨウ素液は青紫のまま・ベネジクト液は水色のまま → デンプンが変化していない。つまり、だ液は0℃でも75℃でもはたらかない。（体温ぐらいの40℃でよくはたらく）"]]}, {"t": "問3-II エンドウの遺伝", "items": [["(1)", "あ：精細胞　い：卵細胞　う：有性", "花粉の中の生殖細胞＝精細胞、胚珠の中の生殖細胞＝卵細胞。合体（受精）して新しい個体ができるふえ方は有性生殖。"], ["(2)", "潜性形質", "対立形質をもつ純系どうしをかけ合わせたとき、子に現れない形質（劣性形質）。「緑色」は潜性形質。"], ["(3)", "ア（25％）", "草たけ高い子（Aa）を自家受粉すると、孫は AA：Aa：aa＝1：2：1。低い（aa）のは25％。"], ["(4)", "イ（約180個）", "丸形の孫（AA：Aa＝1：2）のうち、純系（AA）は 1/3。548×1/3＝約183個 → 約180個。"], ["(5)", "Tt", "個体Xに草たけが低い（tt）個体を交配して、高い個体と低い個体がほぼ同数。Xが TT なら子は全て Tt（すべて高い）、Tt なら Tt：tt＝1：1。よってXは Tt。"]]}, {"t": "問4-I 回路と電流", "items": [["(1)", "図", "電流計は抵抗器Xと直列、電圧計は抵抗器Xと並列につなぐ。電源の＋極からスイッチ→電流計→抵抗器X→電源の−極と1本につなぎ、電圧計は抵抗器Xの両端につなぐ。（電流計・電圧計とも、わからないときは大きい端子から）"], ["(2)あ・い", "あ：12　い：0.15", "図2の電圧計と電流計の針を読む。電圧12V、電流0.15A。"], ["(2)う", "80Ω", "R＝V÷I＝12÷0.15＝80Ω。"], ["(3)", "①：0.24A　②：0.6A", "①直列：P＋Q＝50Ω、12÷50＝0.24A（Pにも同じ電流）。②並列：Pには12Vがかかるので 12÷20＝0.6A。"], ["(4)", "W₂＝W₄＞W₁＞W₃", "Qに加わる電圧：②④の並列は30Vそのまま、①は 30V×30/50＝18V、③は 30V×30/80＝11.25V。電力＝V²÷R（R＝30Ω）で W₁＝10.8W、W₂＝W₄＝30W、W₃≒4.2W。※解答用紙の手書きは「W₂＞W₄＞W₁＞W₃」ですが、並列回路ではQに同じ30Vが加わるので W₂とW₄は等しくなります。"]]}, {"t": "問4-II ばねと仕事", "items": [["(1)", "イ・エ", "のびは質量に比例する（イ）。X：Y＝1.5：2.0＝0.75（エ）。ア：長さはもとの長さがあるので比例しない（のびが比例）。ウ：40gのときXは3cm、Yは4cm。"], ["(2)", "108g", "のびは 17.1−9.0＝8.1cm。Pは20g、1個でXは1.5cmのびる。8.1÷1.5×20＝108g。"], ["(3)①", "12.5cm", "動滑車を使うので、ばねYにかかる力は物体の重さの半分で125g分。Yは20gで2.0cm → 125gで 125÷20×2.0＝12.5cm。"], ["(3)②", "0.2J", "物体を8cm引き上げる仕事＝2.5N×0.08m＝0.2J。（ばねYが物体Rにした仕事は、物体の重さ分で 2.5N）"], ["(3)③", "0.05W", "動滑車なので糸は16cm引かれる。速さ4cm/sなら 16÷4＝4秒。仕事率＝0.2J÷4s＝0.05W。"]]}], "S6_social": [{"t": "問1 世界地理", "items": [["(1)", "ウ", "緯線に沿って東へ160度進むと東経140＋160＝300 → 360−300＝西経60度。緯度は北緯35度のまま。"], ["(2)", "12月21日 午後10時", "日本（東経135度）とダッカ（東経90度）の経度差45度＝時差3時間。ダッカは日本より3時間遅い。12月22日午前1時−3時間＝12月21日午後10時。"], ["(3)", "ア・オ", "Aはアフリカ北西部の地中海性気候（夏に乾燥・冬に雨）。ぶどう・オリーブ・オレンジなどの果樹栽培が盛ん。"], ["(4)", "X：イ　Y：ア　Z：ウ", "Bはオーストラリア。1965年は貿易相手国の上位がイギリス・アメリカなど欧米諸国（イ）、2022年は中国・日本など近隣のアジア諸国（ア）。白豪主義をやめて、現在は多文化共生社会（ウ）を目指す。"], ["(5)", "ウラル山脈", "ヨーロッパ州とアジア州の境界はウラル山脈とカフカス山脈。"], ["(6)", "ア", "世界の宗教人口で最も多いのはキリスト教（約31％）。イはイスラム教、ウはヒンドゥー教、エは仏教。"], ["(7)", "ウ・エ", "ア：成田から最も離れているのはブエノスアイレス（正距方位図法で外側）。イ：ロンドンは真東ではない。ウ：Xは南極大陸で正しい。エ：成田からナイロビへの最短ルートはインド洋を通る。"], ["(8)", "例：サウジアラビアの石油の可採年数は74年しかなく、降水量が年間を通して少ないため、安定した太陽光発電が期待できるから。", "資料1から石油は限りがある、資料2から年間を通じて雨が少なく（砂漠気候）日照が多い、の2点を入れる。"]]}, {"t": "問2 日本の諸地域", "items": [["(1)①", "ア", "地形図中に最も多く見られる土地利用は田。"], ["(1)②", "イ・ウ", "田瀬川の流れる向きと、X−Y間の実際の距離を地形図から読み取る問題（縮尺5万分の1で3cm＝1500m）。"], ["(1)③", "島根県", "松江市は島根県の県庁所在地。"], ["(1)④A", "4", "2万5千分の1で8cm＝8×25000＝200000cm＝2km。2km×2km＝4km²。"], ["(1)④B", "10", "2万5千分の1地形図の主曲線は10mごと（計曲線は50mごと）。5万分の1は20mごと。"], ["(2)①", "岡山県：エ　栃木県：ウ", "岡山県は、まず飛行機が少ない（0％）、新幹線（鉄道）中心でエ。栃木県は東京に近く、鉄道が中心だがバスも使うのでウ。航空機が多いアは愛知県でなく大分県など。"], ["(2)②", "ウ・カ・キ", "第3次産業はサービス業。金融業、運輸業、観光業が当てはまる。農業・漁業は第1次、製造業・建設業は第2次。"], ["(2)③", "X：筑紫　Y：二毛作", "九州北部の筑紫平野。同じ土地で米と麦を年2回つくるのは二毛作。"], ["(2)④", "施設園芸農業", "愛知県の渥美半島などで、温室やビニールハウスを使って野菜・花を栽培する。"], ["(2)⑤", "ウ", "中国・四国地方は、製造品出荷額が関東・中部ほど大きくなく、農業産出額も九州より少ない。資料2の数値の中間にあたるウ。"]]}, {"t": "問3 原始・古代", "items": [["(1)", "ア", "①秦の始皇帝が中国を統一（前221）→④漢（前漢）が中国を統一（前202）→②ローマ帝国が成立（前27）→③ムハンマドがイスラム教を開く（7世紀）。"], ["(2)", "朝貢", "周辺諸国が中国の皇帝に貢ぎ物をさし出して従属を示すこと。"], ["(3)", "イ", "仏教を正式に伝えたのは百済（538年ごろ）。"], ["(4)①", "推古天皇", "593年、聖徳太子は推古天皇の摂政となった。"], ["(4)②", "イ・ウ", "天智天皇（中大兄皇子）は、白村江の戦いに敗れたあと（ウ）、初めての全国的な戸籍の庚午年籍をつくった（イ）。アは聖徳太子（遣隋使）、エは持統天皇（藤原京）。"], ["(5)①", "エ", "唐から来日して仏教の正しい教えを広めた僧は鑑真。唐招提寺をひらいた。"], ["(5)②", "校倉造・聖武天皇", "東大寺正倉院は三角形の木材を組み上げた校倉造。納められた宝物は聖武天皇の遺品。"], ["(6)", "イ", "菅原道真を陥れたのは「平氏」ではなく藤原氏（藤原時平）。"]]}, {"t": "問4 近世", "items": [["(1)", "南蛮貿易", "ポルトガル・スペインとの貿易。"], ["(2)①", "イ・ウ", "豊臣秀吉は刀狩（イ）で百姓から武器を取り上げ、太閤検地（ウ）で田畑の良し悪しを調べ耕作者を定めた。"], ["(2)②", "武士と農民の身分がはっきりと分けられた（兵農分離）。", "刀狩と太閤検地で、武士は城下町に住み、農民は農業に専念する身分制度の基礎ができた。"], ["(3)", "ウ", "秀吉が出兵したのは朝鮮。李舜臣の水軍や民衆の抵抗で苦戦した（文禄・慶長の役）。"], ["(4)①", "X：朱印　Y：参勤交代", "海外渡航許可書は朱印状。大名に1年おきに江戸に来ることを義務づけたのは参勤交代（徳川家光、武家諸法度の改定）。"], ["(4)②", "ア", "クロムウェルの議会派が国王を処刑して共和政を始めたのは、ピューリタン革命（1642〜49）。"], ["(5)①", "イ → エ → ア → ウ", "安政の大獄（1858）→ 生麦事件（薩摩藩士がイギリス商人を殺傷、1862）→ 薩英戦争（1863）→ 四国連合艦隊の下関砲撃（1864）。※解答用紙の手書きは「エ→ウ→ア→イ」ですが、年代順ではイ→エ→ア→ウです。"], ["(5)②", "エ（i：金　ii：銀　iii：上昇）", "日本は金銀の交換比率が外国と異なり、金が大量に海外へ流出した。物価は急上昇した。"]]}, {"t": "問5 公民", "items": [["(1)①", "X：ウ（知る権利）　Y：カ（情報公開制度）", "情報化で新しい人権として知る権利が認められ、国や地方に情報公開制度がもうけられた。"], ["(1)②", "オ", "2021年のタブレット端末の世帯保有率は約40％、スマートフォンは約89％で半分以下。"], ["(2)", "X：被告人　Y：検察官", "刑事裁判で、裁判を受ける人は被告人、被告人を起訴した人は検察官。"], ["(3)①", "両院協議会", "衆議院と参議院の議決が異なったとき、意見を調整する会議。"], ["(3)②", "ア・ウ・エ", "予算の議決・条約の承認・内閣総理大臣の指名は、必ず両院協議会を開く。法律案では開かないこともできる（衆議院の3分の2以上の再可決もある）。"], ["(4)", "立憲主義", "憲法で政府の権力を制限し、人権を守って政治を行う考え方。"], ["(5)", "イ", "満18歳で憲法改正の国民投票に参加できる（選挙権も18歳）。アの立候補は市議会は25歳以上、ウは労働基準法・エは裁判の傍聴は年齢制限なし。"]]}], "S6_japanese": [{"t": "問一 漢字", "items": [["(1)①", "ふにん", "赴任＝任地に行くこと。「赴」は「おもむく」。"], ["(1)②", "こくふく", "克服。「克」は「かつ」。"], ["(1)③", "とどこお（る）", "滞る。物事がうまく進まない。"], ["(1)④", "まぎ（れる）", "紛れる。「紛」は「まぎれる」。"], ["(1)⑤", "ようご", "擁護＝かばって守ること。"], ["(2)①", "エ", "痛「快」。エ「快適」が同じ字。アは理解、イは改良、ウは階段。"], ["(2)②", "ア", "至難の業。ア「至急」が同じ字。イは姿勢（勢）、ウは歴史（史）、エは雑誌（誌）で、字がちがう。"], ["(2)③", "イ", "光を「放つ」。イ「放牧」が同じ字。アは法律、ウは豊富、エは歴訪。"], ["(2)④", "イ", "「品格」。イ「合格」が同じ字。アは正確、ウは自覚、エは価値でなく名産品の「地」など別字。"], ["(2)⑤", "ウ", "雪を「頂く」。ウ「頂点」が同じ字。アは主張、イは風潮、エは兆候。"]]}, {"t": "問二 小説（東直子『階段にパレット』より）", "items": [["あらすじ", "—", "絵画教室で心を開き始めた小学3年生のルイが、母の英里子を外へ連れ出し、空に絵を描くしぐさをして、3歳のときに家族3人で行った伊豆の海水浴の思い出を伝えようとする場面。"], ["(1)", "b", "a「ゆらした」・c「反芻した」・d「見つめ」は動詞。b「まぶしそうに」は形容詞「まぶしい」に「そうだ」がついた形容動詞で、品詞がちがう。"], ["(2)", "家族三人で行った海水浴のことを思い出している", "ルイが空に描こうとしているのは、あの日の海水浴の思い出。それを英里子は「はっとして」気づいた（本文：「ルイは、心の中にある夏、家族三人で行った海水浴のことを思い出している」）。"], ["(3)", "英里子：勇敢な子ども　夫：少し変な子ども", "英里子は、初めて見る海を怖がらなかったルイを「勇敢な子どもなのだ」と誇らしく思った。一方、夫は「ルイ、あいつやっぱり、ちょっと変だよな」と言った。"], ["(4)", "エ", "「ならよかった」は、「ずっとおとなしい」と言われ続けてきたルイが、ちゃんと楽しんでいたと知って安心した気持ち。夫は喜んでいる。期待通りではない反応でも受け入れる気持ちが込められている。"], ["(5)", "ア", "「ざらりとしたもの」＝すっきりしない、気がかりな感じ。ルイに対する感じ方が夫とちがうことへの違和感。"], ["(6)", "例：ルイが家族三人で海に行ったことを覚えているとは思わなかったから。", "英里子は「ルイは幼すぎて覚えていないだろう」と思い込んでいたので驚いた。"], ["(7)", "イ", "「二度と戻らない時間なのだ」という思いは、ルイが幼いころの記憶の中に、大切な家族（父・母）を見ていることを感じたから。"]]}, {"t": "問三 論説（古井由吉『書く、読む、生きる』より）", "items": [["要旨", "—", "日本語は、かなと漢字を瞬時に切り替えて使いこなしており、バイリンガルなことばである。伝統は「ことば」そのもので、行き詰まりをやわらげる力になるかもしれないので、むやみに捨てず、世界における日本語の意義を再認識する必要がある。"], ["(1)", "イ", "a：「それから」。前の「翻訳は非常にうまい」に、別のことをつけ加える。b：「たとえば」。「概念にない言葉」の例として「認識」「観念」を挙げている。"], ["(2)", "ア", "日本語は、かなと漢字という異なる体系を、読むときも話すときも瞬時に切り替えて使いこなしている。これが「バイリンガル」ということ。"], ["(3)", "ちなみに今", "「翻訳は非常にうまい」と書かれている段落は、「ちなみに今の中国語の中で…」。"], ["(4)i", "行き詰まりをやわらげるか、是正する力になる", "本文：「東洋の文明―さらにいえば日本独自の伝統なら、その行き詰まりをやわらげるか、是正する力になるかもしれない」（21字）。"], ["(4)ii", "エ", "日本の伝統は、西洋の行き詰まりを是正する力になるかもしれないので、手放してはいけないもの。"], ["(5)", "初め：ある程度の　終わり：ことが可能", "「ある程度の広がりをもっている言葉を、その広がりのまま捉えることが可能」な言語が日本語（34字）。"], ["(6)", "例：筆者は、日本語は意味を限定せずにあいまいな事柄を捉えることができると述べている。私は、そのような日本の伝統をそのまま続けるのではなく、外国の人にも分かりやすい明確な使い方に変えていくべきだと考える。", "条件：①「意味を限定」「日本の伝統」を使う、②自分の意見と理由を書く、③80〜100字。（解答は例）"]]}, {"t": "問四 古文（『伊曾保物語』）", "items": [["大意", "—", "川のほとりで遊んでいた蟻が水に流され、困っていた。それを見た鳩が木の枝を落として蟻を助けた。のちに、ある人が鳩を鳥もちでとらえようとしたとき、蟻はその人の足に食いついて、鳩を逃がした。恩を受けたら、恩返しをしたいという気持ちをもつべきである。"], ["(1)", "おもうよう", "「思ふやう」→歴史的仮名遣いを現代仮名遣いに直す。「ふ」→「う」、「やう」→「よう」。"], ["(2)i", "鳩", "「木末を少し食ひ切りて、河の中に落しければ」と、蟻のために枝を落としたのは鳩。"], ["(2)ii", "ウ", "川に流されそうな蟻を助けるため。蟻はこの枝に乗って、渚に上がることができた。"], ["(3)", "恩を受けたら恩返しをしたいと思うべきということ", "蟻が「ただ今の恩を送らうものを（今の恩に報いたい）」と思い、人の足にかみついた。本文の注に「報ひをせばや＝恩返しをしたい」。20〜30字で、「恩」「恩返し」を入れてまとめる。"]]}], "S7_math": [{"t": "問1 計算・方程式の小問", "items": [["(1)", "3", "−5² は「5²の符号を変えたもの」で −25。−25 − 4×(−7) ＝ −25 + 28 ＝ 3。"], ["(2)", "32/3", "10−(−2)² ＝ 10−4 ＝ 6。(−3/4)² ＝ 9/16。6 ÷ 9/16 ＝ 6 × 16/9 ＝ 32/3。"], ["(3)", "−8ab/3", "4a²b ÷ 9a²b² × (−6ab²) ＝ −(4a²b × 6ab²)/(9a²b²) ＝ −24a³b³/9a²b² ＝ −8ab/3。÷は分母に、約分してから整理。"], ["(4)", "4x² + 2xy + 7y²", "(x−2y)² ＝ x²−4xy+4y²、3(x+y)² ＝ 3x²+6xy+3y²。たすと 4x²+2xy+7y²。"], ["(5)", "−3√2 + 4√3 − 6", "−12/√8 ＝ −12/(2√2) ＝ −6/√2 ＝ −3√2。−√2×(√18−√24) ＝ −√2×3√2 ＋ √2×2√6 ＝ −6 + 2√12 ＝ −6 + 4√3。"], ["(6)", "ア", "√15≒3.87、9/√5＝9√5/5≒4.02。√15 ＜ 4 ＜ 9/√5。"], ["(7)", "x = 4", "0.24x ＝ 0.96 → x＝4。"], ["(8)", "x = 6, −5", "展開して整理：x²+2x+1−3x−6−25 ＝ x²−x−30 ＝ (x−6)(x+5)＝0。"]]}, {"t": "問2 小問集合", "items": [["(1)", "5", "a²−3ab+b² ＝ (a+b)² − 5ab。a+b＝2√5、ab＝5−2＝3 → 20−15＝5。（対称式は a+b と ab で表す）"], ["(2)", "7/10", "袋は0〜4の5個。順に2個取るので 5×4＝20通り（同じ玉は取れない）。12の約数は 1,2,3,4,6,12。a+b＝1：2通り、2：2通り（(1,1)は不可）、3：4通り、4：4通り、6：2通り（(3,3)は不可）。合計14通り → 14/20＝7/10。"], ["(3)", "ウ", "ヒストグラムから、最小値30〜35、最大値65〜70、第1四分位数は45〜50、第2四分位数（中央値）は50〜55、第3四分位数は55〜60の階級。これに合う箱ひげ図がウ。"], ["(4)", "イ", "球の半径をrとすると、円柱は半径r・高さ2r。水の体積＝円柱−球＝2πr³−4/3πr³＝2/3πr³。底面積πr²で割ると水の高さ＝2/3r。全体の高さ2rの 1/3倍。"], ["(5)", "120度", "∠COD＝130°より、弧CDの円周角 ∠CAD＝65°。∠BAD＝95°なので ∠BAC＝30°。弧AB＝弧BC なので ∠ADB＝∠BDC＝30°。∠ADC＝60° → 円に内接する四角形の対角の和は180°なので x＝∠ABC＝180°−60°＝120°。"], ["(6)", "1/3倍", "BE・CD は中線なので、F は △ABC の重心。重心は中線を 2：1 に分けるので、△FBC は △ABC の 1/3。"], ["(7)", "207π cm³", "FC（辺CDの上）を軸に回転させる。正方形（1辺6cm）を回転させると円柱（半径6・高さ6）＝216π。切り取った直角二等辺三角形DEFを回転させると円すい（半径3・高さ3）＝1/3×9π×3＝9π。216π−9π＝207π。"]]}, {"t": "問3 方程式の利用（なしとももの販売）", "items": [["(1)⑦", "31−x", "箱は全部で35個。なしが x 箱なら、ももは 35−x 箱。そのうち4箱は値引きなので、定価で売れたのは (35−x)−4＝31−x 箱。"], ["(1)①", "4", "売れ残った4箱を 900円の10％引き（900×0.9）で売った。"], ["(2)⑦", "x/4 + y/3", "1箱になしが4個、ももが3個。なし x 個は x/4 箱、もも y 個は y/3 箱。合計35箱。"], ["(2)①", "y − 12", "4箱（1箱3個）は値引きなので 12個。定価で売れたももは y−12 個。"], ["(3)", "なし72個、もも51個", "①：x/4＋y/3＝35 → 3x＋4y＝420。②：250x＋300(y−12)＋3240＝32940 → 5x＋6y＝666。①×3：9x＋12y＝1260、②×2：10x＋12y＝1332。引くと x＝72、y＝51。（確認：72÷4＝18箱、51÷3＝17箱、合計35箱）"]]}, {"t": "問4 関数（放物線）", "items": [["(1)", "(−4, −16)", "B(4, −16)（y＝−x²）。CはBと y 座標が等しく、y＝−x² 上の点なので、x＝−4 → C(−4, −16)。"], ["(2)", "a = 1/4", "A(4, 16a)。BC＝8、AB＝16a＋16。△ABC＝ABを底辺にすると、高さは C と直線 AB の距離 8。1/2×(16a+16)×8＝80 → 16a＋16＝20 → a＝1/4。"], ["(3)", "(0, −7)", "a＝1/8 → A(4, 2)、B(4, −16)。AD＝BD より D は線分ABの垂直二等分線上。AB の中点の y 座標は (2−16)/2＝−7。D は y軸上なので D(0, −7)。"]]}, {"t": "問5 図形（合同の証明）", "items": [["(1)⑦", "①③", "AB＝DC（①）、DC＝FD（③）より AB＝FD（⑤）。"], ["(1)①", "②④", "AD＝BC（②）、BC＝BE（④）より BE＝DA（⑥）。"], ["(1)⑦", "⑤⑥⑨", "AB＝FD、BE＝DA、∠ABE＝∠FDA。"], ["(1)Ⓐ", "CDF", "∠FDA＝∠CDA−∠CDF＝90°−60°＝30°。"], ["(1)Ⓑ", "2組の辺とその間の角", "2組の辺とその間の角がそれぞれ等しいので、△ABE≡△FDA。"], ["(2)", "15度", "∠ABE＝30°、∠AGE＝75°は △ABG の外角なので ∠GAB（＝∠FAB）＝75°−30°＝45°。合同より ∠BAE＝∠AFD。△FDA で ∠FDA＝30°、∠DAF＝90°−45°＝45° → ∠AFD＝105°。∠BAE＝105° → ∠DAE＝105°−90°＝15°。"]]}, {"t": "問6 平方根と整数部分・小数部分", "items": [["(1)⑦・①", "⑦：2　①：√5−2", "2²＜5＜3² より 2＜√5＜3。整数部分は2、小数部分は √5−2。"], ["(2)⑦", "5−2√5", "x＝√5−2 を x(x+2) に代入：(√5−2)×√5＝5−2√5。"], ["(3)", "a = (1+√17)/2", "a²＝6＋b、0≦b＜1 より 6≦a²＜7。2²＜a²＜3² なので a の整数部分は 2。a＝2＋b → b＝a−2。a²＝6＋(a−2) → a²−a−4＝0 → a＝(1±√17)/2。a＞0 より a＝(1+√17)/2。"]]}], "S7_english": [{"t": "問1 対話文", "items": [["(1)", "エ", "Thank you for your support.（応援ありがとう）。thank you for ～＝～をありがとう。"], ["(2)", "ア", "What's wrong?（どうしたの？）— 頭痛がします。具合の悪い人にたずねる決まり文句。"], ["(3)", "イ", "I'm looking forward to seeing you.（お会いするのを楽しみにしています）。look forward to ～ing。"]]}, {"t": "問2 語を書く", "items": [["(1)", "color", "Which color do you like better, black or blue?（どちらの色が好き？）"], ["(2)", "would", "What would you like to have today?（今日は何になさいますか）。would like to ～＝～したい（ていねいな言い方）。"], ["(3)", "Thursday", "Thursday is the day between Wednesday and Friday.（水曜日と金曜日の間の日）。"], ["(4)", "umbrella", "急に雨が降り出したが、かさ（umbrella）を持っていなかったので、ぬれた。"]]}, {"t": "問3 適語選択", "items": [["(1)", "エ", "How long are you going to stay ...?（どのくらいの期間）— 3日間。期間をたずねる。"], ["(2)", "イ", "Wash your hands before you have lunch.（昼食を食べる前に手を洗いなさい）。"], ["(3)", "ウ", "What does your uncle call you?（おじさんはあなたを何と呼ぶ？）— シンちゃん。call A B＝AをBと呼ぶ。"], ["(4)", "ア", "a small park next to my house（私の家のとなりの小さな公園）。"], ["(5)", "エ", "it is written in French（それはフランス語で書かれている）。受け身。"]]}, {"t": "問4 同じ意味の書きかえ", "items": [["(1)", "when / was", "at the age of 28 ＝ when she was 28（28歳のときに）。"], ["(2)", "gave / me", "I got a book from her. ＝ She gave me a book."], ["(3)", "Both / and", "Both Koji and Yuki are from Nagano City.（コウジもユキも）。both A and B は複数扱い（are）。"], ["(4)", "higher / other", "the highest ＝ higher than any other ～（ほかのどの～よりも高い）。other のあとは単数名詞。"]]}, {"t": "問5 並べかえ（3番目と5番目）", "items": [["(1)", "3番目：ウ　5番目：イ", "I have lived in this town for ten years.（キ・カ・ウ・オ・イ・ア・エ）"], ["(2)", "3番目：ア　5番目：エ", "She was listening to music in her room.（ウ・キ・ア・オ・エ・カ・イ）"], ["(3)", "3番目：イ　5番目：ウ", "That dog running over there is mine.（カ・エ・イ・キ・ウ・オ・ア）running over there が dog を後ろから説明。"], ["(4)", "3番目：イ　5番目：エ", "That house which has a red roof was built last year.（ウ・キ・イ・カ・エ・ア・オ）関係代名詞 which。"], ["(5)", "3番目：エ　5番目：ア", "I believe that it will be sunny tomorrow.（オ・イ・エ・キ・ア・カ・ウ）believe that ～。"], ["(6)", "3番目：ウ　5番目：イ", "She didn't have time to talk with you.（エ・ア・ウ・オ・イ・カ・キ）time to ～（～する時間）。"]]}, {"t": "問6 対話文：図書館（ジャックとモモ）", "items": [["(1)①", "イ", "「公園のベンチで do that」＝前の文の reading（本を読む）→ read a book。"], ["(1)③", "ア", "「Do you always go there in that way?」＝モモが教えた行き方（電車→バス→歩き）。the way Momo told to Jack。"], ["(2)②", "ウ", "日本語のウェブサイトでしたね、ジャック、「あなたは日本語が読めない」でしょ？ → you can't read Japanese。"], ["(2)④", "イ", "模範解答はイ（getting a bike later）。文脈（「電車とバスが大変なら、徒歩で帰る」案）ではエ borrowing the book today も自然に読めるので、公式解答の根拠は確認してください。"], ["(3)", "イ", "日本語ページには図書館の地図があった（Of course, the Japanese pages had a map…）。バス停 → 南プール → 図書館が右側にある図が、モモの道案内に合うイ。"], ["(4)", "エ", "「15冊とDVD1枚を15日間借りられる」ので、2週間より長く借りられる。ア：自転車の規則は書かれていない。イ：15冊借りていてもさらに借りられないとは書かれていない。ウ：DVDは1枚。"], ["(5)", "エ", "ジャックは「DVDがあるかわからない」と言っている（Does the library have any DVDs?）。ア：本は図書館で借りる。イ：英語のページは見つからなかった。ウ：モモは図書館に行ったことがある。"]]}, {"t": "問7 スピーチ：インターネットと私たち（トム）", "items": [["(1)①", "ウ", "「インターネットのおかげで多くのことが可能になった。しかし、（それは私たちにいくつかの問題ももたらす）」。However（しかし）のあとで、「問題」の話につながる。"], ["(1)②", "ア", "「ゲームはあまり人気がない。意外だ。クラスメートはいつもオンラインゲームについて話しているから」。talk about online games。"], ["(2)ⓐ", "エ（13）", "Graph A：6時間以上が27％、5時間以上は全体で40％。5〜6時間未満＝40−27＝13％。"], ["(2)ⓑ", "キ（282）", "平日の平均利用時間は約5時間。選択肢で約5時間（300分）に近い282分。"], ["(3)ⓐ", "ウ（音楽を聴く）", "4位。ゲームは「音楽を聴くより人気がない」と本文にあるので、音楽がゲームより上位の4位。"], ["(3)ⓑ", "エ（勉強する）", "6位。マンガ（7位）は32％で、勉強にインターネットを使うのは約40％以下。"], ["(4)", "エ・カ", "エ：トムは「5時間は長すぎる」と考えている。カ：動画を見るのは日本語を上達させるため。ア：グラフを使っている、イ：家族と話す機会が減った、ウ：勉強のほうが大事、オ：「使うべきでない」とは言っていない。"]]}, {"t": "問8 英作文（8〜10語）", "items": [["私にこのカメラの使い方を教えてください。", "Please tell me how to use this camera.", "8語。「～してください」なので Please ～（命令文）。疑問文（Can you ～?）は使わない。how to ～＝～のしかた。Please show me how to use this camera. も可。"]]}], "S7_science": [{"t": "問1-I 地層の調査", "items": [["(1)", "ア", "泥岩・砂岩・れき岩は、流水のはたらきで運ばれてきた土砂が堆積してできた「堆積岩」。流水で運ばれる間にけずられるので、ふくまれる粒は角がなく、丸みを帯びている。（凝灰岩は火山灰が堆積したもので、粒は角ばっている）"], ["(2)", "示相化石", "サンゴの化石で「あたたかく浅い海」とわかるように、堆積した当時の環境を推定する手がかりとなる化石。（時代を示す化石は示準化石）"], ["(3)", "a → c → b", "地層は下にあるほど古い。P・Q・Rの地表の標高差と地層の傾きをふまえ、同じ凝灰岩の層（かぎ層）などを手がかりに、標高をそろえて比べる。（模範解答の順番）"], ["(4)", "エ", "柱状図では同じ層の高さがちがう。かぎ層の標高を比べ、層が高くなっている方角を考える。（模範解答は北）"], ["(5)", "図", "PとSは同じ等高線上にあり標高が等しいので、地層は等高線に平行（同じ高さで同じ層が重なる）。地点Sの10mまでの柱状図は、模範解答の図のように重ねる。"]]}, {"t": "問1-II 空気中の水蒸気", "items": [["(1)", "露点", "空気中の水蒸気が水滴に変わり始めるときの温度。"], ["(2)", "ア", "金属は熱を伝えやすいので、コップの温度が水温と同じになりやすい。"], ["(3)", "75％", "20℃の飽和水蒸気量（露点のとき）は17.3g/m³、実験時の気温25℃では23.1g/m³。湿度＝17.3÷23.1×100＝74.9…→ 75％。"], ["(4)①", "3460g", "空気1m³の水蒸気量は17.3g。17.3×200＝3460g。"], ["(4)②", "740g", "16℃の飽和水蒸気量は13.6g/m³。13.6×200＝2720g。冷えて水滴になるのは 3460−2720＝740g。"]]}, {"t": "問2-I 酸化銀の加熱", "items": [["(1)", "イ", "酸素は、うすい過酸化水素水（オキシドール）に二酸化マンガンを入れても発生する。アは水素、ウは硫酸バリウムの沈殿、エは二酸化炭素が発生。"], ["(2)", "2Ag₂O → 4Ag + O₂", "酸化銀を加熱すると銀と酸素に分解する（熱分解）。左右で原子の数をそろえる。"], ["(3)", "グラフ", "横軸＝酸化銀の質量、縦軸＝発生した酸素の質量。酸素の質量＝酸化銀−銀 なので、(0.60,0.04)(1.20,0.08)(1.80,0.12)(2.40,0.16) の4点と原点を通る直線をかく。"], ["(4)", "14：1", "酸化銀0.60g中、銀0.56g、酸素 0.60−0.56＝0.04g。銀：酸素＝0.56：0.04＝14：1。"], ["(5)", "1.80g", "加熱後の質量が 6.30−6.00＝0.30g 減った＝発生した酸素0.30g。酸化銀0.60gで酸素0.04g発生するので、分解した酸化銀は 0.30×(0.60/0.04)＝4.50g。未反応は 6.30−4.50＝1.80g。"]]}, {"t": "問2-II 水溶液の区別", "items": [["(1)", "D・E", "酸性の水溶液がBTB溶液を黄色にする。青色リトマス紙が赤色に変わる（酸性）のはDとE。"], ["(2)", "A：アンモニア水　B：塩化ナトリウム水溶液　C：水酸化ナトリウム水溶液", "A・Cはアルカリ性（赤色リトマス紙が青色に）。加熱して何も残らないAはアンモニア水（気体の溶けた水溶液）、白い固体が残るCは水酸化ナトリウム。Bは中性で白い固体が残る塩化ナトリウム水溶液。"], ["(3)", "ウ", "D・Eは塩酸と炭酸水。石灰水を加えて白くにごるのは二酸化炭素がとけた炭酸水。"], ["(4)", "18.8％", "質量パーセント濃度＝溶質÷水溶液×100＝1.5÷8.0×100＝18.75 → 18.8％。"]]}, {"t": "問3-I 刺激と反応", "items": [["(1)", "あ：感覚　い：運動", "皮ふ（感覚器官）→ 感覚神経 → せきずい → 脳 → せきずい → 運動神経 → 筋肉。"], ["(2)", "か：0.27　き：5.47", "12人で一周する時間が平均3.29秒。1人あたり 3.29÷12＝0.274… → 0.27秒。信号の通る道は1人あたり1.5m。速さ＝1.5÷(3.29÷12)＝18÷3.29＝5.47m/s。"], ["(3)", "反射", "刺激に対して無意識に起こる反応。"], ["(4)", "イ・ウ", "寒くて体がふるえる、食べ物を口に入れるとだ液が出る、は無意識の反応（反射）。ア・エは意識して行う反応。"]]}, {"t": "問3-II 植物の分類", "items": [["(1)①", "A：エ　D：ア", "A：根・茎・葉の区別がない（ゼニゴケ）か、あるか。D：子葉が1枚（ツユクサ＝単子葉類）か2枚（タンポポ＝双子葉類）か。"], ["(1)②", "イヌワラビ：ウ　マツ：オ　タンポポ：ア", "イヌワラビ＝シダ植物 → ゼンマイ。マツ＝裸子植物 → スギ。タンポポ＝双子葉類 → ダイコン。トウモロコシは単子葉類、スギゴケはコケ植物。"], ["(2)", "胞子", "コケ植物とシダ植物は、種子ではなく胞子でふえる。"], ["(3)", "あ：主根　い：側根", "タンポポの根は、太い主根と、そこからのびる細い側根からなる（双子葉類）。ひげ根は単子葉類。"]]}, {"t": "問4-I 音の性質", "items": [["(1)", "エ", "空気が音を伝える。真空中（空気がない）では音は伝わらない。"], ["(2)", "a", "振幅は、波の中心線からの最大のふれ幅（上下の幅の半分）を表すa。bは1回の振動の長さの一部、cは波長（周期）、dは…別の長さ。"], ["(3)", "イ", "強くはじくと、音は大きくなり（振幅が大きい）、音の高さ（振動数）は変わらない。波の数は同じで、山が高く谷が深いイ。"], ["(4)", "か：ア　き：カ　く：エ", "条件を1つだけ変えて比べる（対照実験）。か：弦の強さ→AとB。き：太さ→CとD。く：長さ→BとC。"]]}, {"t": "問4-II 仕事と仕事率", "items": [["(1)", "仕事：0.6J　仕事率：0.3W", "仕事＝力×距離＝6.0N×0.10m＝0.6J。引く速さ5cm/sで10cm引くのに2秒。仕事率＝0.6J÷2s＝0.3W。"], ["(2)", "エ（A＝B＝C）", "仕事の原理：道具を使っても仕事の大きさは変わらない。滑車・動滑車・斜面とも同じ。"], ["(3)", "あ：2　い：1/2", "動滑車を使うと、引く距離は2倍（10cm→20cm）、力は半分（6.0N→3.0N）。"], ["(4)", "50cm", "仕事は変わらず0.6J。1.2N×距離＝0.6J → 距離0.5m＝50cm。（3.0N×20cm＝1.2N×50cm）"]]}], "S7_social": [{"t": "問1 世界地理（東京中心の正距方位図法）", "items": [["(1)①あ", "エ", "東京中心の図。東京から最も近い大陸はユーラシア大陸。ア：南にはオーストラリア大陸もある。イ：真東は太平洋。ウ：北アメリカは北東。"], ["(1)②い・う", "い：28　う：103", "対蹠点（地球の反対側）の緯度は北緯28度→南緯28度、経度は東経77度→反対側は東経77−180＝西経103度。"], ["(2)", "エ", "ニュージーランド（東経約177度）は日本（東経135度）より時刻が約3時間進む。12月23日午前8時＋3時間＝12月23日午前11時。"], ["(3)A・E", "A：イ　E：オ", "Aは南アメリカ大陸（熱帯63.4％が最大）、Eはオーストラリア大陸（乾燥帯57.2％が最大）。冷帯・寒帯が多いアは北アメリカ、エは寒帯100％の南極、ウはユーラシア、カはアフリカ。"], ["(4)", "X：小麦　Y：米　Z：とうもろこし", "小麦は中国・インド・ロシア、米は中国・インド・バングラデシュ、とうもろこしはアメリカ・中国・ブラジルが上位。"], ["(5)", "イ（模範解答）", "造山帯は、環太平洋造山帯とアルプス＝ヒマラヤ造山帯（新期造山帯）。ウラル山脈やアパラチア山脈など古期造山帯は含まれない。地図の山脈のうち、新期造山帯に属さないものを選ぶ。"], ["(6)", "太平洋", "Xは日本の東（地図の右側）の大洋。"], ["(7)", "ア", "ブラジルは森林が国土の約6割（58.1％）を占め、丸太の生産量も多い。イはカナダ、ウは日本（森林率が高い）、エはロシア（森林面積が最大）。"]]}, {"t": "問2 日本の諸地域", "items": [["(1)①", "約1.5cm", "実際の距離375m＝37500cm。縮尺 1/25000 なので 37500÷25000＝1.5cm。"], ["(1)②", "X：南西　Y：老人ホーム", "河川は標高の高い方から低い方へ流れる。地図記号⌂（老人ホーム）。"], ["(1)③", "ゆるやかな傾斜になっており、水田として利用されている。", "Eは田（二）の記号が広がり、等高線の間隔が広い（ゆるやかな傾斜）。"], ["(1)④", "A：1　B：4　C：4", "2万5千分の1で4cm＝1km → 1km²。5万分の1で4cm＝2km → 4km²。同じ範囲は、5万分の1だと面積が 1/4 になる。"], ["(2)①", "秋田平野：カ（雄物川）　濃尾平野：ウ（木曽川）", "秋田平野には雄物川、濃尾平野には木曽川・長良川・揖斐川（木曽三川）が流れる。"], ["(2)②", "X：Iターン　Y：Uターン", "都市出身者が地方に移り住む（I）、地方出身者が都市で暮らした後、出身地に戻る（U）。"], ["(2)③", "ウ", "上越新幹線が通るのは新潟県などで、竿燈まつりは秋田県（秋田新幹線）。"], ["(2)④", "ア・エ", "A−Bがマイナス＝昼間人口が夜間人口より少ない（流出が多い）（ア）。エ：山梨県は差がほぼ0、埼玉・神奈川は−47→−91、−40→−93で大きく変化。イは2020年の方が集中が大きい。ウは東京の増加（270）は埼玉と神奈川の合計減少（91＋93＝184）と等しくない。"]]}, {"t": "問3 原始・古代", "items": [["(1)", "X：藤原道長　Y：卑弥呼", "カード1「この世をば わが世とぞ思ふ 望月の」は藤原道長の歌。カード3の邪馬台国の女王は卑弥呼。"], ["(2)", "イ", "古い順：カード3（卑弥呼・3世紀）→カード4（十七条憲法・604）→カード2（万葉集・奈良時代）→カード1（藤原道長・平安）。3番目はカード2。"], ["(3)", "阿弥陀仏を信じて念仏をとなえることで、死んだ後に極楽浄土に生まれ変われると信じること。", "平等院鳳凰堂（藤原頼通）などが建てられた。"], ["(4)", "万葉仮名", "漢字の音を使って日本語を表した文字。（のちに平仮名・片仮名が生まれる）解答用紙は「仮名文字」。"], ["(5)", "調", "荷札は、都に納める「調」。"], ["(6)", "D", "銅鐸は青銅器（弥生時代）。D「鉄器」が誤り。"], ["(7)", "ア", "十七条憲法（604年）のころ、ムハンマドがイスラム教をおこした（610年ごろ）。"], ["(8)", "A：ア（天智天皇）　B：ウ（天武天皇）　C：イ（持統天皇）", "645年の大化の改新に着手したのち即位＝中大兄皇子（天智）。672年の壬申の乱に勝利＝大海人皇子（天武）。694年に藤原京に遷都＝持統。"]]}, {"t": "問4 近世・近代", "items": [["(1)①", "あ：エ（スペイン）　い：オ（ポルトガル）", "コロンブスとマゼランはスペインの、バスコ・ダ・ガマはポルトガルの支援を受けた。"], ["(1)②", "ア・イ", "ヨーロッパ人が香辛料（胡椒など）や絹織物をアジアから得ようとした。"], ["(2)", "ウ（山崎の戦い）※模範解答はエ", "1582年に豊臣秀吉が明智光秀を倒した戦いは山崎の戦い（ウ）。関ヶ原の戦いは1600年。模範解答の「エ」は誤りの可能性があるので、確認してください。"], ["(3)", "老中", "資料1の「X」は将軍の下、町奉行などの上にある老中。田沼意次も老中になった。"], ["(4)", "オ（水野忠邦）", "株仲間の解散、人返し令（農民を村へ帰す）、倹約・出版統制、上知令、薪水給与令は天保の改革。"], ["(5)", "イ（①元禄　②化政　③菱川師宣）", "17世紀末〜18世紀初めの上方の町人文化は元禄文化（井原西鶴・近松門左衛門・松尾芭蕉・菱川師宣）。19世紀初めの江戸の文化は化政文化。"], ["(6)①", "エ → イ → ウ → ア", "ペリー来航（1853）→日米和親条約（1854）→日米修好通商条約（1858）→薩長同盟（1866）。"], ["(6)②", "ア・ウ", "1841〜1867年のアメリカ：南北戦争（1861〜65）、奴隷解放宣言（1863）。ワシントン就任は1789年、独立宣言は1776年。"]]}, {"t": "問5 公民", "items": [["(1)①", "ウ", "グローバル化で国際分業が進むため、自国で有利な産業に力を入れ、不利な産業は他国にたよる。"], ["(1)②", "グローバル", "国境をこえたモノ・ヒトの交流が盛んになる、世界の一体化＝グローバル化。"], ["(2)", "イ・ウ", "イ：日本の65歳以上は約0.36億人、2位のフランスは約0.14億人で2倍以上。ウ：14歳以下は30.2→11.9％（−18.3）、65歳以上は5.7→28.6％（＋22.9）で、増えた割合の方が大きい。ア：人数が最も少ないのはフランス。エ：2060年は約1.4人で、1.0人以下ではない。"], ["(3)①", "議院内閣制", "内閣が国会の信任にもとづいて成り立つしくみ。"], ["(3)②", "ア", "AのうちBから内閣への矢印は「不信任決議」（国会→内閣）。"], ["(3)③", "世論　記号：イ", "国民の意見＝世論。形成に不可欠な権利は、表現の自由（集会・結社・言論・出版の自由）。"], ["(3)④", "イ", "予算は、両院協議会でも一致しなければ衆議院の議決が国会の議決となる（衆議院の優越）。法律案は衆議院の3分の2以上の再可決が必要。"], ["(4)", "エ", "首長の解職・議会の解散請求は直接請求権（直接民主制）。有権者が多い地域は必要な署名数の割合が低くなるが、署名は集めにくい。"]]}], "S7_japanese": [{"t": "問一 漢字", "items": [["(1)①", "かくご", "覚悟を決める。"], ["(1)②", "ていせい", "訂正。誤りを正すこと。"], ["(1)③", "ほころ（びる）", "綻びる。顔が「ほころぶ」＝笑顔になる。"], ["(1)④", "す（ます）", "耳を澄ます。「澄」は「すむ・すます」。"], ["(1)⑤", "じんそく", "迅速。非常にはやいこと。"], ["(2)①", "ア", "「養分」の「養」。ア「休養」が同じ字。イ内容、ウ海洋、エ木々の「葉（コウヨウ＝紅葉）」。"], ["(2)②", "イ", "「適度」な運動の「適」。イ「最適」が同じ字。ア的確（確）、ウ好敵手（敵）、エ汽笛（笛）。"], ["(2)③", "ウ", "髪の毛を「結う」。ウ「結論」が同じ字。ア採決、イ出欠、エ清潔。"], ["(2)④", "イ", "「要求」の「求」。イ「欲求」が同じ字。ア救出、ウ速球、エ給料。"], ["(2)⑤", "エ", "「悲鳴」の「鳴」。エ「寺のかねを鳴らす」が同じ字。ア名、イ命、ウ明。"]]}, {"t": "問二 小説（森谷明子『春や春』より）", "items": [["あらすじ", "—", "俳句甲子園をめざす高校の俳句同好会。5人目のメンバーを決める場面で、会長の茜と1年生のトーコは、すでに瑞穂以外の4人に決めていた。瑞穂は自分が「いらない人間」と感じて傷つき、「補欠に回る」と言うトーコの言葉に複雑な思いをいだく。"], ["(1)", "a", "a「決めて」は下一段活用の動詞。b「押し隠して」・c「うなずいた」・d「わめく」は五段活用。"], ["(2)", "イ（倒置法）", "「実際、王道の俳句を作り続ける。先生の言うポイントの第二、『七点の句』を」のように、語順を入れかえて強調する倒置法。"], ["(3)", "教科書通り", "「自分には茜のような『教科書通り』の句を作ることはできないが、俳句甲子園ではそのような俳句は評価されるから」。"], ["(4)", "ウ", "「いらない人間」と思ったのは、俳句甲子園で勝つための貢献度の低さ（鑑賞点を稼げるのはトーコ）を認めざるを得ないから。ア・イ・エは本文と合わない。"], ["(5)", "予期しない言葉（別解：思ってもみない言葉）", "「…だから瑞穂、おねがいね」は、補欠に回ると決まっていると思っていなかった瑞穂にとって、思いがけない言葉だった（10字以内）。"], ["(6)", "例：創作ができる人には自分の気持ちはわからないとあきらめる気持ち。", "「不思議な笑い方」は、自分の悩みを説明してもわかってもらえないというトーコのあきらめ。35〜40字。"], ["(7)i", "さかあがり・音痴の人間", "トーコが具体例として挙げた文：「さかあがりができない人に…」「音痴の人間は…」。それぞれ初めの5字。"], ["(7)ii", "エ", "瑞穂は、曲げたくない自分と、周囲に認められたい気持ちの間で揺れる、プライドが高い人物。"]]}, {"t": "問三 論説（上田紀行『生きる意味』より）", "items": [["要旨", "—", "数字で測られる「外側から見る成長」ではなく、人生地図の濃淡のように変わる「生きる意味」の成長＝内的成長が大切。人生に創造性をもつことが、生きることの豊かさにつながる。"], ["(1)", "ウ", "「（数字に）表される」の「れる」は受け身。ア「愛される」・イ「閉じられる」・エ「延期される」も受け身だが、ウ「まだ着られる服」は可能（～することができる）で、用法が違う。"], ["(2)", "エ", "a：前の内容に付け加える「そして」。b：前とは反対の内容に移る「ところが」。"], ["(3)", "ア", "「私たちの成長を内側から見る目」とは、自分自身の経験を積み重ねていく中で見出される成長観。他者との比較で表れる成長観（外側）とは逆。"], ["(4)", "人生地図の濃淡の具合が変わっていくこと", "「生きる意味」の成長を比喩で言いかえた部分。本文：「人生地図の濃淡の具合が変わっていく」（17字）。"], ["(5)", "人生に「創造性」がないから", "例の中の女性・男性が「何か不自由していない…これでいいのか」と感じたのは、人生に創造性がないからだと筆者は言う（15字以内）。"], ["(6)", "ウ", "閉じた「創造性」＝評価や効率のためだけに自分を駆り立てること。具体例は、多くの人に自分の描く絵を高く評価してもらうことを夢見て、一日何時間もデッサンに取り組むウ。"], ["(7)", "例：今の私は、バスケットボールに打ち込んでいる。それが筆者のいう内的成長だと考える。試合に勝つための練習を重ね、自分の努力が成果になることを体験すると、人生経験が積み重なり、生きる意味が深まっていくからである。", "条件：①「内的成長」「人生経験」を使う、②自分の体験と理由、③80〜100字。（解答は例）"]]}, {"t": "問四 古文（『宇治拾遺物語』）", "items": [["大意", "—", "孔子が道を行くと、八歳ほどの子どもに会い、「日の出る所と洛陽はどちらが近いか」と聞いた。子どもは「日の出る所は近い。洛陽はまだ見えない」と答えた。孔子は「かしこき童なり」と感心した。"], ["(1)", "といもうすよう", "「と問ひ申すやう」→歴史的仮名遣い「ひ→い」「やう→よう」。"], ["(2)", "1：より遠い　2：日の入る所", "「八つばかりなる童」は、日の入る所と洛陽を比べている。ここからの距離が（日の入る所より遠い洛陽）か、それとも…の形で空所をうめる。（模範解答に従う）"], ["(3)", "日の入る所は遠い。洛陽は近い。", "童の答え：「日の入る所は遠し。洛陽は近し」（現代語訳）。※解答用紙には「日の入る所は遠い。洛陽は近い。」と記されている。"], ["(4)問1", "かしこき童なり", "孔子が童を感心して言った七字。"], ["(4)問2", "ウ", "孔子に問いかける人はいないのに、それができたから、孔子は童を「かしこき童なり」と感じた。"]]}], "A5_math": [{"t": "問1 計算・方程式の小問", "items": [["(1)", "−2/5", "−9/10 × (−2/3)² ＝ −9/10 × 4/9 ＝ −2/5。2乗を先に計算し、約分する。"], ["(2)", "3", "−4² は「4²の符号を変えたもの」で −16。(−16+1)÷(−5) ＝ −15÷(−5) ＝ 3。"], ["(3)", "(3x−4y)/4", "通分して (2(2x−y) − (x+2y))/4 ＝ (4x−2y−x−2y)/4 ＝ (3x−4y)/4。（3/4x − y と書いても正解）"], ["(4)", "a(x−4)²", "共通因数 a でくくる：a(x²−8x+16) ＝ a(x−4)²。"], ["(5)", "√6", "√24＝2√6。2√12×1/√8 ＝ 2×2√3/(2√2) ＝ 2√3/√2 ＝ √6。2√6−√6＝√6。"], ["(6)", "x = 3", "両辺に35をかけて 7(x+2)＝5(2x+1) → 7x+14＝10x+5 → x＝3。"], ["(7)", "x = 4, y = 6", "上の式を12倍：3x−8y＝−36。下の式を3倍：3x+y＝18。引くと −9y＝−54 → y＝6、x＝4。"], ["(8)", "ウ", "ℓ＝2πr の両辺を 2π でわって r＝ℓ/2π。"]]}, {"t": "問2 小問集合", "items": [["(1)", "21 + 12√3", "a²−2ab+b²＝(a−b)²。a−b＝2√3+3。2乗して 12+12√3+9＝21+12√3。"], ["(2)", "5/36", "偶数は右回り・奇数は左回り。5頂点なので5で割った余りで考える。1→−1（余り4）、2→+2、3→−3（余り2）、4→+4、5→0、6→+6（余り1）。2回の合計が5の倍数になるのは (5,5)の1通りと、余り1と余り4の組（6と1か4）：(6,1)(6,4)(1,6)(4,6)の4通り。合計5通り → 5/36。"], ["(3)", "エ", "36人なので、第1四分位数以下に9人入る。A組・B組とも第1四分位数が15m以下なので、15m以下の生徒が9人以上いる（エ）。アの範囲はB組の方が大きい、イは30mの生徒がいるとは限らない、ウは第3四分位数と第2四分位数の関係が逆。"], ["(4)", "ウ", "展開図を組み立てると、P と C は立方体の同じ辺の両端になるので、線分PCが最も短い（立方体の辺）。"], ["(5)", "25度", "平行四辺形で対角は等しいので ∠ABC＝∠D＝60°。直線ℓ・mが平行なので錯角から、∠x＝60°−35°＝25°。"], ["(6)", "224π cm³", "P：底面の半径5・高さ12の円すい＝1/3×25π×12＝100π。Q：半径9・高さ12＝1/3×81π×12＝324π。差は 324π−100π＝224π。"], ["(7)", "a/3 cm", "正方形の1辺を1とする。AC：y＝1−x（A(0,1)、C(1,0)、B(0,0)）、E(1,1/3)、F(5/7,1)。BE：y＝x/3、BF：y＝7x/5。G(3/4, 1/4)、H(5/12, 7/12)。GHのx座標の差は 3/4−5/12＝1/3、斜め45°なので GH＝√2/3。AC＝√2 なので GH＝AC×1/3＝a/3。"]]}, {"t": "問3 連立方程式（貯金箱の硬貨）", "items": [["(1)", "x + 6 枚", "花子さんから100円硬貨6枚を受け取って貯金箱に入れたので、x＋6枚。"], ["(2)", "エ", "100円硬貨のちょうど…「100円硬貨の枚数は10円硬貨の1/5」という、両替した後の100円硬貨と10円硬貨の枚数の関係。式は x＋6＝(y−60)/5。（100円6枚＝10円60枚に両替）"], ["(3)", "100円硬貨5枚、10円硬貨115枚", "①：100x＋850＋10y＝2500 → 10x＋y＝165。②：5(x+6)＝y−60 → 5x−y＝−90。たすと 15x＝75 → x＝5、y＝115。確認：500＋850＋1150＝2500円。"]]}, {"t": "問4 関数", "items": [["(1)", "(2, −2)", "①y＝−x と②y＝−4/x の交点。−x＝−4/x → x²＝4。Aのx座標が−2なのでBはx＝2、y＝−2。"], ["(2)", "a = −1/2", "③y＝ax² がB(2,−2)を通るので −2＝4a → a＝−1/2。"], ["(3)", "(−3, −9/2)", "P(p, −p²/2)（p＜0）。AB の長さ4√2、直線ABは x＋y＝0。Pと直線ABの距離は |p−p²/2|/√2。面積＝1/2×4√2×|p−p²/2|/√2＝2|p−p²/2|＝15。p＜0 なので p²/2−p＝15/2 → p²−2p−15＝0 → p＝−3。P(−3, −9/2)。"]]}, {"t": "問5 図形（相似の証明）", "items": [["(1)ア・イ・ウ・エ", "ア：ADB　イ：DAE　ウ：EDB　エ：DEA", "∠DAB＝∠ADB（AB＝BDの二等辺三角形）。①②より ∠ACB＝∠DAE（③）。∠EBD＝∠EDB（BE＝EDの二等辺三角形）。④⑤⑥より ∠CBD＝∠EDB（錯角が等しいので CB∥DE）。同位角から ∠ABC＝∠DEA（⑦）。"], ["(1)オ", "2組の角（がそれぞれ等しい）", "③∠ACB＝∠DAE、⑦∠ABC＝∠DEA の2組の角が等しいので △ACB∽△DAE。"], ["(2)", "30度", "円周＝12π、弧BC＝3πなので中心角90°、円周角 ∠BAC＝45°。∠ABD＝∠CBD＝x とすると ∠ABC＝2x、∠ACB＝∠ADB＝(180°−x)/2。△ABCの内角の和：45°＋2x＋(90°−x/2)＝180° → 3x/2＝45° → x＝30°。"]]}, {"t": "問6 規則性（正六角形の模様とコマ）", "items": [["(1)", "エ（6, 2）", "EからDへは1回で動けない。2回で E→（6の位置）→D となる組を探す。EからDのとなりを通ってDへ、(6,2) が条件に合う。"], ["(2)", "1/18", "Cの位置へ2回で行く組み合わせは2通り。2/36＝1/18。"], ["(3)a・b・c", "a：12　b：15　c：I", "3回投げて、Eにいる場合は12通り、Iにいる場合は15通り。したがって、Iの位置にいる確率のほうが大きい。"]]}], "A5_english": [{"t": "問1 対話文", "items": [["(1)", "ア", "「カップを取って」→「はい、どうぞ（Here you are.）」。物を手渡すときの決まり文句。"], ["(2)", "イ", "May I help you?（いらっしゃいませ／お手伝いしましょうか）— 「いいえ、結構です（No, thank you.）。見ているだけです」。「見ているだけ」と続くので断る返事。"], ["(3)", "ア", "「私はキャシーに賛成です」—「私も（Me, too.）。彼女の意見は正しいと思う」。賛成に同意する返事。"]]}, {"t": "問2 語を書く（頭文字つき）", "items": [["(1)", "late（手書き解答は last と読めます）", "「父は夜（　）帰ってくる。昨夜は午後11時に帰ってきた」。l＋3文字で「遅く」＝late が文意に合う。手書き解答欄は last と読めるので、原本を確認してください。"], ["(2)", "daughter", "ケイコは女の子。彼女は両親のたった1人の娘（daughter）。"], ["(3)", "often", "How often do you go to the library?（どのくらいの頻度で）— 月に一度。"], ["(4)", "full", "Would you like another dish?—いいえ、結構です。おなかがいっぱい（I'm full）です。"]]}, {"t": "問3 適語選択", "items": [["(1)", "ア", "Let me introduce my uncle to you.（私のおじをあなたに紹介させてください）。let＋人＋動詞の原形。"], ["(2)", "ウ", "How do you come to this gym on the rainy day?—バスで来ます。手段をたずねる How。"], ["(3)", "エ", "She has been painting a picture since 10 a.m.（午前10時からずっと絵を描いている）。現在完了進行形（have been ＋ ～ing）。"], ["(4)", "ウ", "Let's ask the police officer standing over there.（あそこに立っている警察官にたずねよう）。現在分詞の後置修飾。"], ["(5)", "イ", "He is the artist who made a lot of popular songs.（人を表す関係代名詞 who）。"]]}, {"t": "問4 同じ意味の書きかえ", "items": [["(1)", "has / lived", "He began to live ... two years ago and still lives there. ＝ He has lived in New York for two years.（現在完了・継続）"], ["(2)", "going / to", "I will go ... ＝ I am going to go camping next Saturday.（be going to ～）"], ["(3)", "smaller / than", "not as big as ＝ smaller than（～より小さい）。"], ["(4)", "My / favorite", "I like P.E. the best. ＝ My favorite subject is P.E."]]}, {"t": "問5 並べかえ（3番目と5番目）", "items": [["(1)", "3番目：エ　5番目：ウ", "Don't be afraid of making a speech in English.（オ・イ・エ・キ・ウ・ア・カ）be afraid of ～ing＝～するのを恐れる。"], ["(2)", "3番目：ウ　5番目：ア", "What do you want me to do?（カ・オ・ウ・キ・イ・ア・エ）want 人 to ～。※解答の並びは「What do you want me to do?」"], ["(3)", "3番目：カ　5番目：オ", "Will you tell them how to play the sport?（キ・エ・カ・イ・オ・ア・ウ）how to ～＝～のしかた。"], ["(4)", "3番目：オ　5番目：エ", "I am good at playing the guitar.（ウ・キ・オ・イ・エ・ア・カ）"], ["(5)", "3番目：オ　5番目：エ", "Who can play basketball the best of the three?（ウ・キ・オ・イ・エ・カ・ア）the best of the three＝3人の中でいちばん。"], ["(6)", "3番目：ア　5番目：ウ", "There is a large park in front of my house.（オ・キ・ア・カ・ウ・イ・エ）in front of ～＝～の正面に。"]]}, {"t": "問6 対話文：クラブ活動は全員がするべきか", "items": [["(1)", "チームメイトとうまくやる方法や、年上の人とコミュニケーションを取る方法。", "These things は直前のジュディの発言「勉強では学べない多くのこと」＝For example の2つ（①how to do well with teammates ②how to communicate with older persons）。"], ["(2)②", "エ（I'm for Kaori, too.）", "キャシーは、トシ（カオリに賛成）に続けて自分の考えを述べる。同じくクラブ活動は全員がやる必要はないという立場なので「私もカオリに賛成です」。"], ["(2)③", "ウ（OK）", "森先生のまとめ：「どちらの場合も（OK）。生徒にはそれぞれの事情があるから」。"], ["(3)(a)", "エ", "トシ（My dream is to become a professional soccer player）とキャシー（I want to become a professional pianist）は、どちらも夢のために時間を使いたい。"], ["(3)(b)", "ア", "「お金を払う」という話は出ていない。ウ（休日にも活動：on many of our holidays）、エ（good times and bad times）、イ（the things I need…）は本文にある。"], ["(4)", "イ", "カオリは、週末や長期休みに「家で自分の好きなことがしたい」から。"], ["(5)", "イ", "ヒデは、クラブ活動を通して「本当の友達」ができると言っている。"]]}, {"t": "問7 長文：インターネットの歴史", "items": [["(1)①", "エ（the history of the Internet）", "直前に「いつ、どのように生まれたか知っていますか」とあり、続くのはインターネットの歴史の話。"], ["(1)②", "イ（hard）", "「コンピュータは大きくて重く、動かすのが（hard）だった」。so ～ that…＝とても～なので…。"], ["(2)(a)", "エ", "約60年前、研究者たちは「コンピュータの中のデータをもっと簡単に手に入れたかった」（Many researchers wanted to improve the bad situation.）。"], ["(2)(b)", "ウ", "スプートニクは、アメリカにコンピュータネットワークシステムをつくる発想を与えた（戦争後もデータをやり取りする方法を考え始めた→1969年に最初のシステム）。"], ["(3)", "エ", "this problem＝直前の「システムを使うことを許された人が少数だった」。つまり、多くの人がネットワークシステムに参加できなかった。"], ["(4)", "ア・ウ", "ア：60年ほど前に政府の研究者がコンピュータを使っていた（本文冒頭）。ウ：1967年に考え始め、1969年に最初のシステムができた＝約2年。イ：最初の人工衛星はソビエト連邦。エ：最初のシステムはアメリカ。オ：インターネットの誕生は約25年ではなく、1983年。"]]}, {"t": "問8 自由英作文（10〜15語）", "items": [["What do you want to try at high school?", "I want to try a sport that I have never played at high school.", "例（14語）。I want to ～ で始め、10〜15語。例：I want to be a member of the baseball club at school."]]}], "A5_science": [{"t": "問1-I 圧力", "items": [["(1)あ・い・う", "あ：C　い：A　う：750", "机を押す力は物体の重さ。A 0.3N、B 0.8N、C 1.5N なので最大はC。圧力＝力÷面積。A：0.3N÷(0.02m×0.02m)＝750Pa、B：0.8N÷0.0016m²＝500Pa、C：1.5N÷0.0025m²＝600Pa。最大はA、750Pa。"], ["(2)", "エ・カ", "机が受ける圧力が最大になるのは、机にふれる面積が最も小さいAが下で、重さが大きい物体を上にのせたとき。"], ["(3)", "3つ", "Aを2つ重ねた圧力＝0.6N÷0.0004m²＝1500Pa。Bを n 個重ねると 0.8n÷0.0016＝500n Pa。500n＝1500 → n＝3。"], ["(4)", "9000N", "100000Pa×0.09m²（900cm²）＝9000N。"], ["(5)", "イ", "菓子袋が山頂でふくらむのは、気圧が下がり、袋の外から押す大気圧が小さくなるから。"]]}, {"t": "問1-II 堆積岩", "items": [["(1)①②", "①ア（目）　②ウ（手に持った堆積岩）", "ルーペは目に近づけ、見るものを前後に動かしてピントを合わせる（手にもったものを動かす）。"], ["(2)", "カ", "Aは大きな丸い小石＝れき岩、Bは1mmくらいの丸い粒＝砂岩。"], ["(3)", "ア", "Cは貝などの化石をふくみ、うすい塩酸で泡が出る＝石灰岩。生物の死がいが堆積した岩石で、鉄くぎでこすると傷がつく。"], ["(4)①", "イ（サンヨウチュウ）", "フズリナは古生代の化石。サンヨウチュウも古生代。ビカリアは新生代、アンモナイトは中生代、ナウマンゾウは新生代。"], ["(4)②", "示準化石", "地層ができた時代を推定できる化石。"]]}, {"t": "問2-I 酸化銅と炭素の反応", "items": [["(1)", "ウ", "石灰水が試験管Aに逆流しないよう、火を消す前にガラス管を石灰水から抜く。"], ["(2)", "酸化銅：還元　炭素：酸化", "酸化銅は酸素をうばわれて銅になる（還元）。炭素は酸素と結びついて二酸化炭素になる（酸化）。"], ["(3)", "赤い物質：3.20g　気体：1.10g", "グラフより、酸化銅4.00gは炭素0.30gと過不足なく反応して銅3.20gになる。炭素が0.40gなら炭素は余るので、赤い物質（銅）は3.20gのまま。発生した気体（二酸化炭素）は 4.00＋0.30−3.20＝1.10g。"], ["(4)", "図", "2CuO ＋ C → 2Cu ＋ CO₂。空欄には、左は炭素原子1個、右は銅原子2個をかく。"]]}, {"t": "問2-II 塩酸の電離", "items": [["(1)①", "電離", "電解質が水にとけて陽イオンと陰イオンに分かれること。"], ["(1)②", "あ：H⁺　い：Cl⁻", "HCl → H⁺ ＋ Cl⁻。"], ["(2)", "水素イオン", "青色リトマス紙の色が陰極側に広がった。陽イオン（H⁺）が陰極へ移動して酸性の色（赤）に変えたため。"], ["(3)", "エ・オ", "陽極で発生した気体は塩素（刺激臭）。殺菌作用と漂白作用がある。アは二酸化炭素、イは酸素、ウは水素の性質。"], ["(4)", "C", "水酸化ナトリウム水溶液ではアルカリ性を示す水酸化物イオンが陽極側へ移動するので、赤色リトマス紙の陽極側（C）が青く変わる。"]]}, {"t": "問3-I 植物の分類", "items": [["(1)", "C", "雌花は枝の先端近くにつく小さな松かさ（C）。雄花は根もと側（A付近）。"], ["(2)", "胞子", "イヌワラビ（シダ植物）とゼニゴケ（コケ植物）は胞子でなかまをふやす。"], ["(3)①", "あ：胚珠　い：子房", "被子植物は、受粉後に胚珠が種子になり、子房の中に包まれている。"], ["(3)②", "ウ（イチョウ）", "マツは裸子植物。イチョウ、スギ、ソテツなども裸子植物（スギナはシダ植物）。サクラ・アサガオは被子植物。"], ["(4)", "イ", "根・茎・葉の区別があるのは、アブラナ・マツ・イヌワラビ。コケ植物のゼニゴケだけは区別がない。ア（光合成）はすべての植物に当てはまる。ウの花・エの実は、アブラナ以外にもないものがあるので「ゼニゴケだけ」とはいえない。（模範解答に従う）"]]}, {"t": "問3-II 反射", "items": [["(1)", "反射", "刺激に対して無意識に起こる反応。"], ["(2)①", "中枢神経", "脳とせきずい。"], ["(2)②", "b → f", "反射の経路：皮ふ→（感覚神経b）→せきずい→（運動神経f）→筋肉。脳を通らない。"], ["(3)", "イ", "うでを曲げるとき、Aの筋肉が縮み、Bの筋肉がゆるむ。"], ["(4)", "ア", "暗い所に入るとひとみが大きくなる。これはこうさいのはたらき。"], ["(5)", "ウ", "口にあめを入れるとだ液が出るのは無意識の反応（反射）。ア・イ・エは意識して行う反応。"]]}, {"t": "問4-I 電流と磁界", "items": [["(1)", "ア・イ", "コイルの動く向きを逆にするには、磁石の極か電流の向きのどちらか一方を逆にする。両方逆にすると元と同じ向きになる（ウは誤り）。"], ["(2)", "エ", "抵抗が小さいほど電流が大きくなる。Bを2つ並列につなぐと全体の抵抗が最も小さくなる。"], ["(3)", "電磁誘導", "コイルの中の磁界が変化して電圧が生じる現象。"], ["(4)", "ウ", "磁石のN極を下にして落下させると、コイルに近づくときと遠ざかるときで電流の向きが逆になる（右→左）。"]]}, {"t": "問4-II エネルギー", "items": [["(1)", "C → B → D → E", "運動エネルギーは位置が低いほど大きい。Cが最も低く、次にB、D、Eの順に高くなる。"], ["(2)", "力学的エネルギー保存の法則", "運動エネルギーと位置エネルギーの和は一定。"], ["(3)", "図", "水平面上の小球にはたらく垂直抗力は、重力（20g＝0.2N）と同じ大きさで上向き。1目盛り0.1Nなので2目盛りの矢印を、小球の中心の●から真上にかく。"], ["(4)", "慣性", "物体がそれまでの運動を続けようとする性質。"], ["(5)", "エ", "Aより高い位置から転がすと、位置エネルギーが大きくなり、Fでの速さが大きくなる。"], ["(6)", "ア", "質量が大きい小球ほど運動エネルギーが大きく、木片が動く距離は長くなる。"]]}], "A5_social": [{"t": "問1 世界地理", "items": [["(1)", "ロッキー（山脈）", "北アメリカ西部にそびえる山脈。環太平洋造山帯に属する。"], ["(2)①", "イ・エ", "イ：インドはICT産業が発展。エ：綿花・綿工業が盛ん、北部の平野では稲作。ア：インドの人口は14億人をこえ、すでに世界一（2023年）なので「予想」は誤り。ウ：ヒンドゥー教徒は牛肉を食べない（豚肉ではない）。"], ["(2)②", "A", "アジア州は面積では約23.9％だが人口は59.8％をしめるのでA。"], ["(3)", "フィヨルド", "氷河に削られてできた奥行きのある湾。ノルウェーの海岸など。"], ["(4)", "レアメタル", "地球上の存在量が少なく、取り出すのが技術的に難しい金属（クロム・マンガンなど）。南アフリカ共和国などで産出。"], ["(5)", "イ", "赤道は緯度0度の線。地図5では南アメリカ北部を通るイ。"], ["(6)", "ウ", "EUは人口約4.5億人・面積約400万km²・GDPが大きく、貿易額が最も大きい。"], ["(7)", "例：自家用乗用車のかわりに電車などを利用することで、二酸化炭素排出量の削減が期待できる。", "資料4で、自家用乗用車は1kmあたりの二酸化炭素排出量が最も多く、鉄道は少ない。"]]}, {"t": "問2 日本の諸地域", "items": [["(1)①", "A", "等高線から標高を読み取る。山のふもとのB・Cに対し、A地点は山の中腹で最も高い。"], ["(1)②", "ウ（果樹園）", "扇状地の斜面に果樹園が広がる。"], ["(1)③", "ア（扇状地）", "山地から平地に出るところにできる緩やかな傾斜の地形。"], ["(1)④", "約1875m", "25000分の1で7.5cm＝7.5×25000＝187500cm＝1875m。"], ["(2)①", "エ（もも）", "山梨県が約30.7％で1位、福島県が2位。"], ["(2)②", "エコツーリズム", "自然環境を体験しつつ、環境保全について考える観光。"], ["(2)③", "千島海流（親潮）", "北海道の太平洋側には寒流の千島海流（親潮）が流れる。夏、南東の暖かい湿った空気が冷やされて濃霧が出る。"], ["(2)④", "ウ・エ", "ウ：化学は約9倍（0.105兆円→約0.92兆円）。エ：金属の割合は下がったが、生産額は約0.30兆円→約1.7兆円に増えた。アの重化学工業の割合は3倍以上にはなっていない。"]]}, {"t": "問3 中世", "items": [["(1)", "承久の乱", "1221年、後鳥羽上皇が鎌倉幕府を倒そうとしておこした戦い。幕府は六波羅探題を置いて朝廷を監視した。"], ["(2)①", "元", "1271年、モンゴル帝国のフビライ・ハンが国号を元と定めた。"], ["(2)②", "ウ（マルコ・ポーロ）", "『世界の記述（東方見聞録）』で日本を「黄金の国ジパング」と紹介した。"], ["(3)", "ア → オ → エ", "チンギス・ハンがモンゴル統一（1206）→御成敗式目（1232）→永仁の徳政令（1297）。"], ["(4)", "a：エ（二条河原の落書）　b：キ（後醍醐天皇）", "建武の新政の混乱を風刺した落書が、後醍醐天皇の御所の近くにかかげられた。"], ["(5)", "イ（借金）", "正長の土一揆：「ヲヰメ（負い目）」＝借金。土倉・酒屋に借金の帳消しを求めた。"], ["(6)", "Y：ウ　Z：ア", "山城の国一揆（京都府南部）＝ウ、加賀の一向一揆（石川県）＝ア。"], ["(7)", "分国法", "戦国大名が領国を治めるためにつくった法律。"]]}, {"t": "問4 近現代", "items": [["(1)①", "ウ（福沢諭吉）", "『学問のすゝめ』の著者は福沢諭吉。"], ["(1)②", "エ（農地改革）", "農地改革は第二次世界大戦後の改革。郵便制度・学制・徴兵令は明治政府の政策。"], ["(2)①②", "①c　②b", "南満州鉄道株式会社の設立（1906）はc（1904〜1911）。八幡製鉄所の操業開始（1901）はb（1894〜1904）。"], ["(3)", "ア・イ・エ", "ワシントン会議（1921〜22）で、日英同盟の解消、海軍の軍備縮小、山東省の権益の返還が決まった。遼東半島の返還は三国干渉（1895）。"], ["(4)", "ア（日本が韓国を併合した）", "石川啄木の短歌は韓国併合（1910）に対する歌。カード2（日露戦争後）とカード3（第一次世界大戦）の間の出来事。"], ["(5)", "公共事業を増やすことで雇用をつくり出し、失業率を低下させ、景気を良くするため。", "世界恐慌で各国の失業率が急上昇した。アメリカでは、ダムなどの公共事業で失業者を雇い、景気を回復させようとした（ニューディール政策）。"], ["(6)", "イ", "カード4（昭和）：太平洋戦争の終結後、沖縄は20年以上アメリカの占領下にあった。アは日中戦争中の国家総動員法、ウは日本の国際連合加盟は1956年、エはキューバ危機が冷戦の始まりではない。"], ["(7)", "イ → ウ → ア", "イ：日露戦争直前（日英同盟とロシア対立）、ウ：第一次世界大戦直前、ア：第二次世界大戦直前（日独とソ連・イギリス）。"]]}, {"t": "問5 公民", "items": [["(1)①(i)", "平等", "平等選挙＝一人一票の選挙権。"], ["(1)①(ii)", "イ", "小選挙区制は、1つの選挙区から1名を選ぶので、大きな政党が当選しやすい。"], ["(1)①(iii)", "エ", "衆議院だけが行える：内閣不信任の決議。予算案・条約の承認は両院の議決（衆議院の先議・優越）、法律案は両院で審議。"], ["(1)②", "平和主義", "日本国憲法の三つの基本原則：国民主権・基本的人権の尊重・平和主義。"], ["(2)①", "ウ（文部科学省）", "教育・科学技術・学術・スポーツ・文化の振興を担う省庁。"], ["(2)②", "リテラシー", "情報リテラシー、メディアリテラシー。情報を正しく活用する力。"], ["(2)③", "ア（労働基準法）", "1週40時間、1日8時間は労働基準法第32条。"], ["(2)④", "ウ", "平成元年度と令和4年度を比べて税収が増えたのは消費税だけ（消費税は導入されたばかり、所得税・法人税は低下）。"]]}], "A5_japanese": [{"t": "問一 漢字", "items": [["(1)①", "おろし", "卸売り（おろしうり）。"], ["(1)②", "あや（うい）", "危うい。"], ["(1)③", "かんかつ", "管轄。"], ["(1)④", "せんめい", "鮮明。"], ["(1)⑤", "はんざつ", "煩雑。"], ["(2)①", "エ", "「特別なカカクで売り出す」＝価格。エ「商品の高いカチ」が同じ「価」。"], ["(2)②", "ウ", "「ジョウの挨拶をする」＝「丁」ではなく「ウ」の選択肢が同じ漢字（解答はウ）。"], ["(2)③", "イ", "「車をシュウリに出す」＝修理。イ「新入生のケンシュウを行う」が同じ「修」。"], ["(2)④", "ウ", "「友達を家にマネく」＝招く。ウ「ショウタイ客のリスト」＝招待。"], ["(2)⑤", "ア", "「相手のイキオいに押される」＝勢い。ア「今日のウンセイを占う」＝運勢。"]]}, {"t": "問二 小説（川上弘美『泣くのにいちばんいい時間』より）", "items": [["あらすじ", "—", "「あたし」は公園のベンチに座って泣くことが好きで、他の女のひとが泣いているのを見守っていた。男の子の絵くんと、泣く理由について話し、泣くことは悪いことではなく、気持ちのいいことだと考えている。"], ["(1)", "b", "a「すわって」・c「だまっていた」・d「めざして」は活用の種類が同じ。b「泣きつづけている」は「泣き続ける」で複合動詞…活用の種類が他と異なる。（解答はb）"], ["(2)", "女の人が長い時間泣いていたことを表す効果。", "「アリがミミズを運んでいってしまってからも、女のひとは泣きつづけていた」は、アリがミミズを運び去るほどの長い時間、泣いていたことを表している。"], ["(3)", "ウ", "絵くんは、教室では「あたし」といっしょにいたがらない。それは、学校で女の子と仲良くしているところを他の男の子たちに見られたくないから。"], ["(4)", "ア", "「あたしはその理由を絵くんといっしょに考えたい」。絵くんはわからないと答え、それでもいっしょに考えたいというのが「あたし」の気持ち。"], ["(5)", "誇りを保てなくなる", "本文：「誇りを保てなくなるわけだね」（9字）。"], ["(6)i", "クラスの女〜ていること", "「あたし」が先生にほめられるのは、いつも宿題をきちんとやってくるからだ、と女の子たちに思われている。学校でいやなことがある例。"], ["(6)ii", "X：真面目だから　Y：ウ", "大人から見ると「真面目だから」ほめられるのに、「あたし」自身は「大人の世界では評価されない」と考えている。"], ["(7)", "悪口を言う女の子たちが知らないうちにだまってがまんしている…（例）", "「ちょっといじわるな感じ」の『すかっと』とは、悪口を言われる経験を、泣くことでいやされた気持ち…の意味。40〜50字で、本文の言葉を使ってまとめる。※読み取りに自信が低い問題です。"]]}, {"t": "問三 論説（更科功『若い読者に贈る美しい生物学講義』より）", "items": [["要旨", "—", "生物多様性は、種内の多様性・種の多様性・生態系の多様性を含む。種が多いだけでなく、均等度が高いことが重要。ヒトは爆発的に増え、森林や農地の生物多様性を低くしてきた。ヒトの利益のためだけでなく、生態系全体を守る必要がある。"], ["(1)", "イ", "A：「しかし」ではなく、ヒトは一人ぼっちになってしまった。AとB：「Aところが…Bつまり」。「とうとう私たちヒトは一人ぼっちになってしまった」は、ヒトだけが残ったこと（種の多様性が失われたこと）を表している。"], ["(2)", "非常に低い状態", "現在、種内の多様性はさまざまな個性が見られるが、種の多様性は「非常に低い状態」である。"], ["(3)", "均等度", "「たんに種数が多いという意味ではない」＝木が一本しかないから多様性が低い、という「均等度」も重要。"], ["(4)i", "ヒトが変えてしまった", "森林を農地に変えたのは「ヒトが変えてしまった」環境。図の X に当てはまる。"], ["(4)ii", "ア", "環境を操作する能力の高いヒトの増加により、地球上の広い範囲で種の絶滅が起こった。"], ["(5)", "エ", "かつては多くの種が存在したはずの人類が、現在はヒト一種だけになってしまった。ヒトの爆発的な増加が始まったため。"], ["(6)", "ウ", "「生態系サービス」＝生態系がもたらす、ヒトのためになる利益。直接関わらず、安定をもたらすもの全てを指すのではなく、ヒトの営みに関わるもの。ア・イ・エは本文と合わない。"], ["(7)", "例：ヒトの手だけで生物多様性を守るべきでなく、ヒトの命のバランスを守る…（記述）", "条件：「ヒトの命」「ヒトの利益」の二つの言葉を使い、本文の内容にふれながら、80〜100字で自分の考えを書く。例：生物多様性は、ヒトの利益のためだけでなく、ヒトの命を守るためにも大切だ。多様性が低下すると生態系が不安定になり、ヒトも危険にさらされるからだ。"]]}, {"t": "問四 古文（『十訓抄』）", "items": [["大意", "—", "唐の玄宗皇帝が月夜に笛を吹いていると、竜の鳴く声がしたので、笛の声は竜の声と調和して、符（まじないの札）をとどめた。術者はそれを聞いて、自分の術の効き目が失われたことを知った。"], ["(1)", "きわめたまえる", "「きはめ給へる」→「きわめたまえる」（は→わ、へ→え）。"], ["(2)", "エ", "「これ」は、前の「竜の鳴く声」を指す。（模範解答はエ）"], ["(3)", "イ", "「さとりて」＝術者は、帝の笛の声のせいで自分の術が破られたと悟った。"], ["(4)", "自分の笛が竜の声ほどの腕前を極めたと…（20字以内）", "「知り給ひけり」＝帝が悟ったこと。「自分の笛が竜の声に及ぶほど…ということ」を、20字以内でまとめる。※読み取りに自信が低い問題です。"]]}], "A6_math": [{"t": "問1 計算・方程式", "items": [["(1)", "35/8", "−7/12 ÷ (−2/15) ＝ 7/12 × 15/2 ＝ 105/24 ＝ 35/8。わり算は逆数をかけ、約分する。"], ["(2)", "−15/2", "(−3²)＝−9。−9 − 5×(−3/10) ＝ −9 ＋ 3/2 ＝ −18/2 ＋ 3/2 ＝ −15/2。（−3² は「3²の符号を変えたもの」）"], ["(3)", "6x³", "9x² × 4x²y² ÷ 6xy² ＝ 36x⁴y² ÷ 6xy² ＝ 6x³。"], ["(4)", "x²＋5x−19", "(x+2)(2x−5)＝2x²−x−10、(x−3)²＝x²−6x+9。引くと x²＋5x−19。"], ["(5)", "4√3", "√24÷√8＝√3、√27＝3√3。√3＋3√3＝4√3。"], ["(6)", "x = −0.3（−3/10）", "両辺を10倍して 5(8x+3)＝6(5x+2) → 40x+15＝30x+12 → 10x＝−3 → x＝−3/10。"], ["(7)", "x = 2±√7", "解の公式：x＝(4±√(16+12))/2 ＝ (4±2√7)/2 ＝ 2±√7。"], ["(8)", "−13", "式を整理：10x+2y−12x+4y＝−2x+6y。x＝2, y＝−3/2 を代入して −4−9＝−13。"]]}, {"t": "問2 小問集合", "items": [["(1)", "ア, イ", "4＜√6n＜5 の各辺を2乗して 16＜6n＜25。n＝3 のとき18、n＝4 のとき24 で条件に合う。ウ(36)・エ(108)・オ(144)は大きすぎる。"], ["(2)", "12個", "18の約数は 1,2,3,6,9,18。正の組が6個、負の組が6個で合計12個。"], ["(3)", "0.48", "8.0〜8.5 の度数は 25−(1+4+10+2+1)＝7。8.5秒未満は 1+4+7＝12人。12÷25＝0.48。"], ["(4)", "エ", "中心角45°は360°の 45/360＝1/8。したがって円の1/8倍。"], ["(5)", "45度", "四角形AODCに注目。∠ODC＝180°−55°＝125°。△OBDは OB＝OD の二等辺三角形で ∠BOD＝180−55×2＝70°。∠AOD＝360−150−70＝140°。四角形の内角の和360°より ∠OAC＝360−(140+125+50)＝45°。"], ["(6)", "54cm²", "BG:GD＝BE:AD＝1:3、DH:HB＝DF:AB＝1:2。五角形＝△BCD(72) − △BEG − △DFH。△BEG＝△ABE(24)×1/4＝6、△DFH＝△ADF(36)×1/3＝12。72−6−12＝54。"], ["(7)", "243cm³", "立体ACFHは、立方体から角の三角すい4つ（各 9×9÷2×9÷3＝121.5）を引いたもの：729−4×121.5＝243。"]]}, {"t": "問3 運動量（表の読み取り・連立方程式）", "items": [["(1)", "1.5エクササイズ", "普通歩行の強度は3メッツ。30分＝0.5時間なので 3×0.5＝1.5。"], ["(2)", "3x＋6y＝23", "普通歩行（強度3）がx時間、バスケットボール（強度6）がy時間。エクササイズ＝強度×時間なので 3x＋6y＝23。"], ["(3)", "普通歩行 2時間20分、バスケットボール 2時間40分", "x＋y＝5 と 3x＋6y＝23 を解く。y＝5−x を代入して 3x＋30−6x＝23 → x＝7/3（＝2時間20分）、y＝8/3（＝2時間40分）。"]]}, {"t": "問4 関数", "items": [["(1)", "(−2, −1)", "A の x座標は −2。Cは直線 x＝−2 と ②y＝−x²/4 の交点なので y＝−(4)/4＝−1。"], ["(2)", "y＝2/3 x＋1/3", "B(1, 1)、C(−2, −1)。傾き＝(1−(−1))/(1−(−2))＝2/3。B を通るので 1＝2/3＋b → b＝1/3。"], ["(3)", "16/3", "△PBC＝△ABC で BC が共通なので、AP∥BC。A(−2, 4) を通る傾き2/3の直線 y＝2/3(x+2)＋4 の y切片が P。x＝0 で y＝4/3＋4＝16/3。"]]}, {"t": "問5 円と相似", "items": [["(1)⑦", "DBE", "AEに対する円周角：∠ACE＝∠ABE（＝∠DBE）。"], ["(1)⑧", "BCD", "BEに対する円周角：∠DAE＝∠BAE＝∠BCE（＝∠BCD）。"], ["(1)⑨", "DAE", "AE∥FD より、錯角で ∠FDA＝∠DAE。"], ["(1)⑩", "DBE", "④(∠DAE＝∠DBE)と⑤より ∠FDA＝∠DBE。"], ["(1)⑪", "BED", "BCに対する円周角：∠DAF＝∠BAC＝∠BEC＝∠BED。"], ["(1)⑫", "2組の角", "⑥∠FDA＝∠DBE と ⑦∠DAF＝∠BED より「2組の角がそれぞれ等しい」。相似条件の言い方を覚えておく。"], ["(2)", "25/6 cm²", "CEは∠ACBの二等分線なのでAE＝BE＝5。ABは直径なので∠AEB＝90°、△ABEは直角二等辺三角形で面積 5×5÷2＝25/2。角の二等分線の性質で AD:DB＝AC:BC＝2:1。△EDB＝△ABE×1/3＝25/6。"]]}, {"t": "問6 ナースウォッチ（反比例）", "items": [["(1)a", "100", "表の「時間×脈拍数」は 15×60＝900 で一定。a＝900÷9＝100。"], ["(1)b", "45", "b＝900÷20＝45。"], ["(2)", "反比例", "時間と脈拍数の積が一定（900）なので「反比例」。"], ["(3)", "80回", "20回数えるものでは 20秒で60回なので積は 20×60＝1200。15秒のとき 1200÷15＝80回。"]]}], "A6_english": [{"t": "問1 対話文", "items": [["(1)", "ウ", "「あのレストランで昼食を食べるのはどう？」—「いい考えだね」。How about ～ing? で「～するのはどう」。having が続くので How about。（Why don't we は後ろが動詞の原形）"], ["(2)", "ア", "「私はスポーツが好き。（あなたは？）」—「うーん、私はあまりスポーツが好きじゃない」。How about you?（あなたはどう？）が自然。"], ["(3)", "ウ", "「私はダンスが好きではない」—「私もです（Me, either.）。なぜ友達が好きなのか理解できない」。否定文への同意は either（too は肯定文）。"]]}, {"t": "問2 語を書く（頭文字つき）", "items": [["(1)", "dictionary", "「私たちは言葉の意味を知るために（辞書）を使う」。"], ["(2)", "September", "「（9月）は1年の9番目の月」。"], ["(3)", "famous", "「だれもが彼を知っている。彼は（有名な）科学者です」。"], ["(4)", "hungry", "「私はとても（おなかがすいて）います」—「私も！ あのハンバーガー店で昼食にしよう」。"]]}, {"t": "問3 適語選択", "items": [["(1)", "ア", "主語が Mike and his brother（複数）で現在の習慣なので get。「毎朝6時30分に起きる」。"], ["(2)", "ウ", "「ふだんアンドリューを（何と）呼びますか」—「アンディと呼びます」。call A B の B をたずねるので What。"], ["(3)", "エ", "「消しゴムを貸してくれませんか」—（もちろん）。続く「はい、どうぞ」とつながるのは Sure。"], ["(4)", "ウ", "be good at ～「～が得意」。「数学は私が得意ではない教科です」。"], ["(5)", "ウ", "While I was in the United States,「アメリカにいる間に」。後ろに主語＋動詞が続くので接続詞 While。（During は後ろが名詞）"]]}, {"t": "問4 書きかえ", "items": [["(1)", "teaches us", "「スミス先生は私たちの英語の先生です」＝ Mr. Smith teaches us English.（teach 人 物）"], ["(2)", "Because, met", "「なぜケンは公園に行ったの？」—「旧友に会うために」＝「Because he met his old friend.」（旧友に会ったから）"], ["(3)", "made, me", "「私はその映画を見てわくわくした」＝ The movie made me excited.（〜が私を…にした）"], ["(4)", "Do, waste", "「時間をむだにしてはいけない」＝ Do not waste your time.（must not ＝ Do not）"]]}, {"t": "問5 並べかえ（3番目と5番目の記号）", "items": [["(1)", "3番目：カ　5番目：ウ", "I want those poor children to live a happy life.（want 人 to ～）→ キ イ カ エ ウ ア オ。"], ["(2)", "3番目：ウ　5番目：キ", "We don't know how old Mr. Mori is.（間接疑問文：how old ＋ 主語 ＋ be動詞）→ カ オ ウ イ キ エ ア。"], ["(3)", "3番目：ウ　5番目：エ", "You will be able to ride a unicycle soon.（will be able to ＝ できるようになるだろう）→ オ キ ウ イ エ ア カ。"], ["(4)", "3番目：ア　5番目：キ", "Have you ever been to foreign countries?（経験をたずねる現在完了）→ オ エ ア ウ キ イ カ。"], ["(5)", "3番目：カ　5番目：ウ", "All of them know that I am from Hokkaido.（all of them 彼らはみな）→ キ エ カ ア ウ イ オ。"], ["(6)", "3番目：キ　5番目：イ", "The chorus contest was held at this concert hall last year.（受け身）→ ウ オ キ エ イ ア カ。"]]}, {"t": "問6 対話文：サヤカと先生の将来の夢", "items": [["(1)①", "ウ", "空所は「あなたの夢が（　）ことを願っています」。サヤカは「アニメ制作に関わる仕事をする夢がある」と話しているので、ウ「your dream will come true（夢がかなう）」。"], ["(1)②", "ア", "空所は「もちろんそれらの職業がすばらしいことは分かります。でも（　）」。サヤカは自分の夢（アニメーター）を持っているので、ア「I'm not interested in them at all（それらにはまったく興味がない）」。"], ["(2)", "エ", "Chart A の1・2・3・5位は Chart B にもある職業。4位だけは Chart B にない職業なので、選択肢で Chart B にないエ「Actor or singer」。（Teacher・Doctor・Nurse は Chart B にある）"], ["(3)(a)", "イ", "先生の説明「Parents usually want their children to be always happy.」（親は子供が常に幸せであってほしい）。サヤカの夢は安定していないので、「生活が大変かもしれないから」。"], ["(3)(b)", "ウ", "先生の発言「I found an article about that on an online news site this morning.」→ On the Internet。"], ["(4)", "エ", "「Many of them often come to Japan and travel all over. anime is important economically.」→ 日本のファンは日本に来て、お金を使う＝Lots of money。"], ["(5)", "イ", "サヤカは「好きなことを将来の仕事に生かしたい（I want to use my ability for my favorite thing）」。先生も最後に「アニメーターになる夢を誇りに」と励ましている。アは completely agrees が誤り、ウ「ずっと重要な貿易品だった」は本文は「今日」の話、エは「安定した仕事だと確信している」が誤り。"]]}, {"t": "問7 メール文：オーストラリアからの生徒の来校", "items": [["(1)①", "イ", "「祭りで日本舞踊や金魚すくいなどを体験できる。それらの活動は日本の文化を学ぶのに役立つ。きっと（　）」。ここまでの流れから、イ「they'll have a very good time（きっと楽しい時間を過ごすだろう）」。"], ["(1)②", "イ", "「9月20日…午後は通りが混んでいる。また長旅のあとなので（　）」。イ「the students must be tired（生徒たちは疲れているにちがいない）」。休憩（short break）をとる提案につながる。"], ["(2)(a)", "ア", "「Next day, at English class, they will make a speech to tell us how they spend at their school.」→ 学校生活についてスピーチ。"], ["(2)(b)", "イ", "ナンシーのクイズ大会の提案：「オーストラリアの生徒と日本の生徒がたがいにクイズを出し合う」＝たくさん話し合えるように。"], ["(3)", "エ", "「飛行場から桜駅へは電車、桜駅から緑駅へも電車、緑駅から学校へバス」と本文。→ エ。"], ["(4)", "ウ, カ", "ウ：ナンシーは回復してきているが、「来週は学校に行ける」ので明日はまだ行けない。エ・オは本文に合わない。カ：「通りが午後は混んでいる」と書いている。"]]}, {"t": "問8 英作文", "items": [["(1)", "He has been making a cake for three hours.", "「3時間ずっと作っている」＝現在完了進行形 has been ～ing ＋ for three hours。数字もアルファベットで three と書く。"]]}], "A6_science": [{"t": "問1 地学", "items": [["Ⅰ(1)", "ウ", "気温は地上1.2〜1.5mの高さで、温度計の球部に直射日光を当てないようにしてはかる（風通しのよい日かげ）。"], ["Ⅰ(2)", "天気：くもり（◎）、風向：南南西、風力：3", "天気図記号は、くもり＝◎。矢ばねは風が吹いてくる向き（南南西）にのばし、羽根の数が風力（3本）。"], ["Ⅰ(3)あ", "ウ", "18時から21時に、雨が降り、気温が24.3℃→18.7℃と下がり、風向が南から北に変わっている。"], ["Ⅰ(3)い", "寒冷前線", "短時間の強い雨、気温の急降下、風向の急変（南→北）は寒冷前線が通過した特徴。"], ["Ⅰ(4)", "ア", "水蒸気量＝飽和水蒸気量×湿度。3時：23.4℃、62%。9時：23.4℃、70%。15時：25.9℃、62%。3時は9時より湿度が低く、15時より気温が低い（飽和水蒸気量が小さい）ので最も少ない。"], ["Ⅰ(5)", "80g", "6時：23.0℃、湿度68%の空気1m³には 20.6×0.68＝14.0g の水蒸気。20m³で 280g。11.0℃では飽和水蒸気量10.0g/m³×20＝200g まで。280−200＝80g が水になる。"], ["Ⅱ(1)X", "斑状組織", "大きな鉱物（斑晶）が細かい粒（石基）の中に散らばる。火山岩のつくり。"], ["Ⅱ(1)Y", "等粒状組織", "大きさのそろった鉱物が組み合わさっている。深成岩のつくり。"], ["Ⅱ(2)あ", "B", "火山岩X：斑晶＋細かい粒＝氷水で急に冷やしたペトリ皿B（小さな結晶が散らばる）に似ている。"], ["Ⅱ(2)い", "A", "深成岩Y：同じ大きさの大きな結晶＝約80℃の湯でゆっくり冷やしたペトリ皿Aに似ている。"], ["Ⅱ(2)う", "火山岩", "Xのつくり（斑状組織）の岩石＝火山岩（マグマが地表付近で急に冷える）。"], ["Ⅱ(2)え", "深成岩", "Yのつくり（等粒状組織）の岩石＝深成岩（マグマが地下深くでゆっくり冷える）。"], ["Ⅱ(3)", "ア", "観察より、Xは無色鉱物が多い（SiO₂が多い）ので、マグマのねばりけが強い。Yは有色鉱物が多く、ねばりけが弱い。"]]}, {"t": "問2 化学（電池・酸化と還元）", "items": [["Ⅰ(1)", "190g", "5%水溶液200g の溶質は 200×0.05＝10g。溶媒（水）は 200−10＝190g。"], ["Ⅰ(2)陽", "Zn²⁺", "硫酸亜鉛 ZnSO₄ → Zn²⁺ ＋ SO₄²⁻。"], ["Ⅰ(2)陰", "SO₄²⁻", "硫酸イオン。"], ["Ⅰ(3)ふえる", "亜鉛イオン", "亜鉛板が Zn → Zn²⁺ ＋ 2e⁻ で溶け出すので、亜鉛イオンがふえる。"], ["Ⅰ(3)減る", "銅イオン", "銅板では Cu²⁺ ＋ 2e⁻ → Cu で銅が析出するので、銅イオンが減る（青色がうすくなる）。"], ["Ⅰ(4)", "エ", "亜鉛板が−極、銅板が＋極。電子は−極（亜鉛板）から導線を通って＋極（銅板）へ移動する。"], ["Ⅰ(5)あ", "化学", "電池は化学エネルギーを電気エネルギーに変える装置。"], ["Ⅰ(5)い", "電気", "同上。"], ["Ⅱ(1)", "2Cu ＋ O₂ → 2CuO", "銅が酸素と結びついて酸化銅（黒色）ができる。"], ["Ⅱ(2)", "4：5", "銅0.12g から酸化物0.15g。0.12：0.15＝4：5。（酸素は 0.03g で、銅：酸素＝4：1）"], ["Ⅱ(3)", "1.22g", "増えた質量2.07−1.90＝0.17g が結びついた酸素。銅：酸素＝4：1 なので、反応した銅は 0.17×4＝0.68g。未反応の銅は 1.90−0.68＝1.22g。"], ["Ⅱ(4)あ", "水", "酸化銅＋水素 → 銅＋水。試験管の内側の細かい液体の粒は水。"], ["Ⅱ(4)い", "還元", "酸化物が酸素をうばわれる化学変化は「還元」。"]]}, {"t": "問3 生物", "items": [["Ⅰ(1)あ", "変わらない", "D・E・F（オオカナダモなし）は、オオカナダモがない条件で BTB溶液の色が「変わらない」ことを確認する。"], ["Ⅰ(1)い", "対照実験", "調べようとすること以外の条件を同じにして行う実験。"], ["Ⅰ(2)", "酸素", "光合成で出る気体は酸素。"], ["Ⅰ(3)か", "アルカリ", "BTB溶液：青色＝アルカリ性、緑色＝中性、黄色＝酸性。"], ["Ⅰ(3)き", "中", "緑色は中性。"], ["Ⅰ(3)く", "酸", "黄色は酸性。"], ["Ⅰ(3)け", "二酸化炭素", "息にふくまれる二酸化炭素が水にとけると酸性になる。Aは青色（アルカリ性）→二酸化炭素が減った（光合成で吸収）。Cは黄色（酸性）→二酸化炭素が増えた（呼吸のみ）。"], ["Ⅰ(4)", "ウ", "Bは光が弱くて緑色＝二酸化炭素の量が変わらない（呼吸＝光合成）。光が弱いと光合成の量が少ないため、二酸化炭素の吸収量が減少する。"], ["Ⅱ(1)あ", "セキツイ動物", "背骨のある動物のなかま。"], ["Ⅱ(1)い", "卵", "雌がつくる生殖細胞は卵。"], ["Ⅱ(1)う", "精子", "雄がつくる生殖細胞は精子。"], ["Ⅱ(2)か", "胎生", "母親の体内である程度育ってから生まれる。"], ["Ⅱ(2)き", "卵生", "卵を産む。"], ["Ⅱ(3)", "イ", "サンショウウオは両生類。幼生はえらと皮膚、成体は肺と皮膚で呼吸する。"]]}, {"t": "問4 物理（光・浮力）", "items": [["Ⅰ(1)", "屈折", "光が異なる物質の境界で曲がる現象。"], ["Ⅰ(2)", "実像", "スクリーン上にうつる像は「実像」。"], ["Ⅰ(3)", "ウ", "凸レンズの実像は上下左右が逆。スクリーン上の像を光源側（レンズ側）から見ると、もとのF字を180°回転した形になる。"], ["Ⅰ(4)あ", "2", "光源が焦点距離6.0cmの2倍（12.0cm）のとき、像の距離も12.0cmで、実物と同じ大きさの像ができる。"], ["Ⅰ(4)い", "遠い", "焦点距離の2倍より遠いとき（実験：14.0〜18.0cm）、実物より小さい像ができる。"], ["Ⅰ(4)う", "近い", "焦点距離の2倍より近い（焦点距離より遠い）とき（10.0〜8.0cm）、実物より大きい像ができる。"], ["Ⅰ(5)①", "イ", "焦点距離12.0cm、光源までの距離20.0cm。レンズの式 1/20＋1/b＝1/12 → b＝30cm。24.0cmより長くなる。（2f＝24cm より物体が近いので像の距離は2fより遠い）"], ["Ⅰ(5)②", "イ", "像の倍率＝30÷20＝1.5倍で、実物より大きくなる。"], ["Ⅱ(1)", "弾性力", "変形したばねがもとにもどろうとする力。"], ["Ⅱ(2)", "エ", "物体Aには下向きの重力と、上向きの浮力・ばねの力がはたらく。重力と浮力の合力が、ばねの力とつり合っている（浮力はばねの力とは別に上向き）。"], ["Ⅱ(3)", "グラフ", "浮力＝3.30−ばねばかりの値。0, 0.25, 0.50, 0.75, 1.00, 1.25 N の点を原点から結ぶ（水面からの距離が5.0cmまで、比例して増加）。"], ["Ⅱ(4)", "400Pa", "4.0cmのときの水圧は、浮力1.00N が下面（25.0cm²＝0.0025m²）にはたらくので 1.00÷0.0025＝400Pa。"], ["Ⅱ(5)", "ア", "浮力が物体の重さに関係しないことを確かめるには、体積は同じで重さ（密度）だけがちがう物体を使う。"]]}], "A6_social": [{"t": "問1 世界地理", "items": [["(1)", "グレートバリアリーフ", "オーストラリア（A）の北東部沿岸にある世界最大のさんご礁地帯。"], ["(2)", "AU（アフリカ連合）", "地図2はアフリカ大陸。2002年に53の国と地域が地域統合を目指して結成したのは「AU（アフリカ連合）」。※手書き解答は「ASEAN」と読め、これは東南アジアの組織なので誤りです。"], ["(3)フィリピン", "ア", "バナナ・木製建具・プラスチック製品。フィリピンは日本へバナナを多く輸出している。"], ["(3)マレーシア", "ウ", "機械類・液化天然ガス・衣類・石油製品。マレーシアは液化天然ガス（LNG）の輸出が多い。"], ["(4)①B", "ベネズエラ", "南アメリカで唯一のOPEC加盟国。原油の産出が盛ん。"], ["(4)①b", "モノカルチャー", "特定の1つの産物（原油）に経済が依存する経済のこと。"], ["(4)②", "27時間", "成田出発：日本時間1月19日20:00。サンパウロの標準時は西経45度＝UTC−3、日本はUTC＋9で時差12時間。サンパウロ現地1月20日11:00は日本時間では1月20日23:00。20:00→翌日23:00＝27時間。"], ["(5)", "ア, ウ", "EUではパスポート不要（ア）、資格の相互承認（ウ）。イ：ユーロは一部の加盟国のみ導入。エ：加盟国間は関税がかからない。※手書き解答は「ア」だけでした（正解は2つ選ぶ問題なので原本を確認してください）。"], ["(6)", "イ", "誤りはイ。アメリカの近代工業は「五大湖周辺」で、鉱産資源（メサビ鉄山・アパラチア炭田）と水上交通をもとに発達した（メキシコ湾岸は石油）。※手書き解答欄の読み取りに自信が低い問題です。"], ["(7)", "ア", "南アメリカ州の国＝ブラジル。在留邦人が最も多い（47472人、日系人が多い）ア。イ＝ロシア、ウ＝南アフリカ、エ＝中国。"]]}, {"t": "問2 日本地理", "items": [["(1)①", "2", "長野県と接する8県のうち関東地方の県は、群馬県・埼玉県の2つ。"], ["(1)②", "ア", "2万5千分の1で4cm → 4×25000＝100000cm＝1000m。"], ["(1)③", "150m", "地形図の等高線から、A地点とB地点の標高差を読む。（図の標高A≒2050m、B≒1900m）"], ["(1)④", "エ", "◯は広葉樹林、∧は針葉樹林の地図記号。（果樹園は「◯の中に点」、竹林は「川」）"], ["(1)⑤", "イ", "5万分の1で1辺4cm → 実際は 2km。面積は 2×2＝4km²（X＝4）。縮尺が小さくなるので、より広い範囲を調べるのに適する（Y＝広い）。"], ["(2)①A", "韓国", "竹島は日本固有の領土だが、韓国が不法に占拠している。"], ["(2)①B", "島根", "竹島は島根県に属する。"], ["(2)②", "イ", "ⓘの地域（内陸）は、夏と冬の両方とも降水量が比較的少なく、晴れの日が多い（中央高地の気候）。アは日本海側のため親潮は誤り、ウは冬の北西の季節風は日本海側で降雪が多いが太平洋側のえでは少ない。"], ["(2)③", "一戸当たりの飼育頭数は大幅に増加した。", "飼育頭数÷飼育戸数：1974年 約3.2頭 → 1994年 約11.7頭 → 2022年 約50.4頭。飼育戸数が減る一方で、1戸あたりの規模が大きくなった。"], ["(2)④ⓐ", "オ", "ⓐは宮城県：雄勝すずり。"], ["(2)④ⓑ", "ウ", "ⓑは福島県：会津塗。（ア津軽塗＝青森、イ天童将棋駒＝山形、エ南部鉄器＝岩手）"]]}, {"t": "問3 中世の歴史", "items": [["(1)", "守護大名", "室町幕府の管領には、細川氏や畠山氏などの有力な守護大名が交代で就いた。"], ["(2)①", "書院造", "室町時代の部屋のつくり（畳・ふすま・床の間・違い棚）。"], ["(2)②", "エ", "水墨画を大成したのは雪舟。"], ["(3)", "ウ", "元寇（13世紀後半）のころ、マルコ・ポーロが中国（元）を訪れた。アは11世紀末、イは10世紀、エは15世紀。"], ["(4)①", "新古今和歌集", "後鳥羽上皇が藤原定家らに作らせた和歌集。"], ["(4)②", "承久の乱、ウ", "後鳥羽上皇が幕府に対して兵を挙げた承久の乱（1221年）。隠岐は島根県の沖で、地図の「ウ」。"], ["(5)", "エ, カ", "エ：平清盛が貿易をしたのは「明」ではなく「宋」。カ：定期市は月6回ではなく、鎌倉時代は月3回（三斎市）が一般的だった。"], ["(6)", "2番目：ウ　4番目：ア", "カード4（平清盛 12世紀）→ カード3（承久の乱 1221年）→ カード2（元寇 1274・1281年）→ カード1（室町幕府 14世紀）。"]]}, {"t": "問4 近現代の歴史", "items": [["(1)", "(ⅰ) 平民　(ⅱ) 華族", "明治の新しい身分制度では、農民・町人→平民、公家・大名→華族、武士→士族。"], ["(2)", "貴族院", "帝国議会は衆議院と貴族院の二院制。"], ["(3)Y", "ウ, エ", "下関条約（日清戦争）：賠償金（約3億1千万円）、台湾・澎湖諸島、遼東半島。"], ["(3)Z", "ア, イ, オ", "ポーツマス条約（日露戦争）：樺太の南半分、南満州鉄道の利権、旅順・大連の租借権。賠償金は得られなかった。"], ["(4)①", "ファシスト", "イタリアではムッソリーニ率いるファシスト党が独裁を行った。"], ["(4)②", "ウ（エチオピア）", "イタリアは1935年にエチオピアに侵攻し、1936年に併合した。"], ["(5)", "ウ", "満州事変（1931年）は、関東軍が南満州鉄道の線路を爆破（柳条湖事件）して軍事行動を始めたもの。アは張作霖爆殺事件、イは盧溝橋事件（日中戦争）、エは太平洋戦争の開始。"], ["(6)", "石油の輸出を禁止した", "日本軍の南部仏印進駐に対し、アメリカは日本への石油の輸出を禁止した（資料で日本の石油輸入はアメリカに依存していたことが分かる）。"], ["(7)", "ウ → エ → ア → イ", "日露和親条約（1855）→ 樺太・千島交換条約（1875）→ ポーツマス条約（1905）→ サンフランシスコ平和条約（1951）。"], ["(8)", "ウ", "2001年の同時多発テロの後、アメリカやイギリスが空爆を開始したのはアフガニスタン。地図の「ウ」。"]]}, {"t": "問5 公民", "items": [["(1)①", "ア", "壁を斜めにしないと、まわりの住宅への日当たりをさまたげてしまうため。"], ["(1)②", "日照権", "新しい人権の環境権に含まれる権利。"], ["(2)", "A党1、B党1、C党3、D党1", "ドント式：各党の得票を1,2,3…でわり、商の大きい順に6議席。C：99, 49.5, 33、B：63、A：54、D：39 → 上位6つ（99, 63, 54, 49.5, 39, 33）。"], ["(3)", "エ", "誤り。内閣が定めた規則（政令）が憲法に違反しているかを判断して無効にするのは、国会ではなく裁判所（違憲審査権）。"], ["(4)", "イ", "国土交通省の外局に気象庁がある。（外務省−なし、防衛省−防衛装備庁、財務省−国税庁）"], ["(5)", "ア", "株式を買った人は株主として、株主総会に出席して議決に参加できる。"], ["(6)", "イ, ウ", "客が好きなレジに並ぶ従来の方法では、後から来た客が先に会計できる（イ）、レジによって店員の作業量に差ができる（ウ）という不公正があった。"], ["(7)", "ア, エ", "アは資料1のとおり歳出＞税収。エは国債残高が増え続けることの問題点として正しい。イは増減が一致しない、ウは公債金の割合は年によって上下している、オは減らすには逆に税収をふやす必要がある。"]]}], "A6_japanese": [{"t": "問一 漢字", "items": [["(1)①", "さくげん", "削減。"], ["(1)②", "げきれい", "激励。"], ["(1)③", "つくろ（う）", "繕う。"], ["(1)④", "たずさ（わる）", "携わる。"], ["(1)⑤", "ようしゃ", "容赦（「容赦ない」＝手加減しない）。"], ["(2)①", "ウ", "「トクサク」＝得策。ウ「サクリャクを練る」＝策略。"], ["(2)②", "エ", "「サイフ」＝財布。エ「法律をコウフする」＝公布（「布」）。"], ["(2)③", "イ", "「ワザワイ」＝災い。イ「自然サイガイ」＝災害。"], ["(2)④", "イ", "「ソウサ」＝操作。イ「タイソウの選手」＝体操（「操」）。"], ["(2)⑤", "ウ", "「ツドい」＝集い。ウ「ボシュウ」＝募集（「集」）。"]]}, {"t": "問二 小説（谷瑞恵『神さまのいうとおり』より）", "items": [["あらすじ", "—", "武は、いなくなった猫「ゴン」を探していて、神社の石段で転校生の拓也（フォトブックを持つ写真部）と出会う。武の名前をおぼえていない拓也が、ふつうに接してくれることに戸惑う。拓也の家で自転車を直してもらい、父親にも親切にされる。武は自分の父親とは全然違うと感じ、ゴンを探す気持ちも薄れて帰る。"], ["(1)", "b", "動詞の活用の種類：a「続く」（五段）、b「消える」（下一段）、c「持って／荷って」、d「回り込む」（五段）。bだけ種類が違う。"], ["(2)", "エ", "「武の名前をおぼえていない」ことに「目立っているはずなのに」「武だって転校生の名前をおぼえていないのに」と腹を立てている。自分が常に中心にいるのが当然だと考える人物。"], ["(3)", "イ", "武は猫を「ゴン」と呼ぶ。その猫は茶色で耳が大きく、「ごん狐」という物語に出てくる狐のようだから、その猫が「狐に似ているから」。"], ["(4)", "ア", "「わかっていて、そんな無茶を言いつけたくなる」…武は、自分の評判が学校で知れ渡っていて、周囲に近寄る生徒もいないことを自覚している。友達とも言えないような人間関係に嫌気がさしている心情。"], ["(5)", "何なんだ、", "転校生の言動に戸惑っているのがわかる連続した二文は「何なんだ、こいつは。想像していない展開に、武はどうしていいかわからなくなった。」初めの五字は「何なんだ、」（読点も1字）。"], ["(6)i", "ごくふつうのクラスメイトに接する態度", "武の評判を知っているはずなのに、拓也は武を特別視せず、ふつうのクラスメイトとして接している（18字）。"], ["(6)ii", "ウ", "武の父親は市議会議員だが、「人前で怒鳴り散らしたり、えらそうにしたりしない」穏やかな人。武は「うちの親父とは全然違う」と感じている。※ア〜エの選び方に自信が低い問題です。"], ["(7)", "例：見つけたとしても、ゴンを飼えないことはわかっていたし、特に親しいわけでもない転校生親子に優しくされたことで、意地を張る気持ちが薄れてしまったから。", "「ゴンを飼えない」（見つけても飼えない）と「意地を張る気持ち」（拓也に張っていた意地）の両方を入れ、60〜75字にまとめる。"]]}, {"t": "問三 論説（藤原智美『スマホ断食』より）", "items": [["要旨", "—", "現代人は、話し言葉・書き言葉に加え、ネットのデジタル情報に依存するようになった。ネットではフィルターバブルによって、自分の興味のある情報しか見えなくなり（知的孤立）、確証バイアスも加わって、フェイクを信じやすくなる。紙に書かれた言葉を読み、自分で考える習慣が必要。"], ["(1)", "エ", "A：「すぐさま全国民に行き渡る」。B：「何を見ているか
