というと、いうまでもなくスマホです」。"], ["(2)①", "デジタル情報", "ネットの世界では言葉の使い勝手が豊かになり、人々は話し言葉・書き言葉以上にネットの「デジタル情報」に（本文中から抜き出し）。"], ["(2)②", "依存するように", "本文：「日常的にやりとりされる『話し言葉』以上に、依存するようになってきています」。"], ["(3)", "テレビ、新聞からの情報が全国民に行き渡らなくなったから。", "緊急事態宣言が出たのを知らない人が多かったのは、「テレビや新聞」の情報が全国民に届かなくなった（若い世代のテレビ離れ）ため。30字以内。"], ["(4)", "ア", "偽の情報に惑わされやすいのは、フィルターバブルで「あらかじめ選別された情報」だけが届き、その上、自分が受け入れたいものだけを集めて他を閉め出してしまう（確証バイアス）から。"], ["(5)", "ウ", "「知的孤立」＝フィルターバブルの中で、狭い範囲の情報しか得ようとしない状態。"], ["(6)", "読むという思考活動を通った上での判断", "「信じたいか／信じたくないか」という感覚的な判断に対し、本文中の「読むという思考活動を通った上での判断」が対比されている（18字）。"], ["(7)", "例：私はスマホを利用するときは、本当に正しい情報なのか、注意して見たい。スマホで得られる情報は狭い範囲の限られたものだから、時々は紙に書かれた情報にもふれて知識がかたよらないようにしたい。", "条件：本文の内容にふれ、「狭い範囲」「紙に書かれた」の二つの言葉を使い、80〜100字で書く。"]]}, {"t": "問四 古文（『沙石集』）", "items": [["大意", "—", "賢人の許由は、帝から大臣になるようにと命令（宣旨）を受けたが、それを聞いて川（穎川）で耳を洗った。そこへ巣父が牛に水を飲ませにやってきて、事情を聞くと「汚れた水は牛に飲ませられない」と牛を引いて帰った。"], ["(1)", "きょゆうといいし", "「許由と云ひし」→ 歴史的仮名遣いを現代仮名遣いに直す：「ゆう」「いい」。"], ["(2)", "耳が汚れたと思ったから。", "帝の宣旨（大臣になれという命令）を聞いて「耳が汚れて覚えつれば」と言っている（15字以内）。"], ["(3)", "イ", "巣父は、許由が汚した川の水を牛に飲ませられないと思って、牛を引いて帰った。"], ["(4)", "ウ", "「許由巣父」は、栄え貴ばれる地位につくのをいやがる（名誉や地位を求めない）ことのたとえ。"]]}], "A7_math": [{"t": "問1 計算・方程式", "items": [["(1)", "−11/4", "11/6 × (−3/2) ＝ −33/12 ＝ −11/4。"], ["(2)", "5", "1−2²＝1−4＝−3。(−15)÷(−3)＝5。"], ["(3)", "−3a", "−2a² ÷ (4/3 ab) × 2b ＝ −2a² × 3/(4ab) × 2b ＝ −12a²b/(4ab) ＝ −3a。"], ["(4)", "x²−3x＋2", "2(x²−2x＋1)−(x²−x)＝2x²−4x＋2−x²＋x＝x²−3x＋2。"], ["(5)", "2√3", "√48＝4√3、√72÷√6＝√12＝2√3。4√3−2√3＝2√3。"], ["(6)", "x = 25", "両辺を10倍して 5(x＋3)＝2(3x−5) → 5x＋15＝6x−10 → x＝25。"], ["(7)", "x = −3, y = 2", "上の式を2倍：2x＋5y＝4。下の式を6倍：4x−3y＝−18。上を2倍して引くと 13y＝26 → y＝2、x＝−3。"], ["(8)", "エ", "S＝1/2 ℓr の両辺に 2 をかけて 2S＝ℓr、r でわって ℓ＝2S/r。"]]}, {"t": "問2 小問集合", "items": [["(1)", "4√6", "a³＝6√6、12/a＝12/√6＝2√6。6√6−2√6＝4√6。"], ["(2)", "7/18", "a÷b が整数になる (a, b)：b＝1 → 6通り、b＝2 → 3通り(2,4,6)、b＝3 → 2通り(3,6)、b＝4,5,6 → 各1通り。合計 14通り。14/36＝7/18。"], ["(3)", "イ", "軽井沢町の中央値は約15.8℃で、16℃を下回る日は半数以上。アは平均でなく中央値の比較ではわからない、ウ27℃を上回る日は軽井沢町にはない、エは四分位範囲は松本市のほうが大きい。"], ["(4)", "23度", "正三角形の1つの角は60°。平行線の錯角より 37°＋∠x＝60° → ∠x＝23°。"], ["(5)", "96cm³", "立面図は底辺6cmの二等辺三角形で面積24cm²なので、高さは 24×2÷6＝8cm。体積＝1/3×6×6×8＝96cm³。※手書き解答は「12√55」となっていますが、立面図の面積が24cm²ならば高さは8cmです（12√55 は側面の三角形の面積が24のときの値）。"], ["(6)", "ウ", "展開図を組み立てて直方体をつくると、AB と CD は直方体の平行な面上の、平行な対角線になる。（手書き解答に従う）"], ["(7)", "9/2π−9 cm²", "半円の面積＝1/2×π×3²＝9π/2。△ABC は直角二等辺三角形で AC＝BC＝3√2、面積＝1/2×3√2×3√2＝9。色をつけた部分の面積＝9π/2−9 cm²。（手書き解答に従う）"]]}, {"t": "問3 窓口と行列", "items": [["(1)", "15分間で入館した人数", "1つの窓口から1分間に y人入館するので、15y＝15分間に入館した人数。（20人の行列＋15分間に増えた15x人−入館した15y人＝50人）"], ["(2)", "イ", "9時15分から10時5分までの50分間で、行列は 50＋50x（増える）−2つの窓口の入館 2×50y＝50＋50x−100y が0になる。"], ["(3)", "増える人数 5人、入館できる人数 3人", "①より 15x−15y＝30 → x−y＝2。②より 50x−100y＝−50 → x−2y＝−1。引くと y＝3、x＝5。"]]}, {"t": "問4 関数", "items": [["(1)", "a＝1/2", "②y＝−x＋12 で x＝−6 のとき y＝18、A(−6, 18)。①y＝ax² に代入して 18＝36a → a＝1/2。"], ["(2)", "D(−8, 12)", "B(4, 8)、C(2, 2)（C は①上の x＝2：y＝1/2×4＝2）。平行四辺形では D＝A＋C−B ＝ (−6＋2−4, 18＋2−8)＝(−8, 12)。"], ["(3)", "y＝−7x−4", "直線BC：傾き (8−2)/(4−2)＝3、y＝3x−4。E(0, −4)。平行四辺形の面積を2等分する直線は対角線の交点（ACの中点）を通る。ACの中点は (−2, 10)。E(0, −4) と結ぶと、傾き (10＋4)/(−2)＝−7 → y＝−7x−4。"]]}, {"t": "問5 円と相似", "items": [["(1)⑦", "FCA", "ADに対する円周角：∠ABD＝∠ACD（＝∠FCA）。"], ["(1)⑧", "CAB", "CBに対する円周角：∠BDC＝∠CAB。"], ["(1)⑨", "錯角", "AB∥DE より、平行線の錯角は等しいので ∠BAE＝∠AED。"], ["(1)⑩", "ADC", "AC＝AD の二等辺三角形の底角：∠ACD＝∠ADC。"], ["(1)⑪", "CAF", "②③④⑤より ∠BDA＝∠BDC＋∠ADC＝∠CAB＋∠BAE＝∠CAF。"], ["(1)⑫", "2組の角", "①∠ABD＝∠FCA と⑥∠BDA＝∠CAF より、「2組の角がそれぞれ等しい」。"], ["(2)", "54cm²", "AB は直径なので ∠ADB＝90°。△ABD で AD＝AC＝12、BD＝16 より AB＝20。△ABD∽△FCA で AB:FC＝BD:CA＝AD:FA → FC＝15、FA＝12×12/16＝9。∠CAF＝∠BDA＝90° なので △CAF＝1/2×12×9＝54cm²。"]]}, {"t": "問6 タイルの規則性", "items": [["(1)", "41枚", "1, 5, 13, 25, … 増え方が 4, 8, 12, 16 → 5番目は 25＋16＝41枚。"], ["(2)a", "36cm", "周りの長さ 4, 12, 20, … は8ずつ増える。5番目は 4＋8×4＝36cm。"], ["(2)b", "8n−4（＝4＋8(n−1)）", "初項4、公差8の数列なので 4＋8(n−1)＝8n−4。※手書きは「12＋8(n−1)」で、これは誤りですが「8n−4でもマル」と書き足されていました。"], ["(3)", "8番目、113枚", "8n−4＝60 より n＝8。タイルの枚数は 1, 5, 13, 25, 41, 61, 85, 113 → 113枚。（枚数＝2n²−2n＋1）"]]}], "A7_english": [{"t": "問1 対話文", "items": [["(1)", "エ", "「（なんてかわいい）Tシャツ！ どこで買ったの？」— What a cute T-shirt! の感嘆文。"], ["(2)", "ウ", "「私はそのバンドのファンです。」—「（あなたも）そうなの？ 私もです」。Are you?（あなたもそう？）。"], ["(3)", "エ", "「水族館への道を教えてください」—「いいですよ。あの緑のバスに乗ってください」。道案内の答えになるのはエ。"]]}, {"t": "問2 語を書く（頭文字つき）", "items": [["(1)", "month", "8月は1年の8番目の「月」。"], ["(2)", "cousin", "父の兄弟の息子＝いとこ。"], ["(3)", "subject", "「科学は好き？」— 「うん！ 私の好きな教科（favorite subject）だよ」。"], ["(4)", "front", "郵便局の「前」に家がある（in front of ～）。"]]}, {"t": "問3 適語選択", "items": [["(1)", "エ", "It has been raining since last night.（昨夜からずっと降っている）現在完了進行形。"], ["(2)", "ウ", "「ギターが上手にひける女の子」＝先行詞が人で主語の働きをする関係代名詞 who。"], ["(3)", "エ", "swim the fastest in his class（クラスで最も速く泳げる）。the があるので最上級。"], ["(4)", "ウ", "He finished doing his homework.（finish ～ing）。"], ["(5)", "ア", "take care of ～「～の世話をする」。"]]}, {"t": "問4 書きかえ", "items": [["(1)", "has, nothing", "「ケンは今日の午後することが何もない」＝Ken has nothing to do this afternoon."], ["(2)", "are, going", "「彼らは来週の日曜日にバスケットボールの練習をするつもり」＝They are going to practice basketball next Sunday."], ["(3)", "of, mine", "「ミホは私の友達の1人」＝Miho is a friend of mine."], ["(4)", "is, known", "「この学校のみんなはその生徒を知っている」→ 受け身：The student is known to everybody in this school."]]}, {"t": "問5 並べかえ（3番目と5番目の記号）", "items": [["(1)", "3番目：イ　5番目：オ", "She gave me a nice birthday present. → ウ キ イ エ オ ア カ。"], ["(2)", "3番目：ウ　5番目：エ", "He was so sleepy that he went to bed right away.（so ～ that …）→ オ カ ウ イ エ キ ア。"], ["(3)", "3番目：ア　5番目：エ", "Have you ever been to foreign countries?（経験）→ カ ウ ア キ エ オ イ。"], ["(4)", "3番目：イ　5番目：ウ", "The boy they are talking about may be Jack.（後置修飾）→ キ エ イ カ ウ オ ア。"], ["(5)", "3番目：イ　5番目：ウ", "Come to my house if you are free. → エ キ イ オ ウ カ ア。"], ["(6)", "3番目：カ　5番目：エ", "Is this your first time to visit Hokkaido? → オ ウ カ イ エ キ ア。"]]}, {"t": "問6 会話文：佐渡金山と観光公害", "items": [["(1)①", "ウ", "空所は「その場所が世界遺産になると、（　）。そのとき、町はもっと人気になりお金がもうかるかも」。ウ「many visitors will come（たくさんの観光客が来る）」。"], ["(1)③", "ウ", "「ヨーロッパで人気の場所の入場料は、地元の人の料金とずいぶん違った。（　）」。マミの返事「高額なので訪れるのをあきらめる外国人もいる」から、ウ「It was so expensive.」。"], ["(2)", "エ", "overtourism（観光公害）＝有名な場所に観光客が来すぎて、鎌倉や京都のように道路・電車・バスがいっぱいになり、地元の人が快適に暮らせない状態。"], ["(3)", "オ, カ", "本文に合わないもの。オ「入場料をとるべきでない」は、ケンが「外国人の料金を変えるルールを作るべき」と述べているので不一致。カ「もっと魅力的な店を作って観光客を増やす」は、混雑をさらに悪化させる。"], ["(4)", "エ", "ジュディのアイデア：「人気になるのはよいことだが、保護のきっかけにもなる」＝有名になることには良い点も悪い点もある。"], ["(5)", "イ", "ケン：「Originally, the owners of those sites are local people.」→ 人気の場所は観光客だけのためのものではない。"]]}, {"t": "問7 英文：図書館の取り組み", "items": [["(1)①", "エ", "「オンライン書籍も人気になってきているが、（紙の本は今でも多くの人に好まれている）」。"], ["(1)④", "ア", "「子どもたちが退屈したら、（親は子どもたちを遊び場で遊ばせることができる）」。"], ["(2)", "ア", "if we want to read paper books（読みたければ）の省略。「日本には3,000以上の図書館があり、紙の本を読む機会がたくさんある」。"], ["(3)", "エ", "that＝the event of reading a story for children（子どもたちに物語を読んで聞かせること）。大人向けにも同じような催しがある。"], ["(4)", "ウ", "「夜に図書館で開かれる大人向けの催し（怖い話）」＝A library that holds an event for adults."], ["(5)", "イ, カ", "イ：電車で、オンラインの新聞・天気予報の確認は、オンライン書籍やマンガを読むより人気。カ：コーヒーショップのある図書館では、おいしいコーヒーを飲みながら読書や勉強ができる。ア：SNSがいちばん人気。ウ・エ・オは本文と合わない。"]]}, {"t": "問8 英作文", "items": [["(1)", "How many books are there in the library?", "「何冊の本が」＝How many books。「その図書館には〜がありますか」＝are there in the library。（How many books does the library have? でも正解）"]]}], "A7_science": [{"t": "問1 地学", "items": [["Ⅰ(1)あ", "砂", "砂＝陸地のモデル。"], ["Ⅰ(1)い", "水", "水＝海のモデル。"], ["Ⅰ(2)2", "イ", "日あたりのよい場所では、砂のほうが水よりあたたまりやすい（水のほうがあたたまりにくい）。砂側の空気があたたまって上昇し、水側から砂側へ向かう風（海風）が生じる。"], ["Ⅰ(2)3", "エ", "夜は、砂のほうが冷めやすく、水のほうが冷めにくい。水側の空気が上昇し、砂側から水側へ向かう風（陸風）が生じる。"], ["Ⅰ(3)①か", "高く", "夏は、ユーラシア大陸上があたたまって気圧が低く、太平洋上で気圧が高くなりやすい。"], ["Ⅰ(3)①き", "エ", "夏は太平洋から大陸へ、南東の季節風がふく。"], ["Ⅰ(3)①く", "ア", "冬は大陸から太平洋へ、北西の季節風がふく。"], ["Ⅰ(3)②", "シベリア気団", "冬にユーラシア大陸にできる冷たく乾燥した空気のかたまり。"], ["Ⅰ(3)③", "ウ", "冬は、日本海側では雪が降り、太平洋側では湿度が低い晴れの日が続く。"], ["Ⅱ(1)あ", "おもり", "地震計では、おもりが静止し続けようとするため、地震による動きが記録紙に記録される。"], ["Ⅱ(1)い", "慣性", "静止している物体が静止し続けようとする性質。"], ["Ⅱ(2)", "主要動", "初期微動のあとにくる大きなゆれ。"], ["Ⅱ(3)", "オ", "震度4（資料の図の位置関係から選ぶ）。震源から遠いほど震度は小さくなる。"], ["Ⅱ(4)①", "P波：7km/s、S波：3.5km/s", "地点Aは震源から14km。P波は2.0秒で 14÷2＝7km/s、S波は4.0秒で 14÷4＝3.5km/s。"], ["Ⅱ(4)②", "イ", "地点A "Ⅰ(3)", "e", "速さが変わらなくなる（テープの長さが一定になる）最初の区間＝水平面に到達した区間。図のeからはテープの長さが一定。"], ["Ⅰ(4)あ", "等しく", "台車がもつ位置エネルギーは高さが同じなら変わらないので、水平面に到達したときの速さは等しい。"], ["Ⅰ(4)い", "大きく", "斜面の傾きを大きくすると、速さが変化する割合は大きくなる。"], ["Ⅰ(4)う", "短く", "斜面を下るのにかかる時間は短くなる。"], ["Ⅱ(1)", "伝導", "熱が高温の部分から低温の部分へ伝わる現象（熱伝導）。"], ["Ⅱ(2)", "900J", "電熱線A（12.0Ω）に6.0Vで流れる電流＝6.0÷12.0＝0.5A。電力＝6.0×0.5＝3.0W。5分間＝300秒。電力量＝3.0×300＝900J。"], ["Ⅱ(3)あ", "大きく", "電圧が等しいとき、抵抗が小さいほど電流が大きく、電力が大きくなる。"], ["Ⅱ(3)い", "激しく（大きく）", "消費電力が大きいので、水の温度の上がり方が激しくなる。"], ["Ⅱ(4)", "ア", "直列なので電流は等しい。発熱量は電力量に比例し、電力は I²R なので抵抗に比例する。A（12Ω）はB（6Ω）の2倍の熱を出し、水の温度上昇も約2倍。"]]}], "A7_social": [{"t": "問1 世界地理", "items": [["(1)X", "ミクロネシア", "地図1のXは、赤道の北に点在する小さな島々。"], ["(1)Y", "メラネシア", "Yは、オーストラリアの北東に位置する大きめの島々。"], ["(1)Z", "ポリネシア", "Zは、ニュージーランドやハワイなどを結ぶ三角形の地域。"], ["(2)", "イ → ア → ウ → エ", "赤道付近の熱帯雨林（イ）→ サバナ（ア）→ ステップ（ウ）→ 砂漠（エ）。矢印の向きに、赤道から北へ降水量が減る。"], ["(3)①", "エ", "Aはヒマラヤ山脈、Bはデカン高原、Cはガンジス川。"], ["(3)②", "茶", "スリランカ・ダージリン・アッサムは茶の産地。"], ["(4)", "ア", "小麦の輸出が多いフランスは、小麦の自給率が高い国。"], ["(5)", "例：札幌より高緯度にあるが、暖流の北大西洋海流とその上をふく偏西風の影響で、冬でも温暖な気候である。", "「海流」＝北大西洋海流、「風」＝偏西風。"], ["(6)①", "ウ", "ヒスパニックはメキシコに近い南部の州（カリフォルニア・テキサス・フロリダ）で割合が高い。"], ["(6)②", "A, C", "誤り：Aヒューストンは石油・宇宙産業（鉄鋼ではない）、Cピッツバーグは鉄鋼業の都市（航空宇宙ではない）。Bデトロイトの自動車、Dサンノゼの先端技術産業は正しい。"]]}, {"t": "問2 日本地理", "items": [["(1)", "国土地理院", "国土交通省の特別の機関で、地形図を作成・発行する。"], ["(2)①", "ルートマップ", "歩く道順を地形図に書き入れたもの。"], ["(2)②", "約750m", "2万5千分の1で3cm → 3×25000＝75000cm＝750m。"], ["(2)③", "イ, ウ（手書き解答はウと読めます）", "地形図から読み取れる事実を選ぶ問題（選択肢の読み取りに自信が低い問題です）。"], ["(3)①", "ウ", "資料1：Aは肉類（自給率が大きく下がった）、Bは米（ほぼ100%）、Cは野菜、Dは小麦（低い）。米＝B、野菜＝C。※手書き解答欄は「イ・ウ」と読めますが、正解はウです。"], ["(3)②A", "埼玉県", "印刷・印刷関連業の出荷額が大きい。"], ["(3)②B", "千葉県", "石油・石炭製品の出荷額が突出して大きい（京葉工業地域）。"], ["(3)②C", "群馬県", "輸送用機械器具（自動車）の出荷額が大きい。"], ["(3)③X", "ウ（たまねぎ）", "北海道が第1位、兵庫・佐賀・長崎・愛知が続く。"], ["(3)③Y", "ア（なす）", "高知・熊本・群馬・茨城・福岡など。"], ["(3)③Z", "イ（レタス）", "長野県が第1位。"], ["(3)④", "イ", "貨物輸送の割合：1965年は船舶が最大、2022年は自動車が過半数。鉄道は大きく減って4.4%（イ）。"]]}, {"t": "問3 中世の歴史", "items": [["(1)", "C", "元寇（文永の役）は博多湾（九州北部）で起こったが、地図のCは別の場所を示している。"], ["(2)①", "御成敗式目（貞永式目）", "1232年、武士の慣習をもとにつくられた最初の武家法。"], ["(2)②", "北条泰時", "第3代執権。"], ["(2)③X", "守護", "京都の警備と謀反人・殺人犯の取り締まり。"], ["(2)③Y", "地頭", "荘園・公領の管理と年貢の取り立て。"], ["(3)", "ウ", "『蒙古襲来絵詞』：日本の武士は一騎打ち、元軍は集団戦法と「てつはう」などの火器を用いた。"], ["(4)", "例：天皇を中心に、貴族を重視し、武士に不公平な政策をとった政治。", "「天皇」を使って、建武の新政の特色を書く。"], ["(5)", "ウ, エ", "応仁の乱は将軍あとつぎ問題と、細川氏・山名氏の対立。"], ["(6)", "ア", "観阿弥・世阿弥が能を大成し、合間に狂言が演じられた（室町文化）。"]]}, {"t": "問4 紙幣の人物と近代", "items": [["(1)カード1", "北里柴三郎", "破傷風の血清療法、ペスト菌の発見。"], ["(1)カード2", "津田梅子", "津田塾大学を創設。"], ["(1)カード3", "渋沢栄一", "「日本の資本主義の父」。"], ["(2)①", "エ", "地租は地価の3%（現金納付）。200円×3%＝6円、納税者は地主。"], ["(2)②X", "自由党", "板垣退助（1881年）。"], ["(2)②Y", "立憲改進党", "大隈重信（1882年）。"], ["(3)", "ドイツ、ウ", "第二次世界大戦後、東西に分裂。首都ベルリンも東西に分かれた。"], ["(4)", "ウ → エ → ア → イ", "満州事変（1931）→ 五・一五事件（1932）→ 二・二六事件（1936）→ 日中戦争（1937）。"], ["(5)", "ウ", "誤り。二十一か条の要求は日本が中国に出したもので、孫文が受け入れたのではない。"]]}, {"t": "問5 公民", "items": [["(1)", "イ, エ", "経済活動の自由（居住・移転・職業選択の自由、財産権）＝イ・エ。アは身体の自由、ウは表現の自由。"], ["(2)", "公正取引委員会", "独占禁止法を運用する。"], ["(3)", "ア", "誤り。不信任決議が可決されても、10日以内に衆議院を解散すれば総辞職しなくてよい。"], ["(4)X", "消費者", "国民＝消費者が不利益を被らないように。"], ["(4)Y", "企業", "企業間の自由な競争を促す。"], ["(5)", "ウ", "あ＝供給曲線、い＝需要曲線（イ：「うの価格」は供給過剰、エ：「おの価格」は不足）。えは需要量と供給量が一致する均衡価格。"], ["(6)①", "財政政策", "政府が行う景気対策。"], ["(6)②", "日本銀行", "金融政策を行う。"], ["(7)", "イ", "資料4：育児休業制度を利用して就業継続する割合は、2000年から2019年にかけて増え続けている。"]]}], "A7_japanese": [{"t": "問一 漢字", "items": [["(1)①", "おだ（やか）", "穏やか。"], ["(1)②", "おすい", "汚水。"], ["(1)③", "しゅうちゅうごうう", "集中豪雨。"], ["(1)④", "そしょう", "訴訟。"], ["(1)⑤", "すず（しい）", "涼しい。"], ["(2)①", "エ", "「状況」＝ジョウ。エ「挨拶ジョウ」＝状。"], ["(2)②", "ア", "「構える」。ア「駅のコウナイ」＝構内。"], ["(2)③", "ウ", "「敬意」。ウ「ケイロウの日」＝敬老。"], ["(2)④", "エ", "「批評」。エ「ヒョウカを上げる」＝評価。"], ["(2)⑤", "イ", "「体重をハカる」＝量る・計る。イ「タイリョウ」＝大量（「量」）。"]]}, {"t": "問二 随筆（角田光代『さがしもの』より）", "items": [["あらすじ", "—", "「私」は祖母のメモにあった本を探して、大学の近くの本屋に入る。本の表紙と、メモの文字がぴったり重なり、探していた本を見つける。大学卒業後、「私」は本屋に就職した。そして「定食屋の娘」というエッセイを読み、若い日のおばあちゃんの光景を思い浮かべる。"], ["(1)", "c", "「ない」の中で品詞が違うもの。a・b・dは形容詞「ない」、cは助動詞「ない」（打ち消し）。※手書き解答はcでした。"], ["(2)", "イ", "「沈殿していった」＝常に心にある存在ではなくなっていった（記憶が心の底に沈んでいった）という意味。"], ["(3)", "平積みにされた本", "「私が偶然訪れた本屋で（　）の書名と同じもの」＝メモに書かれていた書名は、本屋の「平積みにされた本」の表紙と同じだった。"], ["(4)", "ア", "「それでも私は決めていた。本屋で働こう」＝探している人の役に立ちたいと思ったから。※手書き解答はアでした。"], ["(5)i", "例：大学生のときに探していた本を見つけて、読んだことで知った。", "「私」はおばあちゃんが探していた本を実際に見つけて読んだことで、その理由を知った（25〜30字）。※手書きは読み取りに自信が低い箇所です。"], ["(5)ii", "自分の字の最初の五字（要確認）", "「定食屋の娘」を読んで思い浮かべた光景を書いた連続した三文の初めの五字を答える問題です。※手書き解答は読み取れませんでした。"], ["(5)iii", "例：おばあちゃんが「定食屋の娘」を読んで、自分のことが書かれていると気づいたのではないかと考えている。", "本文中の言葉を使って45〜50字で書く問題。※手書きは読み取りに自信が低い箇所です。"]]}, {"t": "問三 論説（三井秀樹『かたちの日本美』より）", "items": [["要旨", "—", "日本は四方を海で囲まれた島国で、山が多く、豊かな自然に恵まれてきた。そのため日本人は自然に畏敬の念をもち、自然を模した紋様や、季節の移ろいを大切にする美意識をつくりあげた。"], ["(1)", "エ", "A「そして」、B「だからこそ」の組み合わせ。※手書き解答はエでした。"], ["(2)①", "自然に畏敬の念をもつようになった", "本文：「自然への畏敬の念をもつようになった」→ 16字で抜き出す。"], ["(2)②", "地理的", "日本列島の「地理的」条件に始まる数々の理由。"], ["(3)", "ウ", "「文化の質」を変容させてきたのは大陸文化の影響を色濃く受けた…ではなく、日本列島の自然（風土）が、日本人の感性を育んだことを指す。※手書き解答はウでした。"], ["(4)", "ア", "衣服、インテリア、美術などの「自然と融合し一体化させる」＝自然のかたちを装飾に取り入れる。"], ["(5)", "季節の色やかたちの移ろい", "「移ろいの美学」は、季節の色やかたちの移ろいから生まれた（15字以内）。"], ["(6)", "例：日本の自然に触発されながら、美に目覚め、自然に対する繊細な感受性と鋭い観察眼を養ってきたことから。", "「日本人の自然に対する思いの深さ」は、日本人の編み出した紋様（自然の紋様と幾何学的紋様の融合）から察することができる。※手書き解答は読み取りに自信が低い箇所です。"], ["(7)", "例：日本は島国であり、四季があるので、日本人は自然に恵まれた生活や文化を築いてきた。自然の変化を大切にする心は、衣食住や祭りなどに表れている。私もその美意識を大切にしたい。", "条件：「島国」「生活や文化」の二つの言葉を使い、80〜100字で書く。（朱書きの「例」を参考にまとめました）"]]}, {"t": "問四 古文（『沙石集』）", "items": [["大意", "—", "池に住む蛇・亀・蛙。日照りで池の水がなくなり、蛇は飢えと渇きに苦しんで、亀を使者に立てて蛙に「ちょっとお目にかかりたい」と言わせる。蛙は「異常な事態では、情けも好みも忘れて食を求めるのだから」と断る。"], ["(1)", "うえんとして", "「うゑんとして」→ 現代仮名遣いで「うえんとして」。"], ["(2)", "亀を使いの者として", "「亀をもて使者として」＝亀を使いの者にして（10字以内）。"], ["(3)", "イ", "「飢渇に責めらるれば」＝飢えや渇きに苦しめられているので。"], ["(4)", "ウ", "蛙がだまされなかったのは、今が異常な事態であることを冷静に考えていたから。（「情けも好みも世の常の時こそあれ」）"]]}]};const T={"S5": [{"t": "問6 対話文：学生はネットで買い物をするのはよいか", "lines": [["Mr. Mori", "Now, / let's start the discussion.", "さあ、/ 議論を始めましょう。"], ["", "Today's topic is, / \"It is good for students / to buy things online.\"", "今日のトピックは、/ 「よいことだ / 生徒にとって / オンラインで物を買うのは」です。"], ["", "Please tell your opinions freely.", "あなたの意見を自由に話してください。"], ["Kota", "I think that / it is good for students / to buy things online.", "私は思います / よいことだと / 生徒にとって / オンラインで物を買うのは。"], ["", "Buying things online is not special for me / at all, / especially when I buy books.", "オンラインで物を買うのは私にとって特別ではありません / まったく、/ 特に本を買うときは。"], ["", "I'm busy / with many things every day.", "私は忙しい / 毎日多くのことで。"], ["", "{{(1)①:I don't have much time / to go shopping.}}", "{{(1)①:私にはあまり時間がありません / 買い物に行く。}}"], ["", "I have my club activities / on Monday, Wednesday, Friday and Saturday.", "私は部活動があります / 月曜、水曜、金曜、土曜に。"], ["", "On Tuesday and Thursday, / I go and study at my juku / until late at night.", "火曜と木曜は、/ 私は塾に行って勉強します / 夜遅くまで。"], ["", "{{(1)①:I am usually so tired on Sunday / that I don't want to go out on that day.}}", "{{(1)①:私はたいてい日曜日はとても疲れているので / その日は外出したくありません。}}"], ["Yuki", "I disagree to Kota's opinion.", "私はコウタの意見に反対です。"], ["", "{{(3)(a):He said that / he doesn't have much time to go shopping, / but I don't think so.}}", "{{(3)(a):彼は言いました / 買い物に行く時間があまりないと、/ でも私はそうは思いません。}}"], ["", "{{(3)(a):He can go and buy books / at the bookstore near his juku / before he starts to study there.}}", "{{(3)(a):彼は行って本を買うことができます / 彼の塾の近くの書店で / そこで勉強を始める前に。}}"], ["Saori", "Kota said / he doesn't have much time to go shopping.", "コウタは言いました / 買い物に行く時間があまりないと。"], ["", "I think / he would rather go shopping / because it takes longer / to get things when we use online shopping / than when we go shopping.", "私は思います / 彼はむしろ買い物に行くほうがいいと / 時間がかかるので / 物を手に入れるのに オンラインを使うと / 買い物に行くときより。"], ["Jack", "I don't think that / it is good for students / to buy things online.", "私は思いません / よいことだとは / 生徒にとって / オンラインで物を買うのは。"], ["", "Online shopping is dangerous for students / because it is too convenient.", "オンラインショッピングは生徒にとって危険です / あまりに便利だから。"], ["", "We sometimes buy things / we don't really need / at online stores.", "私たちはときどき物を買ってしまいます / 本当は必要でない / オンラインストアで。"], ["Ann", "I think / there is no problem / if students buy things online.", "私は思います / 問題はないと / 生徒がオンラインで物を買っても。"], ["", "Even if there is a bookstore around us, / the store doesn't always have the books we want.", "たとえ近くに書店があっても、/ その店にいつも欲しい本があるとは限りません。"], ["", "But online bookstores have / almost all the books we want.", "でもオンライン書店には / 欲しい本のほとんどがあります。"], ["", "{{(1)②:In addition, / when we use online bookstores, / we don't have to walk around the bookstore / to find the books.}}", "{{(1)②:加えて、/ オンライン書店を使うと、/ 書店の中を歩き回る必要がありません / 本を見つけるために。}}"], ["", "It greatly helps us ②(save our time).", "それは私たちを大いに助けます / ②(時間を節約するのに)。"], ["Naomi", "For me, / there are no differences / between going shopping and using online shopping.", "私にとっては、/ 違いはありません / 買い物に行くことと、オンラインショッピングを使うことの間に。"], ["", "When I buy something at ordinary stores, / I ask my mother to give me some money I need.", "ふつうの店で何かを買うときは、/ 私は母に必要なお金をくれるよう頼みます。"], ["", "{{(4):When I buy something online, / I ask her to order it / instead of me.}}", "{{(4):オンラインで何かを買うときは、/ 私は母にそれを注文してくれるよう頼みます / 私の代わりに。}}"], ["", "There is a rule / between my mother and me.", "ルールがあります / 母と私の間に。"], ["", "That is, / \"I never click the button / to order something by myself.\"", "つまり、/ 「私は決してボタンをクリックしません / 自分で何かを注文するために」。"], ["Mr. Mori", "{{(2):I think that Naomi's way is good.}}", "{{(2):私はナオミのやり方がよいと思います。}}"], ["", "In the near future, / we will have more and more opportunities / to buy things online.", "近い将来、/ 私たちはますます機会が増えるでしょう / オンラインで物を買う。"], ["", "It will be good for you / to consider how you should use it from today.", "あなたたちにとってよいでしょう / どのように使うべきかを考えることは / 今日から。"]]}, {"t": "問7 メール文：ハイキングの計画", "lines": [["Mary", "Hi Ken,", "こんにちは、ケン、"], ["", "I'm going to tell you about my plan.", "私の計画についてあなたに話します。"], ["", "I looked up the hiking courses / to the top of Green Grass Hill / on the Internet.", "私はハイキングコースを調べました / グリーングラスヒルの頂上への / インターネットで。"], ["", "There are three courses to the top. / They are; the Course A, B, and C.", "頂上へは3つのコースがあります。/ コースA、B、Cです。"], ["", "The most popular course is the Course B.", "最も人気のあるコースはコースBです。"], ["", "We can enjoy great views / while we are going up the course.", "私たちはすばらしい景色を楽しめます / コースを登っている間。"], ["", "But we are beginners for hiking, / and this course may be hard for us.", "しかし私たちはハイキングの初心者です、/ そしてこのコースは私たちには難しいかもしれません。"], ["", "The easiest course is the Course C.", "最も簡単なコースはコースCです。"], ["", "We may feel bored / because ①(the course doesn't have anything to see).", "私たちは退屈に感じるかもしれません / ①(そのコースは見るものが何もないので)。"], ["", "If we choose this course, / we can reach the top in two hours.", "このコースを選べば、/ 2時間で頂上に着けます。"], ["", "The Course A is the hardest course of the three, / and it will take more than four hours to get to the top.", "コースAは3つのうちで最も難しく、/ 頂上に着くのに4時間以上かかるでしょう。"], ["", "From these facts, / we should choose the Course C.", "これらの事実から、/ 私たちはコースCを選ぶべきです。"], ["", "Please tell me your opinion.", "あなたの意見を教えてください。"], ["", "The next topic is our lunch.", "次の話題は私たちの昼食です。"], ["", "I think it is the best / to have lunch on the top.", "私は最良だと思います / 頂上で昼食を食べるのが。"], ["", "From the top, / we can see the ocean.", "頂上からは、/ 海が見えます。"], ["", "It is wonderful / to have lunch with a great ocean view, / right?", "すばらしいです / 海のすばらしい景色を見ながら昼食を食べるのは、/ そうでしょう？"], ["", "To make this plan possible, / we have to start hiking at 9:30.", "この計画を可能にするために、/ 私たちは9時30分にハイキングを始めなければなりません。"], ["", "So let's take the train / which arrives at the nearest station to the hill, / High West Station, / around 9:15.", "だから電車に乗りましょう / 丘の最寄り駅に着く、/ ハイウェスト駅、/ 9時15分ごろに。"], ["", "I'm attaching the train schedule, / please check it out.", "電車の時刻表を添付します、/ 確認してください。"], ["", "Oh! / I have good news.", "あっ！ / いい知らせがあります。"], ["", "The weather forecast says / that it will be sunny next Saturday.", "天気予報によると / 来週の土曜日は晴れるそうです。"], ["", "So, / we don't have to prepare anything for the rain!", "だから、/ 雨のために何も準備しなくていいです！"], ["", "Bye for now, / Mary", "ではまた、/ メアリー"], ["Ken", "Hi Mary,", "こんにちは、メアリー、"], ["", "Thank you for telling me your plan!", "計画を教えてくれてありがとう！"], ["", "You said / the Course B may be hard for us, / but it is the main purpose for me / to go up the hill on the course.", "あなたは言いました / コースBは私たちには難しいかもしれないと、/ でもそれは私にとって主な目的です / そのコースで丘に登ることが。"], ["", "The other day, / I found some photos of the views from the course / on the Internet.", "先日、/ 私はそのコースからの景色の写真を見つけました / インターネットで。"], ["", "I was really moved with those photos.", "私はその写真に本当に感動しました。"], ["", "In this season, / beautiful colorful leaves / and great mountains covered with snow / can be seen in the distance.", "この季節には、/ 美しい色とりどりの葉と / 雪をかぶったすばらしい山々が / 遠くに見えます。"], ["", "I want to see those views with my own eyes, / and I'm sure you will love them.", "私はその景色を自分の目で見たいです、/ そしてあなたもきっと気に入ると思います。"], ["", "I know you are afraid of the course.", "あなたがそのコースを不安に思っているのは知っています。"], ["", "When we find that the course is too hard for us / to keep going, / let's ②(give up going to the top).", "コースが私たちには難しすぎると分かったら / 進み続けるには、/ ②(頂上に行くのをあきらめましょう)。"], ["", "Then, / let's have lunch on the way.", "そして、/ 途中で昼食を食べましょう。"], ["", "According to the reviews on the Internet, / {{(4):we have a chance to see the ocean / at some points of the course.}}", "{{(4):インターネットの口コミによると、/ 私たちは海を見る機会があります / コースのいくつかの地点で。}}"], ["", "The Course B will take us about three hours / to go up to the top.", "コースBは約3時間かかります / 頂上まで登るのに。"], ["", "If we carry out my plan, / it is necessary for us / to arrive at High West Station / one hour earlier than your plan.", "もし私の計画を実行するなら、/ 私たちにとって必要です / ハイウェスト駅に着く / あなたの計画より1時間早く。"], ["", "Mary, / the weather in this season may change suddenly.", "メアリー、/ この季節の天気は急に変わるかもしれません。"], ["", "It is good to take a raincoat with us.", "レインコートを持っていくのがよいです。"], ["", "An umbrella is not good for hiking.", "かさはハイキングには向きません。"], ["", "Best, / Ken", "では、/ ケン"]]}], "S6": [{"t": "問6 対話文：日本での生活と言葉の問題", "lines": [["Makoto", "Judy, / about ten weeks have passed / since you started your life in Japan.", "ジュディ、/ 約10週間が過ぎました / あなたが日本で生活を始めてから。"], ["", "Do you have any problems / in your life here?", "何か問題はありますか / ここでの生活で？"], ["Judy", "Nothing. / Everything is going well.", "ありません。/ すべて順調です。"], ["", "I love the climate here, / and every food is delicious.", "ここの気候が大好きですし、/ どの食べ物もおいしいです。"], ["", "Oh! / I have a problem.", "あっ！ / 問題がありました。"], ["", "{{(1)①:Some Japanese people, / especially elderly people, / don't try to talk with me.}}", "{{(1)①:一部の日本人は、/ 特に高齢の人たちは、/ 私と話そうとしません。}}"], ["", "{{(1)①:They usually look away from me.}}", "{{(1)①:彼らはたいてい私から目をそらします。}}"], ["", "Maybe, / ①(I'm not liked by them).", "たぶん、/ ①(私は彼らに好かれていないのです)。"], ["Makoto", "Well, / I think you misunderstand.", "ええと、/ あなたは誤解していると思います。"], ["", "I guess / those people don't know what to say to you.", "思うに / その人たちはあなたに何と言えばいいか分からないのです。"], ["", "You know, / many Japanese people can't speak and listen to English so well.", "ほら、/ 多くの日本人は英語を話したり聞いたりするのがあまり上手ではありません。"], ["Judy", "As you said, / I sometimes see Japanese people / who can't say anything / when they are talked to / by foreign visitors.", "あなたが言ったように、/ 私はときどき日本人を見かけます / 何も言えない / 話しかけられたときに / 外国人の訪問者から。"], ["Yuki", "{{(2):Some visitors to Japan can't use / even easy Japanese words and phrases.}}", "{{(2):日本を訪れる人の中には使えない人もいます / 簡単な日本語の単語や語句さえ。}}"], ["", "{{(2):So, / Japanese shop clerks and restaurant servers / often have a language problem with them.}}", "{{(2):だから、/ 日本の店員さんやレストランの給仕係は / よく彼らと言葉の問題を抱えます。}}"], ["Judy", "Especially, / English speakers often do that.", "特に、/ 英語を話す人はよくそうします。"], ["", "I don't like them.", "私は彼らが好きではありません。"], ["", "On the other hand, / I love Japanese workers.", "一方で、/ 私は日本の働く人たちが大好きです。"], ["", "{{(4):They always try to do their best / with every customer.}}", "{{(4):彼らはいつも最善を尽くそうとします / どのお客さんにも。}}"], ["", "If they could use English better, / they could do their work easier.", "もし彼らがもっと英語を使えれば、/ 仕事がもっと楽にできるでしょう。"], ["Makoto", "The problem isn't so easy.", "その問題はそんなに簡単ではありません。"], ["", "There are visitors / who can understand neither Japanese nor English.", "訪問者もいます / 日本語も英語も理解できない。"], ["", "Look at this chart.", "このチャートを見てください。"], ["Yuki", "Well..., / {{(3):the No.1 ranker is the country / which is one of the nearest countries to Japan.}}", "ええと…、/ {{(3):1位はその国です / 日本に最も近い国のひとつである。}}"], ["", "Oh! / {{(3):The number of the United States is large, too.}}", "あっ！ / {{(3):アメリカの数も多いです。}}"], ["", "{{(3):On the other hand, / there are only two countries in Europe in this chart.}}", "{{(3):一方、/ このチャートにはヨーロッパの国は2つしかありません。}}"], ["Makoto", "The United States is a rich country, / {{(5):and there may be many fans of Japan in the country.}}", "アメリカは豊かな国で、/ {{(5):その国には日本のファンがたくさんいるかもしれません。}}"], ["", "Europe is so far away from here / that it's not easy to come.", "ヨーロッパはここからとても遠いので / 来るのは簡単ではありません。"], ["Judy", "The official language of Australia and the United Kingdom is English.", "オーストラリアとイギリスの公用語は英語です。"], ["", "But the numbers of the two countries aren't so large.", "でもその2つの国の数はそれほど多くありません。"], ["Makoto", "Right. / Also, / the number of non-English speakers is increasing in the United States these days.", "そのとおり。/ また、/ 英語を話さない人の数がアメリカでふえています / 最近。"], ["", "That is, / if we get English, / we don't have so many chances to use it in Japan.", "つまり、/ もし英語を身につけても、/ 日本ではそれを使う機会はそれほど多くありません。"], ["", "Do we have to get one more language?", "もう1つ言語を身につけなければならないのでしょうか？"], ["Yuki", "Oh, no.... / I think ④(it's impossible for me).", "ああ、いや…。/ 私は思います ④(私には無理だと)。"], ["", "You know, / it's not easy for us / to get even English.", "ほら、/ 私たちには簡単ではありません / 英語さえ身につけるのは。"], ["Judy", "{{(5):I think we should use AI translators more often.}}", "{{(5):私はAI翻訳機をもっと使うべきだと思います。}}"], ["", "They are useful / when we communicate with people / coming from all over the world.", "それらは役に立ちます / 私たちが人々と意思疎通するとき / 世界中から来る。"]]}, {"t": "問7 メール文：北海道旅行の計画", "lines": [["Ken", "Hi Andy,", "こんにちは、アンディ、"], ["", "I surfed the Internet / to make plans of our trip.", "私はインターネットを調べました / 旅行の計画を立てるために。"], ["", "I'm going to ask you some things / that we should decide.", "あなたにいくつか質問します / 私たちが決めるべきこと。"], ["", "First, / ①(how should we go to Hokkaido?)", "まず、/ ①(どうやって北海道に行きましょうか？)"], ["", "We have two choices / to get there; / by Shinkansen or by air.", "選択肢が2つあります / そこへ行くのに、/ 新幹線か飛行機か。"], ["", "When we go by Shinkansen, / it costs about 25,000 yen, / and it takes about 5 hours.", "新幹線で行くと、/ 約25,000円かかり、/ 約5時間かかります。"], ["", "On the other hand, / an airplane takes us to Hokkaido / for about 20,000 yen / in 100 minutes.", "一方、/ 飛行機なら北海道に連れて行ってくれます / 約20,000円で / 100分で。"], ["", "I know well / that you are a big fan of Shinkansen, / so you may say you want to choose Shinkansen.", "よく知っています / あなたが新幹線の大ファンだと、/ だから新幹線を選びたいと言うかもしれません。"], ["", "But this time, / we should take an airplane / because we can get to our destination faster / at lower cost.", "でも今回は、/ 飛行機に乗るべきです / 目的地により早く着けるので / より安い費用で。"], ["", "Is it OK?", "いいですか？"], ["", "Next, / what should we do in Hokkaido?", "次に、/ 北海道で何をしましょうか？"], ["", "There are three things / that I want to do there.", "3つあります / 私がそこでしたいこと。"], ["", "First, / I want to see some old buildings / because I'm interested in historical spots.", "第一に、/ 私は古い建物を見たいです / 歴史的な場所に興味があるので。"], ["", "But I'm afraid the activity is boring to you....", "でもその活動はあなたには退屈ではないかと心配です…。"], ["", "Second, / I want to visit a zoo.", "第二に、/ 私は動物園を訪れたいです。"], ["", "I like animals very much, / right?", "私は動物が大好きです、/ そうでしょう？"], ["", "At the zoo, / we can see animals / in the way that we have never experienced at other zoos.", "動物園では、/ 動物を見られます / 他の動物園では経験したことのない方法で。"], ["", "Finally, / I want to see the night view from a mountain top.", "最後に、/ 私は山の頂上からの夜景を見たいです。"], ["", "{{(4):It is famous / as one of the most beautiful night views in Japan.}}", "{{(4):それは有名です / 日本で最も美しい夜景のひとつとして。}}"], ["", "That's all. / What do you think of my plans?", "以上です。/ 私の計画をどう思いますか？"], ["", "Please tell me your ideas.", "あなたの考えを教えてください。"], ["", "Bye for now, / Ken", "ではまた、/ ケン"], ["Andy", "Hi Ken,", "こんにちは、ケン、"], ["", "Thank you for telling me your plans.", "計画を教えてくれてありがとう。"], ["", "As you wrote, / I want to go by Shinkansen if I can.", "あなたが書いたように、/ できれば私は新幹線で行きたいです。"], ["", "But this time, / we should take an airplane / because it is too long for you / to take a train for about 5 hours.", "でも今回は、/ 飛行機に乗るべきです / あなたには長すぎるので / 約5時間電車に乗るのは。"], ["", "And, / I have good news about a ticket of an airplane.", "それから、/ 飛行機の切符についていい知らせがあります。"], ["", "{{(2)(a):I found a cheaper ticket / on the Internet.}}", "{{(2)(a):私はもっと安い切符を見つけました / インターネットで。}}"], ["", "{{(2)(a):It is only 8,000 yen!}}", "{{(2)(a):たったの8,000円です！}}"], ["", "But the ticket has a problem.", "でもその切符には問題があります。"], ["", "The airplane will take off at 8 a.m., / so we have to arrive at the airport by 7 a.m.", "飛行機は午前8時に離陸するので、/ 私たちは午前7時までに空港に着かなければなりません。"], ["", "{{(2)(b):So, / we must take a bus / which leaves our town at 5 a.m.}}", "{{(2)(b):だから、/ バスに乗らなければなりません / 私たちの町を午前5時に出る。}}"], ["", "②(Can you get up so early?)", "②(そんなに早く起きられますか？)"], ["", "Next is my opinion / about what to do in Hokkaido.", "次は私の意見です / 北海道ですることについて。"], ["", "I agree with your plan / except old buildings.", "あなたの計画に賛成です / 古い建物を除いて。"], ["", "{{(4):As you wrote, / I'm sorry but I'm not very interested in history.}}", "{{(4):あなたが書いたように、/ 申し訳ないけれど私は歴史にあまり興味がありません。}}"], ["", "So, / while you visit the buildings, / I'll go to a museum / which has some famous pictures.", "だから、/ あなたが建物を訪れている間、/ 私は美術館に行きます / 有名な絵がある。"], ["", "Also, / I have one more request.", "また、/ もう1つ希望があります。"], ["", "Let's go to see a baseball game / at a new baseball stadium in Hokkaido.", "野球の試合を見に行きましょう / 北海道の新しい野球場で。"], ["", "I heard / we can have some interesting experiences there.", "聞きました / そこでおもしろい体験ができると。"], ["", "How about watching a baseball game / and going to see the night view after the game?", "野球の試合を見て / 試合のあとに夜景を見に行くのはどうですか？"], ["", "I'm looking forward to the trip!", "旅行を楽しみにしています！"], ["", "Best, / Andy", "では、/ アンディ"]]}], "S7": [{"t": "問6 対話文：図書館（ジャックとモモ）", "lines": [["Jack", "Momo, / do you often read books?", "モモ、/ あなたはよく本を読みますか？"], ["Momo", "Yes. / I like reading in my room / because I can feel relaxed.", "はい。/ 私は自分の部屋で読書するのが好きです / くつろげるので。"], ["", "Also, / on a sunny holiday, / I often go to a park near my house / and ①do that on a bench.", "また、/ 晴れた休日には、/ よく家の近くの公園に行って / ベンチで①{{(1)①:それをします（＝本を読む）}}。"], ["Jack", "Sounds nice. / Then, / you often go to a library, / don't you?", "いいですね。/ それなら、/ あなたはよく図書館に行きますよね？"], ["Momo", "Yes. / I usually read four or five books a month.", "はい。/ 私はたいてい1か月に4、5冊本を読みます。"], ["", "So, / I often go to a city library / and borrow some books.", "だから、/ よく市の図書館に行って / 本を何冊か借ります。"], ["Jack", "Actually, / I was looking for an old book.", "実は、/ 私は古い本を探していました。"], ["", "It's not sold online.", "それはオンラインでは売っていません。"], ["", "Last night, / I surfed the Internet / and found it at last / on a Japanese website.", "昨夜、/ インターネットを調べて / ついに見つけました / 日本語のウェブサイトで。"], ["", "The book is in Minami Library in this city.", "その本はこの市の南図書館にあります。"], ["", "I was excited to know that.", "それを知ってわくわくしました。"], ["Momo", "Japanese website? / Jack, / ②(you can't read Japanese), / right?", "日本語のウェブサイト？ / ジャック、/ ②(あなたは日本語が読めません)、/ よね？"], ["Jack", "Right. / But I've learned the kanji of \"Minami\" before.", "そのとおり。/ でも「南」の漢字は前に習いました。"], ["", "Have you ever been to the library?", "あなたはその図書館に行ったことがありますか？"], ["Momo", "Yes, / a few times.", "はい、/ 数回。"], ["", "It's the largest library in this city, / but it's a little far.", "この市で最大の図書館ですが、/ 少し遠いです。"], ["Jack", "Great! / I'm going to go there from now on, / but I don't know how to get there.", "すばらしい！ / これからそこへ行くつもりですが、/ 行き方が分かりません。"], ["Momo", "Does the website have no maps?", "ウェブサイトには地図がないのですか？"], ["Jack", "{{(3):Of course, / the Japanese pages had a map of the library, / but I couldn't understand it at all.}}", "{{(3):もちろん、/ 日本語のページには図書館の地図がありました、/ でもまったく理解できませんでした。}}"], ["", "Unfortunately, / I couldn't find its English pages.", "残念ながら、/ 英語のページは見つけられませんでした。"], ["Momo", "I see. / OK. / I'll tell you the easiest way to get there.", "なるほど。/ いいですよ。/ そこへ行く最も簡単な方法を教えます。"], ["", "First, / go to Shinrin Station by train.", "まず、/ 電車で森林駅に行きます。"], ["", "Next, / take a bus for City Stadium / and get off at the fifth bus stop, / Minami Museum.", "次に、/ 市営競技場行きのバスに乗って / 5番目のバス停、南博物館で降ります。"], ["", "Then, / walk to Minami Swimming Pool.", "それから、/ 南プールまで歩きます。"], ["", "Walk for a few minutes, / and you'll find the library on your right.", "数分歩くと、/ 図書館が右手に見つかります。"], ["Jack", "Oh, / it sounds a little hard.", "ああ、/ 少し大変そうですね。"], ["", "Do you always go there in ③that way?", "あなたはいつもそこへ③{{(1)③:その方法（＝今教えてくれた行き方）}}で行くのですか？"], ["Momo", "No, / I usually go by bike.", "いいえ、/ 私はたいてい自転車で行きます。"], ["", "If it's difficult for you / to take the train and bus, / how about going home on foot / after ④(borrowing the book today)?", "もしあなたにとって難しいなら / 電車とバスに乗るのが、/ 歩いて帰るのはどうですか / ④(今日本を借りた)あとで？"], ["", "You can walk home from the library in an hour.", "図書館から1時間で歩いて帰れます。"], ["Jack", "Good idea! / I'll do that.", "いい考えですね！ / そうします。"], ["", "Momo, / actually, / I have some old movies I want to watch.", "モモ、/ 実は、/ 見たい古い映画がいくつかあります。"], ["", "If the library has the DVDs, / I want to borrow them, too.", "図書館にそのDVDがあれば、/ それらも借りたいです。"], ["", "Does the library have any DVDs?", "図書館にDVDはありますか？"], ["Momo", "{{(5):I don't know.}}", "{{(5):分かりません。}}"], ["", "If you have your smartphone with you now, / I'll check about it for you.", "今スマートフォンを持っているなら、/ 私があなたのために調べます。"], ["Jack", "Really? / Wait a minute. / Let me see.... / OK. / This is the site.", "本当に？ / ちょっと待って。/ ええと…。/ はい。/ これがそのサイトです。"], ["Momo", "Well, / the library has more than 2 million books / and about 10 hundred DVDs.", "ええと、/ 図書館には200万冊以上の本と / 約1,000枚のDVDがあります。"], ["", "{{(4):You can borrow up to 15 books and one DVD / for 15 days / at once.}}", "{{(4):最大15冊の本とDVD1枚を借りられます / 15日間 / 一度に。}}"], ["Jack", "Great! / It's open today, / right?", "すばらしい！ / 今日は開いていますよね？"], ["Momo", "Well, / it's open at 9 a.m. / and closes at 7 p.m. / from Tuesdays to Sundays.", "ええと、/ 午前9時に開いて / 午後7時に閉まります / 火曜から日曜まで。"], ["", "Um, / wait! / It's not open today / because the library is going to check their books.", "えっと、/ 待って！ / 今日は開いていません / 図書館が蔵書の点検をするので。"], ["Jack", "Oh, no! / But no problem. / I'll go tomorrow. / Thank you.", "ああ、だめだ！ / でも問題ありません。/ 明日行きます。/ ありがとう。"], ["Momo", "I hope you can find the DVDs you want to borrow.", "借りたいDVDが見つかるといいですね。"]]}, {"t": "問7 スピーチ：インターネットと私たち（トム）", "lines": [["", "Good afternoon, everyone.", "みなさん、こんにちは。"], ["", "Today, / I'm going to talk about the Internet in our life.", "今日は、/ 私たちの生活の中のインターネットについてお話しします。"], ["", "It is difficult for us / to live a life without the Internet.", "私たちには難しいです / インターネットなしで生活するのは。"], ["", "Thanks to the Internet, / we can get a lot of information easily.", "インターネットのおかげで、/ 私たちはたくさんの情報を簡単に得られます。"], ["", "Also, / we can communicate with our friends / anytime, anywhere.", "また、/ 友達と連絡を取り合えます / いつでも、どこでも。"], ["", "In addition, / we can enjoy playing games / with people living in foreign countries / if we want to.", "加えて、/ ゲームを楽しめます / 外国に住む人たちと / 望めば。"], ["", "Like these, / the Internet has made a lot of things possible.", "このように、/ インターネットは多くのことを可能にしました。"], ["", "However, / {{(1)①:①(it also brings us some problems).}}", "しかし、/ {{(1)①:①(それは私たちにいくつかの問題ももたらします)。}}"], ["", "One of the problems is, / \"The Internet is so convenient and interesting / that we use it for too long.\"", "問題の1つは、/ 「インターネットはとても便利でおもしろいので / 私たちは長く使いすぎる」ことです。"], ["", "Look at Graph A.", "グラフAを見てください。"], ["", "This is the result of a research / about the relationship / between junior high school students in Japan and the Internet.", "これは調査の結果です / 関係についての / 日本の中学生とインターネットの。"], ["", "From the research, / we can learn many things.", "その調査から、/ 私たちは多くのことが分かります。"], ["", "On average, / junior high school students use the Internet / for about 5 hours a day / on weekdays.", "平均して、/ 中学生はインターネットを使っています / 1日約5時間 / 平日に。"], ["", "{{(4):Don't you think it's too long?}}", "{{(4):長すぎると思いませんか？}}"], ["", "On weekdays, / we have only about 7 hours / from getting home to going to bed.", "平日は、/ 私たちには約7時間しかありません / 帰宅してから寝るまで。"], ["", "{{(2)ⓐ:The result also shows / that just 40% of junior high school students use the Internet / for more than 5 hours a day.}}", "{{(2)ⓐ:その結果はまた示しています / 中学生のちょうど40%が使っていることを / 1日5時間以上。}}"], ["", "I was surprised to know this.", "私はこれを知って驚きました。"], ["", "We should do other things, / such as studying, playing an instrument, / and talking with family members.", "私たちは他のことをするべきです、/ 勉強したり、楽器を演奏したり、/ 家族と話したりといった。"], ["", "I think these activities are much more important / than doing something with our smartphone.", "こうした活動のほうがずっと大切だと思います / スマートフォンで何かをするより。"], ["", "The next problem is, / \"Can we use our smartphone effectively?\"", "次の問題は、/ 「私たちはスマートフォンを効果的に使えているか？」です。"], ["", "Look at Table B.", "表Bを見てください。"], ["", "The most popular purpose is watching movies.", "最も人気のある目的は動画を見ることです。"], ["", "Once, / watching TV in the evening / was one of the most popular activities at home.", "かつて、/ 夕方にテレビを見ることは / 家庭で最も人気のある活動の1つでした。"], ["", "Some of the family members got together, / watched a TV program, / and talked about many things.", "家族の何人かが集まって、/ テレビ番組を見て、/ いろいろなことを話しました。"], ["", "But today, / it has changed to the activity / that we usually do alone.", "しかし今日では、/ それは活動に変わりました / 私たちがたいてい1人でする。"], ["", "{{(4):In other words, / we have lost chances to communicate with family members.}}", "{{(4):言いかえると、/ 私たちは家族と話す機会を失いました。}}"], ["", "Instead, / we have more chances to exchange messages with friends / because, / thanks to the Internet, / it has become much easier.", "その代わり、/ 友達とメッセージを交換する機会が増えました / なぜなら、/ インターネットのおかげで、/ ずっと簡単になったからです。"], ["", "So, / the activity is the second place.", "だから、/ その活動は2位です。"], ["", "Searching for something is after exchanging messages with friends.", "何かを検索することは友達とのメッセージ交換の次です。"], ["", "{{(3)ⓐ:I was surprised to know / that playing games is not so popular / as listening to music,}}", "{{(3)ⓐ:私は知って驚きました / ゲームはそれほど人気がないと / 音楽を聴くほど、}}"], ["", "{{(1)②:because a lot of classmates of mine always / ②(talk about online games).}}", "{{(1)②:なぜなら私のクラスメートの多くがいつも / ②(オンラインゲームについて話している)からです。}}"], ["", "{{(3)ⓑ:Reading manga is not as popular as I expected.}}", "{{(3)ⓑ:マンガを読むことは私が思っていたほど人気がありません。}}"], ["", "Only 32% of the students do that.", "生徒のたった32%がそうしています。"], ["", "By the way, / do you want to know the thing / that I usually do with my smartphone?", "ところで、/ あなたたちは知りたいですか / 私がふだんスマートフォンでしていることを？"], ["", "OK, / I'm going to tell you about it.", "では、/ それについてお話しします。"], ["", "My hobby is making short videos.", "私の趣味は短い動画を作ることです。"], ["", "I often take movies outside, / such as at a park, / in a forest, / and in a town.", "私はよく外で動画を撮ります、/ 公園や、/ 森や、/ 町といった場所で。"], ["", "Then, / I send the videos to my friends in Australia.", "それから、/ その動画をオーストラリアの友達に送ります。"], ["", "I want to tell them / about my life in Japan.", "彼らに伝えたいのです / 日本での私の生活について。"], ["", "{{(4):Also, / I often watch movies for studying Japanese.}}", "{{(4):また、/ 私はよく日本語を勉強するために動画を見ます。}}"], ["", "I hope the movies will help me improve my Japanese.", "その動画が私の日本語の上達に役立つことを願っています。"], ["", "Using the Internet for studying / was chosen by about 40% of the students, / and I'm one of them.", "勉強のためにインターネットを使うことは / 生徒の約40%に選ばれていて、/ 私もその1人です。"], ["", "Like above, / a lot of junior high school students in Japan / usually use their smartphone to have fun.", "以上のように、/ 日本の多くの中学生は / ふだんスマートフォンを楽しむために使っています。"], ["", "Of course, / it's one of the good purposes to use it.", "もちろん、/ それはそれを使ういい目的の1つです。"], ["", "But we are still young / and have to learn many things.", "でも私たちはまだ若く / 多くのことを学ばなければなりません。"], ["", "So, / we should think about the better ways / to use our smartphone.", "だから、/ 私たちはよりよい方法を考えるべきです / スマートフォンを使う。"]]}], "A5": [{"t": "問6 対話文：クラブ活動は全員がするべきか", "lines": [["Mr. Mori", "Now, / let's start / the discussion.", "さあ、/ 始めましょう / 議論を。"], ["", "Today's topic is, / \"Does every student have to be / a member of a club activity?\"", "今日のトピックは、/ 「すべての生徒は〜でなければならないか / クラブ活動の一員で（あること）」です。"], ["", "Please tell / your opinions / freely.", "話してください / あなたの意見を / 自由に。"], ["Judy", "I think that / every student has to be / a member of a club activity.", "私は思います / すべての生徒は〜でなければならないと / クラブ活動の一員で。"], ["", "Club activities can give us / {{(1):many things / that we cannot learn / from studying.}}", "クラブ活動は私たちに与えることができます / {{(1):多くのことを / 私たちが学べない / 勉強からは。}}"], ["", "For example, / {{(1):how to do well / with teammates, / how to communicate / with older persons.}}", "たとえば、/ {{(1):うまくやる方法、/ チームメイトと、/ コミュニケーションを取る方法 / 年上の人と。}}"], ["", "These things / will help us / for the future.", "これらのことは / 私たちを助けるでしょう / 将来のために。"], ["Kaori", "I don't think that / every student has to be / in a club activity.", "私は思いません / すべての生徒は〜でなければならないと / クラブ活動に入って。"], ["", "In many club activities, / students are required to join / the activities / on many of our holidays / and during the summer and winter vacations.", "多くのクラブ活動では、/ 生徒は参加することを求められます / 活動に / 私たちの多くの休日に / そして夏休みと冬休みの間。"], ["", "I want to do / {{(4):the things I like / at home / on weekends / and during the long vacations.}}", "私はしたいです / {{(4):好きなことを / 家で / 週末に / そして長い休みの間。}}"], ["Hide", "I agree with Judy.", "私はジュディに賛成です。"], ["", "Through club activities, / we experience / good times and bad times.", "クラブ活動を通して、/ 私たちは経験します / よい時と悪い時を。"], ["", "Through these experiences, / {{(5):club members / will become true friends.}}", "これらの経験を通して、/ {{(5):クラブの部員は / 本当の友達になるでしょう。}}"], ["", "True friends / are really important / in our lives.", "本当の友達は / とても大切です / 私たちの人生で。"], ["Toshi", "{{(2)②:I agree with Kaori.}}", "{{(2)②:私はカオリに賛成です。}}"], ["", "{{(3)a:My dream is / to become / a professional soccer player.}}", "{{(3)a:私の夢は / なることです / プロのサッカー選手に。}}"], ["", "Now / I'm a member / of a youth team / of a professional soccer club / because the soccer team of our school / cannot give me / the things which I need.", "今 / 私は部員です / ユースチームの / プロのサッカークラブの / 私たちの学校のサッカー部は / 私に与えられないので / 私が必要とするものを。"], ["", "For my dream, / I have to practice soccer / with a higher level.", "私の夢のために、/ 私はサッカーを練習しなければなりません / より高いレベルで。"], ["Cathy", "{{(2)②:(I'm for Kaori, too.)}}", "{{(2)②:（私もカオリに賛成です。）}}"], ["", "{{(3)a:I want to become / a professional pianist / in the future.}}", "{{(3)a:私はなりたいです / プロのピアニストに / 将来。}}"], ["", "I have the piano lesson / four days a week.", "私はピアノのレッスンがあります / 週に4日。"], ["", "I don't have much time / to join the music club / of our school.", "私にはあまり時間がありません / 音楽部に入る / 私たちの学校の。"], ["", "Also, / I don't think that / it is useful for me / to listen to music / that other students play.", "また、/ 私は思いません / 私にとって役に立つとは / 音楽を聞くことが / 他の生徒が演奏する。"], ["Brian", "I disagree with Cathy.", "私はキャシーに反対です。"], ["", "Actually, / a pianist is a person / who plays music alone.", "実は、/ ピアニストは人です / 一人で音楽を演奏する。"], ["", "But the music / that other students play / can give you / some inspiration.", "しかし音楽は / 他の生徒が演奏する / あなたに与えることができます / いくらかのひらめきを。"], ["", "That may be meaningful / to your music / in the future.", "それは意味があるかもしれません / あなたの音楽にとって / 将来。"], ["Mr. Mori", "Some students want to become / a member of a club activity, / and others don't.", "生徒の中には〜になりたい人もいます / クラブ活動の一員に、/ そして（そうでない）人もいます。"], ["", "I think both cases are / {{(2)③:(OK)}} / because every student / has his or her own circumstance.", "私は思います、どちらの場合も〜と / {{(2)③:（よい）}} / なぜならすべての生徒は / それぞれの事情があるからです。"], ["", "If there is a school rule / that students must be in a club activity, / some students may be confused.", "もし校則があれば / 生徒はクラブ活動に入らなければならないという、/ 困る生徒もいるかもしれません。"]]}, {"t": "問7 長文：インターネットの歴史", "lines": [["", "Today, / we often use the Internet / when we want to know the latest news, / when we want to know how to cook a dish, / when we want to know a meaning of an English word, / and so on.", "今日、/ 私たちはよくインターネットを使います / 最新のニュースを知りたいとき、/ 料理の作り方を知りたいとき、/ 英単語の意味を知りたいとき、/ など。"], ["", "Thanks to this convenient tool, / we can get the information / we need / very quickly.", "この便利な道具のおかげで、/ 私たちは情報を得られます / 必要な / とても速く。"], ["", "The Internet has become / one of the most important daily tools / today.", "インターネットは〜になりました / 最も大切な日常の道具のひとつ / 今日。"], ["", "By the way, / do you know / {{(1)①:when and how / the Internet was born?}}", "ところで、/ あなたは知っていますか / {{(1)①:いつ、どのように / インターネットが生まれたか。}}"], ["", "I don't think / you know those things.", "私は思いません / あなたがそれらのことを知っているとは。"], ["", "Now, / let's read the story about / {{(1)①:(the history of the Internet).}}", "さあ、/ 〜についての話を読みましょう / {{(1)①:（インターネットの歴史）。}}"], ["", "In the United States / about 60 years ago, / government researchers used computers / for their work.", "アメリカで / 約60年前、/ 政府の研究者はコンピュータを使っていました / 仕事のために。"], ["", "The computers at that time / were so big and heavy / that it was {{(1)②:(hard)}} / to move them.", "その当時のコンピュータは / とても大きくて重かったので / 〜は{{(1)②:（難しかった）}} / それらを動かすのが。"], ["", "So, / it was not easy / to exchange the data / in computers / at that time.", "だから、/ 簡単ではありませんでした / データをやり取りするのは / コンピュータの中の / その当時。"], ["", "The researchers had to go / to the computer / to get the data / when they needed them.", "研究者は行かなければなりませんでした / コンピュータのところへ / データを得るために / 必要なとき。"], ["", "Or, / when the computer was not near them, / the researchers called another researcher / working near the computer.", "あるいは、/ コンピュータが近くにないとき、/ 研究者は別の研究者に電話しました / コンピュータの近くで働いている。"], ["", "Then / the researchers asked him or her / to post a copy of the data.", "それから / 研究者は彼または彼女に頼みました / データのコピーを郵送するように。"], ["", "It took a long time.", "長い時間がかかりました。"], ["", "{{(2)a:Many researchers wanted / to improve / the bad situation.}}", "{{(2)a:多くの研究者は望みました / 改善することを / その悪い状況を。}}"], ["", "By the way, / do you know / the first artificial satellite?", "ところで、/ あなたは知っていますか / 最初の人工衛星を。"], ["", "It is the Sputnik / of the Soviet Union / in 1957.", "それはスプートニクです / ソビエト連邦の / 1957年の。"], ["", "When the United States heard / the news of the Sputnik, / the country became afraid.", "アメリカが聞いたとき / スプートニクのニュースを、/ その国は不安になりました。"], ["", "At that time, / the two countries didn't like each other, / so the United States thought / that the Soviet Union might use the satellite / for the wars against the United States.", "その当時、/ 2つの国は互いに好きではなかったので、/ アメリカは考えました / ソビエト連邦がその衛星を使うかもしれないと / アメリカとの戦争に。"], ["", "In 1967, / the United States started to think / {{(2)b:about how to exchange the data / even after the wars.}}", "1967年、/ アメリカは考え始めました / {{(2)b:どのようにデータをやり取りするかを / 戦争の後でさえ。}}"], ["", "The wars didn't happen, / but the United States made / {{(2)b:the first computer networking system / in 1969.}}", "戦争は起こりませんでした、/ しかしアメリカはつくりました / {{(2)b:最初のコンピュータネットワークシステムを / 1969年に。}}"], ["", "Thanks to this system, / the researchers were able to exchange the data / easily.", "このシステムのおかげで、/ 研究者はデータをやり取りできました / 簡単に。"], ["", "But / there were some problems / in the system.", "しかし / いくつかの問題がありました / そのシステムには。"], ["", "The most serious one was, / {{(3):\"There were a few people / who were allowed to use the system.\"}}", "最も深刻なものは、/ {{(3):「少数の人しかいなかった / システムを使うことを許された。」}}"], ["", "To solve this problem, / other systems were created.", "この問題を解決するために、/ 他のシステムがつくられました。"], ["", "But / there was another problem.", "しかし / 別の問題がありました。"], ["", "That was, / \"Each networking system couldn't communicate / with each other.\"", "それは、/ 「それぞれのネットワークシステムはやり取りできなかった / 互いに。」"], ["", "Technologies greatly developed / in about 25 years / after the Sputnik.", "科学技術は大きく発達しました / 約25年で / スプートニクの後。"], ["", "A new technology / was introduced / to the computer networking systems.", "新しい技術が / 導入されました / コンピュータネットワークシステムに。"], ["", "Thanks to this technology, / different computer networking systems / succeeded in communicating / with each other / at last.", "この技術のおかげで、/ 異なるコンピュータネットワークシステムは / やり取りすることに成功しました / 互いに / ついに。"], ["", "It was on January 1, 1983, / and the day is known / as \"the birthday of the Internet.\"", "それは1983年1月1日でした、/ そしてその日は知られています / 「インターネットの誕生日」として。"]]}], "A6": [{"t": "問6 対話文：サヤカと先生の将来の夢", "lines": [["Sayaka", "Ms. Brown. / I have a problem / about my future job.", "ブラウン先生。/ 私は悩みがあります / 将来の仕事について。"], ["", "Will you please listen / to me?", "聞いてくださいませんか / 私の話を。"], ["Ms. Brown", "Sure. / Go ahead.", "もちろん。/ どうぞ。"], ["Sayaka", "Thanks. / {{(1)①:I have a dream / to become a staff member / of making anime / in the future.}}", "ありがとう。/ {{(1)①:私は夢があります / スタッフの一員になる / アニメを作る / 将来。}}"], ["", "I've liked drawing pictures / since I was a child.", "私は絵を描くのが好きでした / 子供のころから。"], ["", "I'm also a big fan of anime, / so I want to use my ability / for my favorite thing.", "私はアニメの大ファンでもあります、/ だから私の能力を使いたいのです / 私の大好きなことのために。"], ["Ms. Brown", "Great. / I hope ①(　　). / Now, / what's your problem?", "すばらしい。/ 私は①(　　)と願っています。/ さて、/ 悩みは何？"], ["Sayaka", "Actually, / my parents are strongly against my dream.", "実は、/ 両親が私の夢に強く反対しているのです。"], ["", "{{(3)(a):They say that / an animator is not steady / and a silly job.}}", "{{(3)(a):彼らは言います / アニメーターは堅実ではなく / 取るに足りない仕事だと。}}"], ["", "They want me to get a job / like a teacher or a doctor.", "彼らは私に仕事に就いてほしいのです / 教師や医者のような。"], ["Ms. Brown", "Wait a minute.... / {{(3)(b):I found an article about that / on an online news site / this morning.}}", "ちょっと待って…。/ {{(3)(b):私はそれについての記事を見つけたの / オンラインのニュースサイトで / 今朝。}}"], ["", "OK. / I got it. / Look at this site.", "いいわ。/ 見つけた。/ このサイトを見て。"], ["", "Here is Chart A. / This shows / \"What do junior high school students in Japan want to be / in the future?\"", "これがチャートAです。/ これは示しています / 「日本の中学生は何になりたいか / 将来」。"], ["", "Look at this. / \"Comic artist or animator\" is the most popular.", "これを見て。/ 「漫画家またはアニメーター」が一番人気です。"], ["Sayaka", "Wow! / A lot of students have the same dream / as me!", "わあ！ / 多くの生徒が同じ夢を持っています / 私と。"], ["Ms. Brown", "Here is Chart B. / This is the result of / \"What do you want your sons or daughters to become / in the future?\"", "これがチャートBです。/ これは結果です / 「あなたは息子や娘に何になってほしいか / 将来」の。"], ["Sayaka", "Well..., / there are few differences / between the two.", "ええと…、/ ほとんど違いがありません / 二つの間に。"], ["", "No.1, 2, 3, and 5 of Chart A / are the jobs / that are also seen in Chart B.", "チャートAの1、2、3、5位は / 職業です / チャートBにも見られる。"], ["", "{{(2):Chart B shows that / \"Doctor\" and \"Government worker\" / are popular among parents.}}", "{{(2):チャートBは示しています / 「医者」と「公務員」が / 親たちに人気だと。}}"], ["", "Of course, / I understand that those jobs are great. / But ②(　　).", "もちろん、/ それらの職業がすばらしいことは分かります。/ でも②(　　)。"], ["Ms. Brown", "{{(3)(a):Parents usually want their children / to be always happy.}}", "{{(3)(a):親はたいてい子供に望みます / いつも幸せであることを。}}"], ["", "So, / they want their children to get a job / which is generally thought it is steady.", "だから、/ 彼らは子供に仕事に就いてほしいのです / 一般的に堅実だと考えられている。"], ["Sayaka", "The world is changing so fast today.", "世界は今日とても速く変わっています。"], ["", "No one knows / what is steady / and what is not steady / in the future.", "だれにも分かりません / 何が堅実か / そして何が堅実でないか / 将来。"], ["Ms. Brown", "You may be right.", "あなたは正しいかもしれません。"], ["", "A long time ago, / who could imagine / that anime became so popular / around the world?", "ずっと昔、/ だれが想像できたでしょう / アニメがとても人気になると / 世界中で。"], ["", "Today, / it is grown to be a trade item / for Japan.", "今日、/ それは貿易品に成長しました / 日本にとって。"], ["", "Also, / thanks to it, / {{(4):many fans of Japan are born / around the world.}}", "また、/ それのおかげで、/ {{(4):日本のファンがたくさん生まれています / 世界中で。}}"], ["", "{{(4):Many of them often come to Japan / and travel all over.}}", "{{(4):彼らの多くがよく日本に来て / 日本中を旅行します。}}"], ["", "In short, / anime is important economically.", "要するに、/ アニメは経済的に重要です。"], ["", "So, / I think / you should be proud / of having a dream / to be an animator.", "だから、/ 私は思います / あなたは誇りを持つべきだと / 夢を持つことに / アニメーターになるという。"]]}, {"t": "問7 メール文：オーストラリアの姉妹校の生徒が来る", "lines": [["Toshi", "Hi Nancy,", "こんにちは、ナンシー、"], ["", "You are taking a sick day, / right? / Are you OK?", "あなたは病気で休んでいるのですね、/ そうですよね？ / 大丈夫？"], ["", "You may join the next meeting, / so I'm going to tell you / about the things / that were discussed / at today's meeting.", "あなたは次の会議には参加できるかもしれないので、/ あなたに伝えます / ことについて / 話し合われた / 今日の会議で。"], ["", "The topic of the meeting was / \"The students from our sister school in Australia / will visit our school / next month.\"", "会議のテーマは / 「私たちの姉妹校オーストラリアの生徒が / 私たちの学校を訪れる / 来月」でした。"], ["", "Five students from the school / are going to come to Japan / on September 20.", "その学校の5人の生徒が / 日本に来る予定です / 9月20日に。"], ["", "They will go to Sakura Station / from airport / by train / and get off at the station.", "彼らは桜駅に行きます / 空港から / 電車で / そしてその駅で降ります。"], ["", "They will have lunch / near the station / and see the town / for a few hours.", "彼らは昼食を食べます / 駅の近くで / そして町を見ます / 数時間。"], ["", "Then, / they will get on a train again / and come to Midori Station, / our nearest station.", "それから、/ 彼らはまた電車に乗って / 緑駅に来ます、/ 私たちの最寄りの駅です。"], ["", "Finally, / they will come to our school / by bus / at around 2 p.m.", "最後に、/ 彼らは私たちの学校に来ます / バスで / 午後2時ごろに。"], ["", "We are going to have a welcome party / at 2:30 / at the school gym.", "私たちは歓迎会を開く予定です / 2時30分に / 学校の体育館で。"], ["", "At the party, / what should we do for them? / It has not been decided yet.", "パーティーでは、/ 彼らのために何をするべきでしょう？ / まだ決まっていません。"], ["", "Please tell me your ideas / if you have good ones.", "あなたの考えを教えてください / いい考えがあれば。"], ["", "Next day, / at English class, / they will make a speech / to tell us / how they spend at their school.", "次の日、/ 英語の授業で、/ 彼らはスピーチをします / 私たちに伝える / 彼らが学校でどう過ごすかを。"], ["", "After school, / we'll take them to a fall festival / held at the temple near our school.", "放課後、/ 私たちは彼らを秋祭りに連れて行きます / 学校の近くのお寺で開かれる。"], ["", "There, / they can try traditional Japanese dance, / kingyo-sukui, / and so on.", "そこで、/ 彼らは日本の伝統舞踊を体験できます、/ 金魚すくい、/ など。"], ["", "Those activities help them learn / about Japanese cultures.", "それらの活動は彼らが学ぶのに役立ちます / 日本の文化について。"], ["", "I'm sure ①(　　).", "きっと①(　　)。"], ["", "You don't have to answer me soon. / After you become fine, / please let me know your ideas.", "すぐに返事をしなくていいです。/ 元気になったら、/ あなたの考えを知らせてください。"], ["", "Bye for now, / Toshi", "ではまた、/ トシ"], ["Nancy", "Hi Toshi,", "こんにちは、トシ、"], ["", "Thank you / for your kind e-mail.", "ありがとう / 親切なメールを。"], ["", "Gradually / I'm getting better, / and I'll be able to go to school / next week.", "徐々に / 私は良くなっています、/ そして学校に行けるようになります / 来週。"], ["", "Your e-mail told me / what to do / for the students from Australia. / Now, / I'm going to write my opinions.", "あなたのメールは私に教えてくれました / 何をすべきか / オーストラリアの生徒のために。/ では、/ 私の意見を書きます。"], ["", "First, / it is better / that the party starts at 3 p.m.", "まず、/ 〜のほうがいいです / パーティーが午後3時に始まる。"], ["", "{{(4):The streets from Midori Station to our school / are sometimes very busy / in the afternoon.}}", "{{(4):緑駅から私たちの学校までの道は / ときどきとても混みます / 午後は。}}"], ["", "Also, / ②(　　) / after a long trip.", "また、/ ②(　　) / 長旅のあとで。"], ["", "We should give them a short break / before the party.", "私たちは彼らに小休止を与えるべきです / パーティーの前に。"], ["", "Second, / the party should be the one / that the Australian students can communicate with us.", "次に、/ パーティーはそういうものであるべきです / オーストラリアの生徒が私たちと交流できる。"], ["", "They cannot understand Japanese well, / so how about a quiz competition in English?", "彼らは日本語をよく理解できません、/ だから英語でのクイズ大会はどうでしょう？"], ["", "{{(2)(b):Both Japanese students and Australian students / give each other some quizzes / about interesting things / like geography, customs, and life styles of each country.}}", "{{(2)(b):日本の生徒もオーストラリアの生徒も / たがいにいくつかクイズを出し合います / おもしろいことについて / 各国の地理、習慣、生活様式のような。}}"], ["", "Third, / I think it is a very good idea / to take them to our fall festival.", "三つ目に、/ 私はとてもいい考えだと思います / 彼らを私たちの秋祭りに連れて行くのは。"], ["", "How about putting them on yukata / at that time? / If they wear it, / they will realize they are in Japan.", "彼らにゆかたを着せるのはどうでしょう / そのとき？ / もしそれを着れば、/ 彼らは日本にいることを実感するでしょう。"], ["", "That's all. / See you at school next week!", "以上です。/ 来週学校で会いましょう！"], ["", "Best, / Nancy", "では、/ ナンシー"]]}], "A7": [{"t": "問6 会話文：佐渡金山と観光公害", "lines": [["Mami", "Judy, / I have an aunt / in Niigata Prefecture.", "ジュディ、/ 私にはおばがいるの / 新潟県に。"], ["", "Do you know that the Sado Kinzan / was added to the list of World Heritage Sites / last year?", "あなたは知っている？ 佐渡金山が / 世界遺産のリストに加えられたことを / 昨年。"], ["Judy", "Well, / what's Sado? / What's Kinzan?", "えっと、/ 佐渡って何？ / 金山って何？"], ["Mami", "Sado is the name of an island / in Niigata Prefecture / and Kinzan means \"gold mine.\"", "佐渡は島の名前よ / 新潟県の / そして金山は「金鉱山」という意味よ。"], ["", "The Sado Kinzan was developed / long time ago, / and it's historically important / for Japan.", "佐渡金山は開発されて / ずっと昔に、/ そして歴史的に重要なの / 日本にとって。"], ["Ken", "I knew the news / from a TV program.", "私はそのニュースを知っていたよ / テレビ番組で。"], ["", "On the program, / people in the island looked happy / when they knew the news.", "その番組では、/ 島の人たちはうれしそうだった / そのニュースを知ったとき。"], ["Brian", "Well, / I often hear / that a lot of people living around a popular site / want the site to become / one of World Heritage Sites / or more famous. / Why?", "ええと、/ 私はよく聞くよ / 有名な場所の周りに住む多くの人が / その場所が〜になることを望んでいると / 世界遺産の一つ / あるいはもっと有名に。/ なぜ？"], ["Ken", "When the site becomes one, / {{(1)①:many visitors will come.}}", "その場所がそうなると、/ {{(1)①:たくさんの観光客が来るだろう。}}"], ["", "Then, / the town may become more popular / and get money from them.", "そうすると、/ 町はもっと人気になり / 彼らからお金を得るかもしれない。"], ["Judy", "I see. / Kamakura in Kanagawa Prefecture / is one of the popular cities in Japan, / right?", "なるほど。/ 神奈川県の鎌倉は / 日本の人気の都市の一つよね、/ そうでしょう？"], ["", "I visited the city the other day, / but it wasn't so exciting.", "先日その市を訪れたけど、/ あまり楽しくなかったの。"], ["", "The city was too crowded / on that day!", "その市は混みすぎていた / その日は！"], ["", "I went to many famous sites, / but I couldn't go into some.", "私は多くの有名な場所に行ったけど、/ 入れないところもあった。"], ["", "One site wasn't open in the morning yet, / and the others didn't sell tickets there.", "ある場所は午前中まだ開いていなくて、/ ほかの場所はそこで切符を売っていなかった。"], ["", "Also, / I gave up the sweets / which I wanted to eat / because too many customers were waiting / in front of the shop.", "また、/ 私はスイーツをあきらめた / 食べたかった / あまりに多くのお客が待っていたので / お店の前で。"], ["Brian", "It's \"overtourism.\"", "それは「オーバーツーリズム」だよ。"], ["", "You often hear the word / from TV news programs these days, / don't you?", "あなたはよくその言葉を聞くよね / テレビのニュース番組で最近、/ そうでしょう？"], ["Mami", "Yes. / Popular cities, / such as Kamakura and Kyoto, / are often appeared on TV / as the examples of the problem.", "ええ。/ 人気の都市は、/ 鎌倉や京都のような、/ よくテレビに出てくるわ / その問題の例として。"], ["", "{{(2):These cities are popular /
